<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เลขสติ๊กเกอร์สรรพากร — แจ้งเพิ่ม & ติดตามสถานะ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root{ --pc-black:#1a1d20; --pc-yellow:#2e934a; --pc-green:#2e934a; --bg:#eef1f4; --blue:#2f5fb3; }
  *{ box-sizing:border-box; }
  body{ font-family:'Kanit',sans-serif; background:var(--bg); color:var(--pc-black); margin:0; padding-bottom:60px; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .topbar{ background:#2e934a; color:#fff; padding:13px 18px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:30; flex-wrap:wrap; }
  .topbar h1{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:1.04rem; margin:0; display:flex; align-items:center; gap:9px; }
  .topbar h1 i{ color:var(--pc-yellow); }
  .topbar .sub{ font-size:.72rem; color:#aab0b8; font-weight:400; margin-top:2px; }
  .roles{ margin-left:auto; display:flex; gap:7px; align-items:center; }
  .role{ border:0; background:rgba(255,255,255,.12); color:#fff; font-family:inherit; font-weight:600; font-size:.85rem; border-radius:10px; padding:9px 14px; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .role.on{ background:var(--pc-yellow); color:#1a1d20; }
  .hqpill{ background:var(--pc-yellow); color:#1a1d20; font-weight:700; font-size:.85rem; border-radius:10px; padding:9px 14px; display:flex; align-items:center; gap:7px; }
  body.hq .roles .role, body.hq .roles .gearlink{ display:none !important; }
  .role:hover:not(.on){ background:rgba(255,255,255,.22); }
  .gearlink{ border:0; background:rgba(255,255,255,.12); color:#fff; font-family:inherit; font-weight:600; font-size:.85rem; border-radius:10px; padding:9px 14px; cursor:pointer; display:flex; align-items:center; gap:7px; text-decoration:none; }
  .gearlink:hover{ background:rgba(255,255,255,.22); }

  .wrap{ max-width:960px; margin:0 auto; padding:18px 16px 0; }

  /* identity bar for branch/FRC */
  .idbar{ background:#fff; border:1px solid #e7eaee; border-radius:14px; padding:12px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .idbar .who{ font-size:.84rem; color:#5a616b; }
  .idbar select{ border:1.6px solid #dde2e7; border-radius:10px; padding:8px 12px; font-family:inherit; font-size:.9rem; background:#fff; }
  .linkbanner{ background:linear-gradient(90deg,#fff8ec,#fffdf7); border:1px solid #f3d99a; border-radius:14px; padding:13px 16px; margin-bottom:16px; display:flex; align-items:center; gap:12px; }
  .linkbanner i{ color:#c9870a; font-size:1.3rem; }
  .linkbanner b{ color:#9a6700; }

  .seg{ display:flex; gap:8px; background:#f1f4f7; border-radius:12px; padding:5px; margin-bottom:18px; }
  .seg button{ flex:1; border:0; background:transparent; font-family:inherit; font-weight:600; font-size:.92rem; color:#5a616b; border-radius:9px; padding:11px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px; }
  .seg button.on{ background:#fff; color:var(--pc-black); box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .seg-n{ font-family:'JetBrains Mono',monospace; font-size:.76rem; font-weight:700; background:#e3e8ee; color:#5a616b; border-radius:7px; padding:1px 8px; min-width:22px; text-align:center; }
  .seg button.on .seg-n{ background:var(--pc-green); color:#fff; }

  .card{ background:#fff; border:1px solid #e7eaee; border-radius:16px; padding:18px 20px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:18px; }
  .card h2{ font-size:1.04rem; font-weight:700; margin:0 0 3px; display:flex; align-items:center; gap:9px; }
  .card h2 i{ color:var(--pc-green); }
  .card .sub{ color:#8a9099; font-size:.85rem; margin:0 0 15px; line-height:1.45; }

  .fld{ margin-bottom:14px; }
  .fld label{ display:block; font-size:.82rem; font-weight:600; color:#5a616b; margin-bottom:6px; }
  .fld label .req{ color:#c0392b; }
  .inp, select.inp{ width:100%; border:1.6px solid #dde2e7; border-radius:11px; padding:11px 13px; font-family:inherit; font-size:.95rem; background:#fff; color:var(--pc-black); }
  .inp:focus{ outline:none; border-color:var(--pc-green); }
  .hint{ font-size:.76rem; color:#8a9099; margin-top:5px; line-height:1.4; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }

  .btn{ border:0; border-radius:12px; font-family:inherit; font-weight:700; font-size:1rem; padding:13px 22px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:9px; }
  .btn-g{ background:var(--pc-green); color:#fff; } .btn-g:disabled{ background:#cfd5db; cursor:not-allowed; }
  .btn-d{ background:var(--pc-black); color:#fff; } .btn-r{ background:#c0392b; color:#fff; }
  .btn-o{ background:#fff; border:1.6px solid #dde2e7; color:#3a4150; } .btn-o:hover{ border-color:#b6bcc4; }
  .btn-y{ background:var(--pc-yellow); color:#1a1d20; }
  .btn-sm{ padding:9px 15px; font-size:.86rem; border-radius:10px; }

  /* branch rows table */
  .brtbl{ width:100%; border-collapse:collapse; font-size:.88rem; margin-top:8px; }
  .brtbl th{ text-align:left; font-size:.7rem; color:#8a9099; font-weight:700; padding:7px 10px; border-bottom:2px solid #eef1f4; text-transform:uppercase; letter-spacing:.4px; }
  .brtbl td{ padding:8px 8px; border-bottom:1px solid #f1f4f7; vertical-align:middle; }
  .brtbl input{ width:100%; border:1.4px solid #dde2e7; border-radius:9px; padding:8px 10px; font-family:'JetBrains Mono',monospace; font-size:.86rem; }
  .brtbl input:focus{ outline:none; border-color:var(--pc-green); }
  .brtbl .bn{ font-weight:600; font-family:'Kanit',sans-serif; }
  .brtbl .bid{ font-family:'JetBrains Mono',monospace; font-size:.72rem; color:#8a9099; }
  .xbtn{ border:0; background:#fdecea; color:#c0392b; width:30px; height:30px; border-radius:8px; cursor:pointer; }
  .stk{ display:flex; align-items:center; gap:6px; }
  .stk .thumb{ width:34px; height:34px; border-radius:7px; object-fit:cover; border:1px solid #e7eaee; }
  .stk label{ font-size:.74rem; color:var(--blue); cursor:pointer; font-weight:600; white-space:nowrap; }
  .brtbl .baddr{ font-size:.72rem; color:#8a9099; margin-top:4px; line-height:1.4; max-width:230px; }
  .brtbl .baddr i{ color:#c9870a; margin-right:3px; }
  .rowflds{ margin-top:8px; display:flex; flex-direction:column; gap:5px; max-width:250px; }
  .rowflds .rfl{ font-size:.66rem; font-weight:700; color:#8a9099; }
  .rowflds textarea, .rowflds input{ width:100%; border:1.4px solid #dde2e7; border-radius:8px; padding:6px 9px; font-family:'Kanit',sans-serif; font-size:.8rem; }
  .rowflds input.mono{ font-family:'JetBrains Mono',monospace; letter-spacing:1px; }
  .rowflds textarea:focus, .rowflds input:focus{ outline:none; border-color:var(--pc-green); }
  .vchk{ font-size:.66rem; color:#2c4a82; margin-top:4px; font-weight:600; display:flex; align-items:center; gap:4px; }
  .docpick{ display:inline-flex; align-items:center; gap:6px; border:1.5px dashed #c9870a; color:#9a6700; background:#fff8ec; border-radius:9px; padding:7px 11px; font-size:.78rem; font-weight:600; cursor:pointer; white-space:nowrap; }
  .docpick:hover{ background:#fff3d6; }
  .verifybox{ background:#eef4ff; border:1px solid #cfe0fb; border-radius:11px; padding:10px 14px; font-size:.8rem; color:#2c4a82; line-height:1.5; margin-bottom:10px; }
  .verifybox i{ color:var(--blue); }

  .radios{ display:flex; flex-direction:column; gap:9px; }
  .radio{ display:flex; align-items:flex-start; gap:10px; border:1.6px solid #dde2e7; border-radius:12px; padding:11px 14px; cursor:pointer; }
  .radio.on{ border-color:var(--pc-green); background:#f3fbf6; }
  .radio input{ margin-top:3px; }
  .radio .rt{ font-weight:600; font-size:.9rem; }
  .radio .rd{ font-size:.78rem; color:#8a9099; margin-top:2px; }

  /* stats */
  .stats{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .stat{ flex:1; min-width:110px; border:1px solid #e7eaee; border-radius:12px; padding:12px 14px; text-align:center; background:#fff; }
  .stat .n{ font-family:'Montserrat',sans-serif; font-weight:900; font-size:1.6rem; line-height:1; }
  .stat .l{ font-size:.74rem; color:#8a9099; margin-top:6px; font-weight:600; }
  .stat.ok .n{ color:var(--pc-green); } .stat.bad .n{ color:#c0392b; } .stat.warn .n{ color:#c9870a; } .stat.blue .n{ color:var(--blue); }

  /* record card */
  .rec{ border:1px solid #e7eaee; border-radius:14px; padding:15px 17px; margin-bottom:13px; background:#fff; }
  .rec.bad{ border-left:4px solid #c0392b; } .rec.ok{ border-left:4px solid var(--pc-green); }
  .rec .rtop{ display:flex; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .rec .rbn{ font-weight:700; font-size:1.02rem; }
  .rec .rid{ font-family:'JetBrains Mono',monospace; font-size:.72rem; color:#8a9099; }
  .pill{ font-size:.72rem; font-weight:700; border-radius:999px; padding:3px 11px; display:inline-flex; align-items:center; gap:5px; margin-left:auto; }
  .pill.ok{ background:#eafaf1; color:#1d7a4d; } .pill.warn{ background:#eaf4ee; color:#9a6700; }
  .pill.blue{ background:#eef4ff; color:#2c4a82; } .pill.bad{ background:#fdecea; color:#c0392b; }
  .rmeta{ display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; }
  .mtag{ font-size:.78rem; font-weight:600; color:#5a616b; background:#f1f4f7; border-radius:7px; padding:4px 11px; display:inline-flex; align-items:center; gap:6px; }
  .mtag i{ color:#9aa1aa; } .mtag b{ font-family:'JetBrains Mono',monospace; }
  .vischip{ font-size:.72rem; font-weight:700; border-radius:7px; padding:3px 9px; background:#f3ecff; color:#6b3fa0; display:inline-flex; align-items:center; gap:5px; }

  .steps{ display:flex; align-items:flex-start; margin:18px 0 4px; }
  .stp{ flex:1; display:flex; flex-direction:column; align-items:center; gap:7px; position:relative; }
  .stp .dot{ width:30px; height:30px; border-radius:50%; background:#e7eaee; color:#aab0b8; display:flex; align-items:center; justify-content:center; font-size:.78rem; z-index:1; }
  .stp .slbl{ font-size:.72rem; font-weight:600; color:#9aa1aa; text-align:center; line-height:1.25; max-width:90px; }
  .stp::before{ content:''; position:absolute; top:14px; left:-50%; width:100%; height:3px; background:#e7eaee; z-index:0; }
  .stp:first-child::before{ display:none; }
  .stp.done .dot{ background:var(--pc-green); color:#fff; } .stp.done .slbl{ color:#1d7a4d; } .stp.done::before{ background:var(--pc-green); }
  .stp.active .dot{ background:var(--pc-yellow); color:#1a1d20; box-shadow:0 0 0 4px #fdf0c8; } .stp.active .slbl{ color:#9a6700; } .stp.active::before{ background:var(--pc-green); }
  .stp.err .dot{ background:#c0392b; color:#fff; box-shadow:0 0 0 4px #fadbd6; } .stp.err .slbl{ color:#c0392b; } .stp.err::before{ background:var(--pc-green); }

  .racts{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .hist{ margin-top:13px; border-top:1px dashed #e7eaee; padding-top:11px; }
  .hist .hr{ display:flex; gap:9px; font-size:.8rem; color:#5a616b; padding:3px 0; }
  .hist .hr i{ color:var(--pc-green); margin-top:2px; font-size:.7rem; }
  .hist .ht{ font-family:'JetBrains Mono',monospace; font-size:.7rem; color:#9aa1aa; margin-left:auto; white-space:nowrap; }

  .empty{ text-align:center; color:#9aa1aa; padding:46px 18px; }
  .empty i{ font-size:2.1rem; display:block; margin-bottom:11px; opacity:.5; }

  /* modal */
  .ov{ position:fixed; inset:0; background:rgba(20,22,25,.55); display:none; align-items:center; justify-content:center; z-index:60; padding:18px; }
  .ov.on{ display:flex; }
  .modal{ background:#fff; border-radius:18px; width:560px; max-width:100%; max-height:88vh; display:flex; flex-direction:column; overflow:hidden; }
  .mhead{ padding:16px 20px; border-bottom:1px solid #eef1f4; display:flex; align-items:center; gap:10px; }
  .mhead h3{ margin:0; font-size:1.05rem; font-weight:700; } .mhead h3 i{ color:var(--pc-green); margin-right:7px; }
  .mhead .x{ margin-left:auto; border:0; background:#f1f4f7; width:34px; height:34px; border-radius:9px; cursor:pointer; font-size:1rem; }
  .mbody{ padding:16px 20px; overflow:auto; }
  .mfoot{ padding:14px 20px; border-top:1px solid #eef1f4; display:flex; gap:10px; align-items:center; }
  .srow{ display:flex; gap:9px; margin-bottom:12px; }
  .blist{ border:1px solid #eef1f4; border-radius:12px; overflow:auto; max-height:340px; }
  .brow{ display:flex; align-items:center; gap:11px; padding:9px 13px; border-bottom:1px solid #f4f6f9; cursor:pointer; }
  .brow:hover{ background:#fafbfc; } .brow.sel{ background:#f3fbf6; }
  .brow input{ width:17px; height:17px; }
  .brow .nm{ font-weight:600; font-size:.9rem; } .brow .meta{ font-size:.72rem; color:#8a9099; }
  .brow .cc{ margin-left:auto; font-size:.68rem; color:#8a9099; background:#f1f4f7; border-radius:6px; padding:2px 8px; }
</style>
</head>
<body>
<div class="topbar">
  <div>
    <h1><i class="fas fa-receipt"></i> เลขสติ๊กเกอร์สรรพากร</h1>
    <div class="sub">แจ้งเพิ่มเลขลงระบบ POS · ติดตามสถานะ · ตรวจใบเสร็จ</div>
  </div>
  <div class="roles">
    <button class="role" data-role="HO"><i class="fas fa-user-pen"></i> ผู้แจ้ง (HO)</button>
    <button class="role" data-role="IT"><i class="fas fa-screwdriver-wrench"></i> IT</button>
    <button class="role" data-role="BRANCH"><i class="fas fa-store"></i> สาขา / FRC</button>
    <a class="gearlink" href="RD Cancel &amp; Re-register.html"><i class="fas fa-rotate"></i> แจ้งยกเลิก/จดใหม่</a>
    <a class="gearlink" href="RD Access Settings.html"><i class="fas fa-shield-halved"></i> ตั้งค่าสิทธิ์ (BD)</a>
    <a class="gearlink" href="RD Usage Guide.html"><i class="fas fa-circle-question"></i> วิธีใช้งาน</a>
  </div>
</div>

<div class="wrap" id="wrap"></div>

<!-- branch picker modal -->
<div class="ov" id="ovPick">
  <div class="modal">
    <div class="mhead"><h3><i class="fas fa-store"></i> เลือกสาขา</h3><button class="x" onclick="closePick()">✕</button></div>
    <div class="mbody">
      <div class="srow">
        <input class="inp" id="pkSearch" placeholder="ค้นหาสาขา / รหัส…" oninput="renderPick()" style="flex:1">
        <select class="inp" id="pkCompany" onchange="renderPick()" style="flex:1"></select>
      </div>
      <div class="blist" id="pkList"></div>
    </div>
    <div class="mfoot">
      <span id="pkCount" style="font-size:.85rem;color:#5a616b;font-weight:600;">เลือกแล้ว 0</span>
      <button class="btn btn-g btn-sm" style="margin-left:auto" onclick="applyPick()"><i class="fas fa-check"></i> เพิ่มในรายการ</button>
    </div>
  </div>
</div>

<script src="js/branch-master.js"></script>
<script src="js/rd-sticker.js"></script>
<script>
RD.seed();
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- session ----------
const params = new URLSearchParams(location.search);
const linkToken = params.get('link');
const activeLink = linkToken ? RD.linkByToken(linkToken) : null;

const sess = {
  role: 'HO',
  tab: 'new',
  branchLogin: (RD.branches()[0]||{}).id,
  // form state
  rows: [],     // {branchId, cash, shop, doc}
  vis: 'company' // ค่าเริ่มต้น: บริษัทเห็นเฉพาะสาขาในบริษัทตัวเอง (ตั้งค่าเพิ่มที่หน้าตั้งค่าสิทธิ์)
};
if (activeLink && activeLink.status === 'active') {
  sess.role = 'BRANCH';
  sess.fromLink = true;
  sess.scopeIds = activeLink.scopeIds.slice();
  sess.branchLogin = activeLink.scopeIds[0];
  sess.tab = 'mine';
} else {
  const rp = params.get('role');
  if (rp === 'HO' || rp === 'IT' || rp === 'BRANCH') {
    sess.role = rp;
    sess.tab = rp === 'HO' ? 'new' : (rp === 'IT' ? 'queue' : 'verify');
  }
}
// Admin HQ = แจ้งเพิ่มเลขได้ + ดูสถานะทุกสาขา · บัญชี (ACC) = ดูสถานะอย่างเดียว (read-only)
const _pcRole = (function(){ try{ return localStorage.getItem('pc_role')||''; }catch(e){ return ''; } })();
const IS_HQ  = _pcRole==='Admin HQ' || params.get('role')==='HQ';
const IS_ACCV = _pcRole==='ACC' || params.get('role')==='ACC';
const MONITOR = IS_HQ || IS_ACCV;
const CAN_ADD = IS_HQ;            // ACC = ดูอย่างเดียว
if (MONITOR){ sess.role='HQ'; sess.tab = CAN_ADD ? 'new' : 'track';
  try{ document.body.classList.add('hq'); var _rb=document.querySelector('.roles');
    var _pill = CAN_ADD ? '<i class="fas fa-building-shield"></i> Admin HQ' : '<i class="fas fa-eye"></i> บัญชี · ดูสถานะ';
    if(_rb) _rb.insertAdjacentHTML('afterbegin','<span class="hqpill">'+_pill+'</span>'); }catch(e){}
}

function viewer(){
  if (sess.role === 'HO') return { role:'HO' };
  if (sess.role === 'IT') return { role:'IT' };
  return { role: sess.fromLink?'FRC':'BRANCH', branchId: sess.branchLogin,
           scopeIds: sess.fromLink ? sess.scopeIds : [sess.branchLogin] };
}

// ---------- top role buttons ----------
document.querySelectorAll('.role').forEach(b=>{
  b.onclick = ()=>{ if(sess.fromLink) return; sess.role=b.dataset.role;
    sess.tab = b.dataset.role==='HO'?'new':(b.dataset.role==='IT'?'queue':'verify'); render(); };
});

// ====================================================== RENDER
function render(){
  document.querySelectorAll('.role').forEach(b=>b.classList.toggle('on', b.dataset.role===sess.role));
  const w = $('#wrap');
  let html = '';

  if (sess.fromLink){
    const b = RD.branch(sess.branchLogin);
    html += `<div class="linkbanner"><i class="fas fa-link"></i>
      <div>คุณกำลังใช้งานผ่าน<b> ลิงก์เฉพาะสาขา</b> ที่ทีม BD ส่งให้ — เห็นและแจ้งได้เฉพาะ
      <b>${esc(b?b.nameTH:'')} (${esc(sess.branchLogin)})</b> เท่านั้น · ไม่ต้องล็อกอิน</div></div>`;
  } else if (sess.role === 'BRANCH'){
    html += `<div class="idbar"><span class="who"><i class="fas fa-circle-user"></i> เข้าใช้งานในนามสาขา:</span>
      <select id="bsel" onchange="sess.branchLogin=this.value;render()">${
        RD.branches().map(b=>`<option value="${b.id}" ${b.id===sess.branchLogin?'selected':''}>${esc(b.id)} — ${esc(b.nameTH)}</option>`).join('')
      }</select>
      <span style="font-size:.76rem;color:#8a9099;margin-left:auto"><i class="fas fa-lock"></i> สาขาเห็นเฉพาะรายการของตน</span></div>`;
  }

  // segment
  const tabs = sess.role==='HQ' ? (CAN_ADD ? [['new','แจ้งเพิ่มเลข',null],['track','ติดตามสถานะ (ทุกสาขา)', RD.getRecords().length]] : [['track','ติดตามสถานะ (ทุกสาขา)', RD.getRecords().length]])
    : sess.role==='HO' ? [['new','แจ้งเพิ่มเลข',null],['track','ติดตามสถานะ', RD.getRecords().length]]
    : sess.role==='IT' ? [['queue','คิวรอลงเลข', RD.getRecords().filter(r=>r.status==='SUBMITTED').length],['all','ทั้งหมด', RD.getRecords().length]]
    : [['verify','ใบเสร็จที่ต้องตรวจ', myVerify().length],['mine','รายการของฉัน', myRecords().length]];
  html += `<div class="seg">${tabs.map(t=>`<button class="${sess.tab===t[0]?'on':''}" onclick="sess.tab='${t[0]}';render()">${t[1]}${t[2]!=null?`<span class="seg-n">${t[2]}</span>`:''}</button>`).join('')}</div>`;

  if (sess.role==='HQ' && sess.tab==='new' && CAN_ADD) html += formHTML();
  else if (sess.role==='HQ') html += trackHTML(RD.getRecords());
  else if (sess.role==='HO' && sess.tab==='new') html += formHTML();
  else if (sess.role==='HO' && sess.tab==='track') html += trackHTML(RD.getRecords());
  else if (sess.role==='IT' && sess.tab==='queue') html += itQueueHTML(RD.getRecords().filter(r=>r.status==='SUBMITTED'));
  else if (sess.role==='IT' && sess.tab==='all') html += trackHTML(RD.getRecords());
  else if (sess.tab==='verify') html += verifyHTML(myVerify());
  else if (sess.tab==='mine') html += trackHTML(myRecords());

  w.innerHTML = html;
}

function myRecords(){ const v=viewer(); return RD.getRecords().filter(r=>RD.canSee(r,v)); }
function myVerify(){ return myRecords().filter(r=>r.status==='IN_POS'); }

// ====================================================== FORM
function formHTML(){
  const locked = sess.fromLink;
  let rows = sess.rows;
  let trows = rows.map((r,i)=>{
    const b = RD.branch(r.branchId);
    const docCell = r.doc
      ? (r.doc.pdf
          ? `<span class="stk"><i class="fas fa-file-pdf" style="color:#c0392b;font-size:1.25rem"></i><label title="${esc(r.doc.name)}" style="cursor:pointer">เปลี่ยน<input type="file" accept="image/*,application/pdf" hidden onchange="pickDoc(${i},this)"></label></span>`
          : `<span class="stk"><img class="thumb" src="${r.doc.data}" style="cursor:pointer" onclick="zoomDoc(${i})"><label><i class="fas fa-rotate"></i> เปลี่ยน<input type="file" accept="image/*,application/pdf" hidden onchange="pickDoc(${i},this)"></label></span>`)
      : `<label class="docpick"><i class="fas fa-paperclip"></i> แนบ ภ.พ.06<input type="file" accept="image/*,application/pdf" hidden onchange="pickDoc(${i},this)"></label>`;
    return `<tr>
      <td><div class="bn">${esc(b?b.nameTH:r.branchId)}</div><div class="bid">${esc(r.branchId)} · ${esc(b?b.company:'')}</div>
        <div class="rowflds">
          <div><label class="rfl"><i class="fas fa-location-dot" style="color:#c9870a"></i> ที่อยู่สาขา (แก้ไขได้)</label>
            <textarea rows="2" oninput="sess.rows[${i}].addr=this.value" placeholder="ที่อยู่สาขา">${esc(r.addr)}</textarea></div>
          <div><label class="rfl">เลขที่สาขา (5 หลัก) <span class="req">*</span></label>
            <input class="mono" maxlength="5" inputmode="numeric" placeholder="เช่น 00015" value="${esc(r.shopNo)}" oninput="sess.rows[${i}].shopNo=this.value.replace(/\D/g,'').slice(0,5)" onblur="padShopNo(${i})"></div>
        </div></td>
      <td><input value="${esc(r.cash)}" placeholder="เลขประจำตัวผู้เสียภาษี" oninput="sess.rows[${i}].cash=this.value"><div class="vchk"><i class="fas fa-database"></i> ${b&&b.cashRdNumber?'ดึงจากระบบ — ตรวจสอบ':'ยังไม่มีในระบบ — กรอก'}</div></td>
      <td><input value="${esc(r.shop)}" placeholder="RD Shop Code" oninput="sess.rows[${i}].shop=this.value"></td>
      <td>${docCell}</td>
      <td><button class="xbtn" onclick="sess.rows.splice(${i},1);render()"><i class="fas fa-trash"></i></button></td>
    </tr>`;
  }).join('');

  return `<div class="card">
    <h2><i class="fas fa-plus-circle"></i> แจ้งเพิ่มเลขสติ๊กเกอร์สรรพากร <span style="font-size:.72rem;font-weight:600;color:#9a6700;background:#fff8ec;border:1px solid #f3d99a;border-radius:7px;padding:2px 9px;vertical-align:middle">ขอครั้งแรก</span></h2>
    <p class="sub">ระบบดึง Cash RD Number และที่อยู่ของแต่ละสาขามาให้ตรวจสอบ · แนบเอกสารพิจารณาคำขอ (ภ.พ.06) — ส่งให้ทีม IT ลงเลขเข้า POS (การจดใหม่ → ใช้“แจ้งยกเลิก/จดใหม่”)</p>

    <div class="fld">
      <label>สาขาที่ต้องการเพิ่มเลข <span class="req">*</span></label>
      ${rows.length?`<div class="verifybox"><i class="fas fa-circle-info"></i> ระบบดึง <b>Cash RD Number</b> และ <b>ที่อยู่สาขา</b> จากฐานข้อมูลมาให้—กรุณาตรวจว่าถูกต้องก่อนส่ง · แนบ ภ.พ.06 (รูป/PDF) ทุกสาขา</div>
        <table class="brtbl"><thead><tr><th>สาขา / ที่อยู่ / เลขที่สาขา</th><th>Cash RD Number</th><th>RD Shop Code</th><th>แนบ ภ.พ.06 <span class="req">*</span></th><th></th></tr></thead><tbody>${trows}</tbody></table>`
        :`<div class="hint" style="padding:14px;border:2px dashed #dde2e7;border-radius:12px;text-align:center">ยังไม่ได้เลือกสาขา</div>`}
      ${!locked?`<button class="btn btn-o btn-sm" style="margin-top:12px" onclick="openPick()"><i class="fas fa-store"></i> เลือกสาขา</button>`:''}
    </div>

    <div class="fld">
      <label>วันที่เริ่มใช้เลขนี้</label>
      <input type="date" class="inp" id="fEff" value="${new Date().toISOString().slice(0,10)}" style="max-width:240px">
    </div>

    <div class="fld"><label>หมายเหตุ</label><textarea class="inp" id="fNote" rows="2" placeholder="(ถ้ามี)"></textarea></div>

    <button class="btn btn-g" onclick="submitForm()"><i class="fas fa-paper-plane"></i> ส่งแจ้งเพิ่มเลข</button>
  </div>`;
}
function visRadio(v,t,d){ return `<label class="radio ${sess.vis===v?'on':''}"><input type="radio" name="vis" ${sess.vis===v?'checked':''} onclick="sess.vis='${v}';render()"><div><div class="rt">${t}</div><div class="rd">${d}</div></div></label>`; }

function padShopNo(i){ const v=(sess.rows[i].shopNo||'').replace(/\D/g,''); sess.rows[i].shopNo = v?v.padStart(5,'0'):''; render(); }
function pickDoc(i, inp){ const f=inp.files[0]; if(!f)return;
  const isPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name);
  const rd=new FileReader(); rd.onload=e=>{ sess.rows[i].doc={data:e.target.result,name:f.name,pdf:isPdf}; render(); }; rd.readAsDataURL(f); }
function zoomDoc(i){ const d=sess.rows[i]&&sess.rows[i].doc; if(!d)return; if(d.pdf){ window.open(d.data,'_blank'); } else zoom(d.data); }
function zoomRec(id){ const r=RD.getRecords().find(x=>x.id===id); if(!r)return; const d=r.reqDoc; if(d&&d.pdf){ window.open(d.data,'_blank'); } else if(d){ zoom(d.data); } else if(r.stickerImg){ zoom(r.stickerImg); } }

function submitForm(){
  if(!sess.rows.length) return Swal.fire('ยังไม่ได้เลือกสาขา','กรุณาเลือกสาขาอย่างน้อย 1 สาขา','warning');
  const miss = sess.rows.find(r=>!r.cash.trim());
  if(miss) return Swal.fire('กรอกข้อมูลไม่ครบ','กรุณากรอก/ตรวจสอบ Cash RD Number ให้ครบทุกสาขา','warning');
  const missDoc = sess.rows.find(r=>!r.doc);
  if(missDoc) return Swal.fire('ยังไม่ได้แนบ ภ.พ.06','กรุณาแนบเอกสารพิจารณาคำขอ (ภ.พ.06) รูปภาพหรือ PDF ให้ครบทุกสาขา (ห้ามว่าง)','warning');
  sess.rows.forEach(r=>{ const v=(r.shopNo||'').replace(/\D/g,''); r.shopNo=v?v.padStart(5,'0'):''; });
  const missNo = sess.rows.find(r=>!r.shopNo || r.shopNo.length!==5);
  if(missNo) return Swal.fire('เลขที่สาขาไม่ครบ','กรุณากรอกเลขที่สาขาเป็นตัวเลข (ระบบเติม 0 ให้ครบ 5 หลัก) ทุกสาขา','warning');
  const eff = $('#fEff').value, note = $('#fNote').value;
  const by = sess.fromLink ? (activeLink.frcName+' (FRC)') : 'HO — ฝ่ายบัญชี';
  sess.rows.forEach(r=>RD.addRecord({
    branchId:r.branchId, cashRdNumber:r.cash.trim(), rdShopCode:r.shop.trim(),
    effDate:eff, note, stickerImg:(r.doc && !r.doc.pdf)?r.doc.data:'', reqDoc:r.doc||null,
    shopNo:r.shopNo, address:(r.addr||'').trim(),
    submittedBy:by, submittedRole: sess.fromLink?'FRC':'HO',
    visibility:{ mode: sess.fromLink?'branch':'company', ids:[] }
  }));
  const n=sess.rows.length; sess.rows=[];
  Swal.fire({icon:'success',title:'ส่งแจ้งเพิ่มเลขแล้ว',html:`ส่ง ${n} รายการให้ทีม IT ลงเลขเข้า POS<br><span style="font-size:.85rem;color:#8a9099">ระบบจะแจ้งกลับเมื่อ IT ลงเลขเสร็จ และแจ้งสาขาให้ตรวจใบเสร็จ</span>`});
  sess.tab = sess.fromLink?'mine':'track'; render();
}

// ====================================================== TRACK / CARDS
function statusPill(s){ const m=RD.STATUS[s]; return `<span class="pill ${m.color}"><i class="fas fa-circle" style="font-size:.5rem"></i> ${m.label}</span>`; }
function stepsHTML(s){ const m=RD.STATUS[s];
  return `<div class="steps">${RD.STEPS.map((lbl,i)=>{
    let cls = m.done.includes(i)?'done':(m.active===i?'active':'');
    if(m.err===i) cls='err';
    const ic = cls==='done'?'<i class="fas fa-check"></i>':(cls==='err'?'<i class="fas fa-xmark"></i>':(i+1));
    return `<div class="stp ${cls}"><div class="dot">${ic}</div><div class="slbl">${lbl}</div></div>`;
  }).join('')}</div>`;
}
function recCard(r, acts){
  const b=RD.branch(r.branchId); const m=RD.STATUS[r.status];
  const visLbl={branch:'เฉพาะสาขา',company:'ทั้งบริษัท',all:'ทุกสาขา',custom:'กำหนดเอง'}[r.visibility?.mode||'branch'];
  return `<div class="rec ${m.color==='ok'?'ok':m.color==='bad'?'bad':''}">
    <div class="rtop">
      <div><div class="rbn">${esc(b?b.nameTH:r.branchId)} <span class="rid">${esc(r.branchId)}</span></div>
        <div class="rid" style="margin-top:2px">${esc(r.id)}</div></div>
      ${statusPill(r.status)}
    </div>
    <div class="rmeta">
      <span class="mtag"><i class="fas fa-hashtag"></i> Cash RD: <b>${esc(r.cashRdNumber||'—')}</b></span>
      <span class="mtag"><i class="fas fa-shop"></i> Shop Code: <b>${esc(r.rdShopCode||'—')}</b></span>
      ${r.shopNo?`<span class="mtag"><i class="fas fa-hashtag"></i> เลขที่สาขา: <b>${esc(r.shopNo)}</b></span>`:''}
      <span class="mtag"><i class="fas fa-user"></i> ${esc(r.submittedBy)}</span>
      <span class="vischip"><i class="fas fa-eye"></i> ${visLbl}</span>
      ${b&&b.address?`<span class="mtag"><i class="fas fa-location-dot"></i> ${esc(b.address.length>40?b.address.slice(0,38)+'…':b.address)}</span>`:''}
      ${(r.reqDoc||r.stickerImg)?`<span class="mtag" style="cursor:pointer;color:#2c4a82" onclick="zoomRec('${r.id}')"><i class="fas ${r.reqDoc&&r.reqDoc.pdf?'fa-file-pdf':'fa-image'}"></i> ดูคำขอ ภ.พ.06</span>`:''}
    </div>
    ${stepsHTML(r.status)}
    ${acts?`<div class="racts">${acts}</div>`:''}
    <div class="hist">${r.history.map(h=>`<div class="hr"><i class="fas fa-circle"></i> <span>${esc(h.action)} · <b>${esc(h.by)}</b></span><span class="ht">${RD.fmtDate(h.at)}</span></div>`).join('')}</div>
  </div>`;
}
function trackHTML(list){
  if(!list.length) return emptyHTML('ยังไม่มีรายการ');
  const c = s=>list.filter(r=>r.status===s).length;
  const stats = `<div class="stats">
    <div class="stat warn"><div class="n">${c('SUBMITTED')}</div><div class="l">รอ IT ลงเลข</div></div>
    <div class="stat blue"><div class="n">${c('IN_POS')}</div><div class="l">รอสาขาตรวจใบเสร็จ</div></div>
    <div class="stat ok"><div class="n">${c('CONFIRMED')}</div><div class="l">เรียบร้อย</div></div>
    <div class="stat bad"><div class="n">${c('ISSUE')}</div><div class="l">แจ้งปัญหา</div></div></div>`;
  return stats + list.map(r=>recCard(r, '')).join('');
}
function itQueueHTML(list){
  if(!list.length) return emptyHTML('ไม่มีคิวรอลงเลข 🎉');
  return `<div class="card" style="padding:14px 18px"><p class="sub" style="margin:0"><i class="fas fa-screwdriver-wrench" style="color:var(--pc-green)"></i> ลงเลขสติ๊กเกอร์เข้า POS แล้วกด “ลงเลขเสร็จ” ระบบจะแจ้งกลับผู้แจ้ง และแจ้งสาขาให้ตรวจใบเสร็จ</p></div>`
    + list.map(r=>recCard(r, `<button class="btn btn-g btn-sm" onclick="itDone('${r.id}')"><i class="fas fa-check"></i> ลงเลขเข้า POS เสร็จ</button>`)).join('');
}
function verifyHTML(list){
  if(!list.length) return emptyHTML('ไม่มีใบเสร็จที่ต้องตรวจตอนนี้');
  return `<div class="card" style="padding:14px 18px"><p class="sub" style="margin:0"><i class="fas fa-magnifying-glass" style="color:var(--pc-green)"></i> ทีม IT ลงเลขเข้า POS แล้ว — กรุณาออกใบเสร็จทดสอบ แล้วตรวจว่าเลขสติ๊กเกอร์สรรพากรขึ้นถูกต้องไหม</p></div>`
    + list.map(r=>recCard(r,
      `<button class="btn btn-g btn-sm" onclick="brConfirm('${r.id}')"><i class="fas fa-circle-check"></i> เลขขึ้นใบเสร็จเรียบร้อย</button>
       <button class="btn btn-r btn-sm" onclick="brIssue('${r.id}')"><i class="fas fa-triangle-exclamation"></i> เลขไม่ขึ้น / ไม่ถูกต้อง</button>`)).join('');
}
function emptyHTML(t){ return `<div class="empty"><i class="fas fa-inbox"></i>${t}</div>`; }

// actions
function itDone(id){ RD.setStatus(id,'IN_POS','IT — ทีมระบบ'); toast('ลงเลขเข้า POS แล้ว — แจ้งสาขาตรวจใบเสร็จ'); render(); }
function brConfirm(id){ const b=RD.branch(viewer().branchId); RD.setStatus(id,'CONFIRMED', b?b.nameTH:'สาขา'); toast('ยืนยันแล้ว ขอบคุณค่ะ'); render(); }
function brIssue(id){
  Swal.fire({title:'แจ้งปัญหาใบเสร็จ',input:'textarea',inputPlaceholder:'อธิบายปัญหา เช่น เลขไม่ขึ้น / เลขผิด…',showCancelButton:true,confirmButtonText:'ส่งแจ้งปัญหา',confirmButtonColor:'#c0392b'})
  .then(res=>{ if(res.isConfirmed){ const b=RD.branch(viewer().branchId); RD.setStatus(id,'ISSUE', b?b.nameTH:'สาขา', res.value); toast('ส่งแจ้งปัญหากลับ IT แล้ว'); render(); }});
}
function zoom(src){ Swal.fire({imageUrl:src,imageAlt:'สติ๊กเกอร์',showConfirmButton:false,width:520}); }
function toast(t){ Swal.fire({toast:true,position:'top-end',icon:'success',title:t,showConfirmButton:false,timer:2200,timerProgressBar:true}); }

// ====================================================== BRANCH PICKER
let pkSel = new Set();
function openPick(){ pkSel = new Set(sess.rows.map(r=>r.branchId));
  const cs = RD.companies();
  $('#pkCompany').innerHTML = `<option value="">ทุกบริษัท</option>`+cs.map(c=>`<option>${esc(c)}</option>`).join('');
  $('#pkSearch').value=''; $('#ovPick').classList.add('on'); renderPick(); }
function closePick(){ $('#ovPick').classList.remove('on'); }
function renderPick(){
  const q=$('#pkSearch').value.trim().toLowerCase(), comp=$('#pkCompany').value;
  const list = RD.branches().filter(b=>{
    if(comp && b.company!==comp) return false;
    if(q && !(`${b.id} ${b.name} ${b.nameTH} ${b.company}`.toLowerCase().includes(q))) return false;
    return true;
  });
  $('#pkList').innerHTML = list.map(b=>`<div class="brow ${pkSel.has(b.id)?'sel':''}" onclick="togglePk('${b.id}')">
    <input type="checkbox" ${pkSel.has(b.id)?'checked':''} onclick="event.stopPropagation();togglePk('${b.id}')">
    <div><div class="nm">${esc(b.nameTH)}</div><div class="meta">${esc(b.id)} · ${esc(b.name)}</div></div>
    <span class="cc">${esc(b.type||'')}</span></div>`).join('') || `<div class="empty" style="padding:24px"><i class="fas fa-store-slash"></i>ไม่พบสาขา</div>`;
  $('#pkCount').textContent = 'เลือกแล้ว '+pkSel.size;
}
function togglePk(id){ pkSel.has(id)?pkSel.delete(id):pkSel.add(id); renderPick(); }
function applyPick(){
  const ex = new Set(sess.rows.map(r=>r.branchId));
  [...pkSel].forEach(id=>{ if(!ex.has(id)){ const b=RD.branch(id); sess.rows.push({branchId:id, cash:(b&&b.cashRdNumber)||'', shop:(b&&b.rdShopCode)||'', addr:(b&&b.address)||'', shopNo:'', doc:null}); } });
  sess.rows = sess.rows.filter(r=>pkSel.has(r.branchId));
  closePick(); render();
}

// init: FRC link prefills its own branch row
if (sess.fromLink){ sess.rows = sess.scopeIds.map(id=>{ const b=RD.branch(id); return {branchId:id, cash:(b&&b.cashRdNumber)||'', shop:(b&&b.rdShopCode)||'', addr:(b&&b.address)||'', shopNo:'', doc:null}; }); }
render();
</script>
