<style>
  .it-scope .it-tab { background:none; border:none; border-bottom:3px solid transparent; padding:10px 4px; margin-bottom:-2px; font-weight:700; font-size:.92rem; color:#7a7a7a; cursor:pointer; white-space:nowrap; transition:color .15s, border-color .15s; }
  .it-scope .it-tab:hover { color:#2e934a; }
  .it-scope .it-tab.active { color:#2e934a; border-bottom-color:#2e934a; }
  .it-scope .ring-active { outline: 3px solid #1a1d20; outline-offset: 0; }
  .it-scope .ring-active::after { content: "▼ กำลังกรอง"; position: absolute; top: 6px; right: 10px; font-size: .55rem; font-weight: 700; color: #1a1d20; }
  .it-scope .progress { background: #e9ecef; }
</style>

<div class="p-4 it-scope" style="background-color: #f4f4f4; min-height: 100vh;">
  <div class="d-flex justify-content-between align-items-center mb-3 px-1 pt-1 pb-2">
    <div>
      <h3 class="fw-bold m-0" style="font-family:'Montserrat',sans-serif; font-size:1.8rem; font-weight:800; letter-spacing:.2px; line-height:1.1; color:#1a1d20;"><i class="fas fa-check-double text-success me-2"></i>IT Settlement</h3>
      <p class="m-0 fw-bold" style="font-size:.9rem; margin-top:4px; color:#8a9099;">ศูนย์รวมงานตั้งค่าโปรโมชั่นบน POS — ดึงงานค้างทุกเดือนมาเคลียร์ในที่เดียว</p>
    </div>
    <div id="itHeadStat" class="text-end"></div>
  </div>

  <!-- status tabs -->
  <div class="it-tabbar d-flex gap-4 mb-3" id="itTabs" style="border-bottom:2px solid #e0e0e0; overflow-x:auto;">
    <button class="it-tab" data-tab="NEW" onclick="window.itSetTab('NEW')"><i class="fas fa-circle-plus me-1"></i>New</button>
    <button class="it-tab" data-tab="EDITED" onclick="window.itSetTab('EDITED')"><i class="fas fa-pen me-1"></i>Edited</button>
    <button class="it-tab" data-tab="CHANGED" onclick="window.itSetTab('CHANGED')"><i class="fas fa-calendar-days me-1"></i>Extended / Reduced</button>
    <button class="it-tab" data-tab="CANCELLED" onclick="window.itSetTab('CANCELLED')"><i class="fas fa-ban me-1"></i>Cancelled</button>
    <button class="it-tab active" data-tab="ALL" onclick="window.itSetTab('ALL')"><i class="fas fa-list me-1"></i>All</button>
    <button class="it-tab" data-tab="NPD" onclick="window.itSetTab('NPD')"><i class="fas fa-flask me-1"></i>สินค้าใหม่ (NPD)</button>
    <button class="it-tab" data-tab="FLAVOR" onclick="window.itSetTab('FLAVOR')"><i class="fas fa-mortar-pestle me-1"></i>เพิ่มผงรสชาติ</button>
    <button class="it-tab" data-tab="ABBR" onclick="window.itSetTab('ABBR')"><i class="fas fa-font me-1"></i>เปลี่ยนตัวย่อ <span id="itAbbrDot" class="badge bg-danger ms-1" style="display:none;font-size:.62rem">0</span></button>
  </div>

  <!-- filter toolbar — งานไหลเข้าอัตโนมัติ · month filter ชิดขวาสุด -->
  <div id="itPromoToolbar" class="bg-white p-3 rounded-3 shadow-sm border mb-3 d-flex flex-wrap gap-3 align-items-center">
    <div id="itResultInfo" class="fw-bold text-muted small"></div>
    <div class="position-relative">
      <i class="fas fa-search" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);color:#aaa;font-size:.82rem"></i>
      <input type="text" id="itCampSearch" class="form-control form-control-sm fw-bold" style="width:230px;padding-left:32px" placeholder="ค้นหาชื่อแคมเปญ / ชื่อปุ่ม / โค้ด..." oninput="window.itApplyFilters()">
    </div>
    <select id="itTypeFilter" class="form-select form-select-sm fw-bold" style="width:165px" onchange="window.itApplyFilters()" title="กรองตามประเภทงานที่มาจากฟอร์ม">
      <option value="ALL">ทุกประเภทงาน</option>
      <option value="ITEM SET">Item Set</option>
      <option value="COUPON">Coupon</option>
      <option value="BILL">Bill Discount</option>
      <option value="VOUCHER">Voucher</option>
    </select>

    <div class="ms-auto d-flex align-items-center gap-2">
      <label class="small fw-bold text-muted mb-0 text-nowrap"><i class="fas fa-filter me-1"></i>FILTER เดือน</label>
      <input type="month" id="filterMonthIT" class="form-control fw-bold border-secondary" style="width: 168px;" onchange="window.loadITTasks()">
      <label class="small fw-bold text-muted mb-0 text-nowrap"><i class="fas fa-calendar-day me-1"></i>วันที่</label>
      <input type="date" id="filterDateIT" class="form-control fw-bold border-secondary" style="width: 160px;" onchange="window.loadITTasks()" title="กรองเฉพาะโปรที่ใช้งานอยู่ในวันที่เลือก (อยู่ในช่วงวันเริ่ม–สิ้นสุด) — ใช้ร่วมกับตัวกรองเดือนได้">
      <select id="itDateMode" class="form-select fw-bold border-secondary" style="width:148px;" onchange="window.loadITTasks()" title="โหมดของตัวกรองวันที่"><option value="ACTIVE">ใช้งานวันที่เลือก</option><option value="START">วันที่เริ่ม</option><option value="END">วันที่สิ้นสุด</option></select>
      <button type="button" id="itDateClear" class="btn btn-outline-secondary btn-sm" style="display:none" onclick="window.itClearDate()" title="ล้างวันที่"><i class="fas fa-xmark"></i></button>
    </div>
  </div>

  <div id="itLoading" class="text-center p-5" style="display:none;">
    <div class="spinner-grow text-warning" role="status"></div>
    <p class="mt-2 fw-bold text-muted">Loading...</p>
  </div>

  <div id="itEmpty" class="text-center p-5 bg-white rounded-3 shadow-sm border" style="display:none;">
    <img src="assets/brand/mascot.png" alt="mascot" style="width:96px;height:96px;object-fit:contain;margin-bottom:14px;" class="d-inline-block">
    <h5 class="fw-bold text-muted">ไม่มีงานค้างในมุมมองนี้</h5>
    <p class="text-muted small">ทุกแคมเปญถูกตั้งค่าเรียบร้อยแล้ว 🎉</p>
  </div>

  <div id="campaignGroupContainer"></div>
  <div id="itNpdTab" style="display:none;"></div>
  <div id="itFlvTab" style="display:none;"></div>
  <div id="itAbbrTab" style="display:none;"></div>
</div>

<datalist id="listCode"></datalist>
<datalist id="listNameEN"></datalist>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<script>
  var currentTasks = [];
  var itTab = 'ALL';
  var itemMasterMap = {};

  function itClassify(t) {
    if (t.rejectReason && String(t.rejectReason).trim()) return 'EDITED';
    const chg = String(t.changeStatus || '').toUpperCase();
    if (chg === 'CANCELLED') return 'CANCELLED';
    if (chg === 'EXTENDED' || chg === 'REDUCED') return 'CHANGED';
    return 'NEW';
  }
  /* ค้นหาชื่อแคมเปญ + กรองประเภทงาน — re-render จากชุด task เต็มที่ cache ไว้ (toolbar ไม่ถูก re-render จึงไม่เสีย focus) */
  window.itApplyFilters = function () { try { window.renderGroupedTasks(window.__itAllTasks || []); } catch (e) {} };
  window.itSetTab = function (tab) {
    itTab = tab;
    document.querySelectorAll('#itTabs .it-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === tab));
    var isNpd = tab === 'NPD', isFlv = tab === 'FLAVOR', isAbbr = tab === 'ABBR', special = isNpd || isFlv || isAbbr;
    var tb = document.getElementById('itPromoToolbar'); if (tb) tb.style.display = special ? 'none' : '';
    var cg = document.getElementById('campaignGroupContainer'); if (cg) cg.style.display = special ? 'none' : '';
    var ne = document.getElementById('itEmpty'); if (ne && special) ne.style.display = 'none';
    var npdBox = document.getElementById('itNpdTab'); if (npdBox) npdBox.style.display = isNpd ? 'block' : 'none';
    var flvBox = document.getElementById('itFlvTab'); if (flvBox) flvBox.style.display = isFlv ? 'block' : 'none';
    var abBox = document.getElementById('itAbbrTab'); if (abBox) abBox.style.display = isAbbr ? 'block' : 'none';
    if (isNpd) { window.loadItNpd(); return; }
    if (isFlv) { window.loadItFlv(); return; }
    if (isAbbr) { window.renderItAbbr(); return; }
    if (currentTasks && currentTasks.length) window.renderGroupedTasks(currentTasks);
    else window.loadITTasks();
  };

  /* ===== คิวคำขอเปลี่ยนตัวย่อ (RD ยื่น → IT ยืนยัน) ===== */
  window.renderItAbbr = function () {
    var box = document.getElementById('itAbbrTab'); if (!box) return;
    if (!window.PC_Abbr || !window.PC_Abbr.reqList) { box.innerHTML = '<div class="alert alert-warning">โมดูลเปลี่ยนตัวย่อยังไม่โหลด</div>'; return; }
    var all = window.PC_Abbr.reqList();
    var pend = all.filter(function (r) { return String(r.status).toUpperCase() === 'PENDING'; });
    var dot = document.getElementById('itAbbrDot');
    if (dot) { dot.textContent = pend.length; dot.style.display = pend.length ? '' : 'none'; }
    if (!all.length) { box.innerHTML = '<div class="text-center p-5 bg-white rounded-3 shadow-sm border"><i class="fas fa-font fa-2x text-muted mb-2 d-block"></i><span class="fw-bold text-muted">ยังไม่มีคำขอเปลี่ยนตัวย่อ</span></div>'; return; }
    var card = function (r) {
      var st = String(r.status).toUpperCase();
      var stB = st === 'PENDING' ? '<span class="badge bg-warning text-dark">รอยืนยัน</span>'
        : st === 'DONE' ? '<span class="badge bg-success">เปลี่ยนแล้ว</span>' : '<span class="badge bg-danger">ตีกลับ</span>';
      var c = r.counts || {};
      var mergeable = (st === 'PENDING') ? all.filter(function (x) { return x.id !== r.id && String(x.status).toUpperCase() === 'PENDING' && String(x.newA).toUpperCase() === String(r.newA).toUpperCase(); }) : [];
      return '<div class="card mb-3 border-0 shadow-sm" style="border-radius:13px;overflow:hidden">' +
        '<div class="card-header bg-dark text-white py-3 px-4 d-flex align-items-center gap-3 flex-wrap">' +
          '<span class="fw-bold" style="font-family:JetBrains Mono,monospace;color:#ffc107">' + itEsc(r.id) + '</span>' +
          '<span class="fw-bold" style="font-family:JetBrains Mono,monospace;font-size:1.05rem">' + itEsc(((window.PC_Abbr && PC_Abbr.reqOlds) ? PC_Abbr.reqOlds(r) : [r.oldA]).join(' + ')) + ' <i class="fas fa-arrow-right mx-1" style="font-size:.8rem;opacity:.6"></i> ' + itEsc(r.newA) + '</span>' +
          ((r.mergedFrom || []).length ? '<span class="badge" style="background:#eef4ff;color:#1b4b8f;border:1px solid #b9cdf0">ยุบรวม ' + ((r.mergedFrom || []).length + 1) + ' คำขอ</span>' : '') +
          '<span class="small opacity-75 flex-grow-1">ยื่นโดย ' + itEsc(r.by || '-') + ' · ' + itEsc(String(r.at).slice(0, 10)) + '</span>' + stB + '</div>' +
        '<div class="p-4">' +
          (r.reason ? '<div class="small mb-2"><b>เหตุผล:</b> ' + itEsc(r.reason) + '</div>' : '') +
          '<div class="d-flex gap-2 flex-wrap mb-3">' +
            '<span class="badge bg-light text-dark border">ชุดผง ' + (c.subsets || 0) + '</span>' +
            '<span class="badge bg-light text-dark border">ชื่อสินค้า ' + (c.items || 0) + '</span>' +
            '<span class="badge bg-light text-dark border">ชื่อครัวปุ่มโปร ' + (c.kitchen || 0) + '</span>' +
            (r.withShortName ? '<span class="badge bg-light text-dark border">ชื่อปุ่ม ' + (c.shortName || 0) + '</span>' : '') +
            (c.rowItems ? '<span class="badge" style="background:#eef4ff;color:#1b4b8f;border:1px solid #b9cdf0">ชื่อสินค้าในงานที่ยังไม่ปิด ' + c.rowItems + '</span>' : '') +
            (c.newProducts ? '<span class="badge bg-light text-dark border">สินค้าที่ IT สร้างไว้ ' + c.newProducts + '</span>' : '') +
            '<span class="badge bg-primary">รวม ' + (c.total || 0) + ' รายการ</span>' +
            (r.includeLive ? '<span class="badge" style="background:#fff4e5;color:#8a5a00;border:1px solid #e0a800">เปลี่ยนโปรที่ขึ้น POS แล้วด้วย</span>' : '<span class="badge bg-light text-dark border">เฉพาะของใหม่</span>') +
          '</div>' +
          ((r.warnings || []).length ? '<div class="alert alert-warning py-2 px-3 small mb-3">' + r.warnings.map(itEsc).join('<br>') + '</div>' : '') +
          (r.rejectNote ? '<div class="alert alert-danger py-2 px-3 small mb-3">เหตุผลตีกลับ: ' + itEsc(r.rejectNote) + '</div>' : '') +
          (st === 'PENDING'
            ? '<div class="d-flex gap-2 flex-wrap">' +
                '<button class="btn btn-outline-dark fw-bold" onclick="window.itAbbrPreview(&#39;' + itJsArg(r.id) + '&#39;)"><i class="fas fa-magnifying-glass me-1"></i>ดูรายการที่จะเปลี่ยน</button>' +
                '<button class="btn btn-success fw-bold px-4" onclick="window.itAbbrApprove(&#39;' + itJsArg(r.id) + '&#39;)"><i class="fas fa-check me-1"></i>ยืนยันเปลี่ยนทั้งระบบ</button>' +
                '<button class="btn btn-outline-danger fw-bold" onclick="window.itAbbrReject(&#39;' + itJsArg(r.id) + '&#39;)"><i class="fas fa-rotate-left me-1"></i>ตีกลับ</button>' +
                (mergeable.length ? '<button class="btn btn-outline-primary fw-bold" onclick="window.itAbbrMerge(&#39;' + itJsArg(r.id) + '&#39;)"><i class="fas fa-object-group me-1"></i>ยุบรวมกับใบปลายทางเดียวกัน (' + mergeable.length + ')</button>' : '') + '</div>'
            : '<div class="d-flex align-items-center gap-3 flex-wrap"><div class="small text-muted flex-grow-1">' + (st === 'DONE' ? 'ดำเนินการโดย ' + itEsc(r.doneBy || '-') + ' · ' + itEsc(String(r.doneAt || '').slice(0, 10)) + ' — ย้อนกลับได้ที่หน้าข้อมูลหลัก (สินค้า) → เปลี่ยนตัวย่อ → ประวัติ' : 'ตีกลับโดย ' + itEsc(r.doneBy || '-')) + '</div>' +
                '<button class="btn btn-sm btn-outline-secondary fw-bold" onclick="window.itAbbrDelete(&#39;' + itJsArg(r.id) + '&#39;)"><i class="fas fa-trash me-1"></i>ลบคำขอนี้</button></div>') +
        '</div></div>';
    };
    box.innerHTML = '<div class="mb-3 small text-muted"><i class="fas fa-circle-info me-1"></i>คำขอจาก RD — กดยืนยันแล้วระบบจะเปลี่ยนตัวย่อให้ทุกที่พร้อมกัน (ชุดผง · ชื่อบิลครัว · ชื่อปุ่ม POS · ชื่อครัวของปุ่มโปร)</div>' + all.map(card).join('');
  };
  /* ยุบใบคำขอที่ปลายทางเดียวกันเข้าเป็นใบเดียว (ตัวย่อสะกดสลับ เช่น CFS / SCF → CFSQ) */
  window.itAbbrMerge = function (id) {
    var all = window.PC_Abbr.reqList();
    var me = all.filter(function (x) { return x.id === id; })[0]; if (!me) return;
    var others = all.filter(function (x) { return x.id !== id && String(x.status).toUpperCase() === 'PENDING' && String(x.newA).toUpperCase() === String(me.newA).toUpperCase(); });
    if (!others.length) { Swal.fire({ icon: 'info', title: 'ไม่มีใบที่ยุบรวมได้', text: 'ต้องเป็นใบที่รอยืนยันและตัวย่อปลายทางเดียวกัน' }); return; }
    var listHtml = others.map(function (x) { return '<div style="text-align:left">• <b>' + itEsc(x.id) + '</b> ' + itEsc(x.oldA) + ' → ' + itEsc(x.newA) + ' (' + ((x.counts || {}).total || 0) + ' รายการ)</div>'; }).join('');
    Swal.fire({ icon: 'question', title: 'ยุบรวมเข้าใบ ' + itEsc(id) + '?', html: 'จะรวมใบเหล่านี้เข้าด้วยกัน แล้วกดยืนยันครั้งเดียวจบ:' + listHtml + '<div class="small text-muted mt-2">รายการที่ตัดออกของแต่ละใบจะถูกรวมไว้ด้วย</div>', showCancelButton: true, confirmButtonText: 'ยุบรวม', cancelButtonText: 'ยกเลิก', confirmButtonColor: '#0d6efd' })
      .then(function (a) {
        if (!a.isConfirmed) return;
        var msgs = [];
        others.forEach(function (x) { var res = window.PC_Abbr.reqMerge(id, x.id); msgs.push(res.message); });
        Swal.fire({ icon: 'success', title: 'ยุบรวมแล้ว', html: msgs.map(itEsc).join('<br>') });
        window.renderItAbbr && window.renderItAbbr();
      });
  };
  window.itAbbrDelete = function (id) {
    Swal.fire({ title: 'ลบคำขอนี้ออกจากรายการ?', text: 'ใช้เก็บกวาดใบที่ตีกลับแล้ว/ใบทดสอบ — ไม่กระทบข้อมูลสินค้า', icon: 'warning', showCancelButton: true, confirmButtonColor: '#dc3545', confirmButtonText: 'ลบ', cancelButtonText: 'ยกเลิก' })
      .then(function (a) {
        if (!a.isConfirmed) return;
        var res = window.PC_Abbr.reqDelete(id);
        Swal.fire({ icon: res.status === 'success' ? 'success' : 'error', title: res.message, timer: 1400, showConfirmButton: false });
        window.renderItAbbr && window.renderItAbbr();
      });
  };
  window.itAbbrPreview = function (id) {
    var r = window.PC_Abbr.reqList().filter(function (x) { return x.id === id; })[0];
    if (!r) { Swal.fire({ icon: 'info', title: 'ไม่พบคำขอนี้ในเครื่องนี้', html: 'คำขอ <b>' + itEsc(id) + '</b> ถูกยื่นจากเครื่องอื่นและยังไม่ซิงค์มา<br><span class="small text-muted">กดรีเฟรชหน้าหนึ่งครั้ง หรือให้ผู้ยื่นเปิดหน้าค้างไว้เพื่อให้ข้อมูลส่งขึ้นคลาวด์</span>', confirmButtonColor: '#6c757d' }).then(function(){ window.renderItAbbr && window.renderItAbbr(); }); return; }
    /* เปิดเป็นหน้าตารางเต็ม (ค้นหา/กรอง/คัดลอก Item Code + คำใหม่ได้ทุกช่อง) */
    window.__abbrReqId = r.id;
    try { localStorage.setItem('pc_abbr_page_req', r.id); } catch (e) {}
    if (typeof window.loadPage === 'function') window.loadPage('AbbrPreview');
    else Swal.fire({ icon: 'error', title: 'เปิดหน้าไม่ได้', text: 'กดรีเฟรชหน้าหนึ่งครั้งแล้วลองอีกครั้ง', confirmButtonColor: '#6c757d' });
  };
  window.itAbbrApprove = function (id) {
    Swal.fire({ title: 'ยืนยันเปลี่ยนตัวย่อ?', text: 'ระบบจะเปลี่ยนให้ทุกที่พร้อมกัน (ย้อนกลับได้ที่หน้าข้อมูลหลัก)', icon: 'warning', showCancelButton: true, confirmButtonColor: '#2e934a', confirmButtonText: 'ยืนยัน', cancelButtonText: 'ยังไม่ทำ' })
      .then(function (a) {
        if (!a.isConfirmed) return;
        var res = window.PC_Abbr.reqApprove(id);
        Swal.fire({ icon: res.status === 'success' ? 'success' : 'error', title: res.status === 'success' ? 'เปลี่ยนตัวย่อแล้ว' : 'ไม่สำเร็จ', text: res.message, confirmButtonColor: '#2e934a' })
          .then(function () { window.renderItAbbr(); });
      });
  };
  window.itAbbrReject = function (id) {
    Swal.fire({ title: 'ตีกลับคำขอ', input: 'textarea', inputLabel: 'เหตุผล', inputPlaceholder: 'เช่น ตัวย่อใหม่ชนกับสินค้าอื่น', icon: 'warning', showCancelButton: true, confirmButtonColor: '#c0392b', confirmButtonText: 'ตีกลับ', cancelButtonText: 'ยกเลิก' })
      .then(function (a) {
        if (!a.isConfirmed) return;
        var res = window.PC_Abbr.reqReject(id, a.value || '');
        Swal.fire({ icon: 'success', title: 'ตีกลับแล้ว', text: res.message, confirmButtonColor: '#2e934a' }).then(function () { window.renderItAbbr(); });
      });
  };

  window.initIT_Settlement = function() {
    var _f=document.getElementById('filterMonthIT'); if(_f) _f.value='';
    var _fd=document.getElementById('filterDateIT'); if(_fd) _fd.value=''; var _fdc=document.getElementById('itDateClear'); if(_fdc) _fdc.style.display='none';
    var _fdm=document.getElementById('itDateMode'); if(_fdm) _fdm.value='ACTIVE';
    itTab='ALL';
    window.loadITDashboard();
    var _t=0;
    (function _go(){ _t++;
      if(document.getElementById('campaignGroupContainer')){ window.loadITTasks(); }
      else if(_t<25){ setTimeout(_go,120); }
    })();
  };

    try { if (window.PC_COUNTER && PC_COUNTER.autoReserveIn) PC_COUNTER.autoReserveIn(container); } catch (e) {}
    /* safety net: ปุ่ม Item Set ที่มี Code Item Set จอง (data-builder-code) แต่ช่องรหัสว่าง → เติมให้ตรงกับที่ POS Button Setup จองไว้ (กัน race ตอน render/sync) */
    try {
      container.querySelectorAll('tr.it-row-item[data-builder-code]').forEach(function (tr) {
        var bc = (tr.getAttribute('data-builder-code') || '').trim();
        if (!bc) return;
        var inp = tr.querySelector('input.f-itempromo');
        if (inp && !inp.disabled && !(inp.value || '').trim()) {

  // ---- \u0e01\u0e31\u0e19\u0e2b\u0e21\u0e27\u0e14 Item Set \u0e01\u0e31\u0e1a Type Promo \u0e40\u0e1e\u0e35\u0e49\u0e22\u0e19\u0e01\u0e31\u0e19 (\u0e40\u0e0a\u0e48\u0e19 Type=Price Promotion \u0e41\u0e15\u0e48\u0e2b\u0e21\u0e27\u0e14=E-Voucher \u2192 \u0e08\u0e2d\u0e07\u0e40\u0e25\u0e02\u0e0b\u0e35\u0e23\u0e35\u0e2a\u0e4c 109 \u0e41\u0e17\u0e19 107) ----
  window.itWantsVoucherType = function (typeVal) {
    var t = String(typeVal || '').toUpperCase();
    if (t.indexOf('PRICE') >= 0 || t.indexOf('ITEM SET') >= 0) return false;
    return /E-VOUCHER|ITEM COUPON|VOUCHER|BILL DISCOUNT|COUPON/.test(t);
  };
  window.itSyncCateCard = function (card, opts) {
    opts = opts || {};
    var remarkInp = card && card.querySelector('.f-cate-remark'); if (!remarkInp) return;
    var remark = (remarkInp.value || '').trim();
    var known = /^(combo|value\s*set|promotion\s*set|e[-\s]?voucher)$/i.test(remark);
    if (!known) return; // \u0e02\u0e49\u0e2d\u0e04\u0e27\u0e32\u0e21\u0e2d\u0e34\u0e2a\u0e23\u0e30 (\u0e40\u0e0a\u0e48\u0e19 "Standard-Exclude Non") \u2014 \u0e44\u0e21\u0e48\u0e43\u0e0a\u0e48\u0e04\u0e48\u0e32 postCate \u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e2a\u0e34\u0e07\u0e04\u0e4c
    var isEVremark = /e[-\s]?voucher/i.test(remark);
    var fixed = false;
    card.querySelectorAll('.it-row-item').forEach(function (tr) {
      var sel = tr.querySelector('.f-type'); if (!sel || sel.disabled) return;
      var wantsEV = window.itWantsVoucherType(sel.value);
      if (wantsEV === isEVremark) return;
      fixed = true;
      var fld = tr.querySelector('.f-itempromo');
      if (fld && !fld.disabled) {
        if (fld.value) { try { var oldType = fld.getAttribute('data-cc-reserve'); if (window.PC_API && PC_API.releaseCode) PC_API.releaseCode(fld.value, oldType); } catch (e) {} }
        fld.value = ''; fld.removeAttribute('data-cc-code');
        if (wantsEV) { fld.id = (fld.id || '').replace(/itccf-itemset-/, 'itccf-item-109-'); fld.setAttribute('data-cc-reserve', 'item'); fld.setAttribute('data-cc-cat', '109'); }
        else { fld.id = (fld.id || '').replace(/itccf-item-\d+-/, 'itccf-itemset-'); fld.setAttribute('data-cc-reserve', 'itemset'); fld.removeAttribute('data-cc-cat'); }
      }
    });
    if (fixed) {
      if (isEVremark) remarkInp.value = ''; // Type Promo \u0e44\u0e21\u0e48\u0e15\u0e49\u0e2d\u0e07\u0e01\u0e32\u0e23 E-Voucher \u0e2d\u0e35\u0e01\u0e15\u0e48\u0e2d\u0e44\u0e1b \u2014 \u0e40\u0e04\u0e25\u0e35\u0e22\u0e23\u0e4c\u0e01\u0e25\u0e31\u0e1a Promotion set \u0e40\u0e23\u0e34\u0e48\u0e21\u0e15\u0e49\u0e19 (107)
      if (!opts.silent && window.Swal) Swal.fire({ icon: 'warning', title: '\u0e2b\u0e21\u0e27\u0e14 Item Set \u0e44\u0e21\u0e48\u0e15\u0e23\u0e07\u0e01\u0e31\u0e1a Type Promo', text: '\u0e25\u0e49\u0e32\u0e07\u0e23\u0e2b\u0e31\u0e2a Item Set \u0e17\u0e35\u0e48\u0e08\u0e2d\u0e07\u0e1c\u0e34\u0e14\u0e2b\u0e21\u0e27\u0e14\u0e41\u0e25\u0e49\u0e27 \u2014 \u0e04\u0e25\u0e34\u0e01\u0e0a\u0e48\u0e2d\u0e07\u0e23\u0e2b\u0e31\u0e2a Item Set \u0e40\u0e1e\u0e37\u0e48\u0e2d\u0e08\u0e2d\u0e07\u0e40\u0e25\u0e02\u0e43\u0e2b\u0e21\u0e48\u0e43\u0e2b\u0e49\u0e15\u0e23\u0e07\u0e2b\u0e21\u0e27\u0e14', timer: 2800, showConfirmButton: false });
    }
  };

  /* ===== งานยกเลิก: IT ลบปุ่มออกจาก POS แล้วคืนโค้ดเข้าคลัง ===== */
  window.itRemoveCancelled = function (campName, month) {
    var card = window.itCardOf(campName, month);
    if (card && card.getAttribute('data-everlive') === '1') return window.itKeepCancelled(campName, month);
    var found = [];
    /* FX-P71 — ลบเฉพาะใบที่กด: ส่งรายชื่อปุ่มบนการ์ดนี้ + เดือนนี้ ไปด้วย
       → แคมเปคนชื่อคล้ายกัน/ปุ่มอื่นของแคมเปคนเดียวกันต่างเดือน จะไม่โดนลบติดไปด้วย */
    var scopeSns = card ? [].map.call(card.querySelectorAll('.it-row-item'), function (tr) { return tr.getAttribute('data-short-name') || ''; }).filter(Boolean) : [];
    scopeSns = scopeSns.filter(function (v, i, a) { return a.indexOf(v) === i; });
    var push = function (code, type) {
      code = String(code == null ? '' : code).trim();
      if (!code || /^(—|-|ONLINE|NORMAL|OFFLINE)$/i.test(code)) return;
      if (found.some(function (x) { return x.code === code; })) return;
      found.push({ code: code, type: type || 'promo' });
    };
    if (card) {
      card.querySelectorAll('.f-code').forEach(function (el) { push(el.value, el.getAttribute('data-cc-reserve') || 'promo'); });
      card.querySelectorAll('.f-itempromo').forEach(function (el) { push(el.value, 'itemset'); });
    }
    try {
      if (window.PC_COUNTER && PC_COUNTER.list) {
        PC_COUNTER.list({}).forEach(function (e) {
          if (String(e.where || '').trim() === String(campName).trim() && e.status !== 'RELEASED') push(e.code, e.type);
        });
      }
    } catch (e) {}
    var listHTML = found.length
      ? '<div class="p-2 rounded border bg-light font-monospace small text-start">' + found.map(function (x) { return '• ' + itEsc(x.code) + ' <span class="text-muted">(' + itEsc(x.type) + ')</span>'; }).join('<br>') + '</div>'
      : '<div class="text-muted small">ไม่พบเลขที่ต้องคืน (แคมเปญนี้ยังไม่เคยออกโค้ด)</div>';
    Swal.fire({
      title: 'ลบออกจาก POS + คืนโค้ด',
      html: '<div class="text-start"><b>' + itEsc(campName) + '</b>' +
        '<div class="small text-muted mb-2">โปรนี้ถูกยกเลิกจาก MKT — IT นำปุ่มออกจาก POS แล้วระบบจะคืนเลขโค้ดกลับคลังให้ใช้ซ้ำได้</div>' +
        (scopeSns.length ? '<div class="small mb-2">ปุ่มที่จะลบ (เฉพาะใบนี้ ' + scopeSns.length + ' ปุ่ม): <b>' + scopeSns.map(itEsc).join(' · ') + '</b></div>' : '') +
        listHTML + '</div>',
      icon: 'warning', showCancelButton: true, confirmButtonColor: '#c0392b',
      confirmButtonText: '<i class="fas fa-trash-can me-1"></i>ลบ + คืนโค้ด', cancelButtonText: 'ยกเลิก'
    }).then(function (r) {
      if (!r.isConfirmed) return;
      var returned = [];
      found.forEach(function (x) {
        try {
          var ok = (window.PC_COUNTER && PC_COUNTER.returnCode) ? PC_COUNTER.returnCode(x.code, x.type, 'IT Settlement (ยกเลิกโปร — คืนโค้ด)', true) : null;
          if (ok) returned.push(x.code);
        } catch (e) {}
      });
      Swal.fire({ title: 'กำลังลบ...', allowOutsideClick: false, didOpen: function () { Swal.showLoading(); } });
      google.script.run.withSuccessHandler(function (res) {
        Swal.fire({
          icon: 'success', title: 'ลบออกจากระบบแล้ว',
          html: (res && res.message ? itEsc(res.message) : 'ลบเรียบร้อย') +
            (returned.length
              ? '<div class="small text-muted mt-2">คืนโค้ดเข้าคลัง: <b class="font-monospace">' + returned.join(', ') + '</b></div>'
              : (found.length
                  ? '<div class="small text-muted mt-2">โค้ด <b class="font-monospace">' + found.map(function (x) { return itEsc(x.code); }).join(', ') + '</b> ไม่ได้อยู่ในคลังเลขของระบบ (ออกก่อนมีตัวนับ หรือถูกคืนไปแล้ว) — ปุ่มถูกลบออกจาก POS เรียบร้อย</div>'
                  : '<div class="small text-muted mt-2">แคมเปญนี้ไม่มีเลขโค้ดให้คืน</div>')),
          confirmButtonColor: '#2e934a'
        }).then(function () { window.loadITTasks && window.loadITTasks(); });
      }).withFailureHandler(function (e) { Swal.fire('ผิดพลาด', String(e), 'error'); })
        .itRemoveCancelled(campName, month, returned, scopeSns);
    });
  };

  /* ===== เด้งถามทุกครั้งที่เข้าหน้า IT ถ้ามีงานยกเลิกค้าง ===== */
  window.itAskCancelJobs = function (tasks) {
    var jobs = {};
    (tasks || []).forEach(function (x) {
      var ch = String(x.changeStatus || '').toUpperCase();
      if (ch !== 'CANCELLED' && ch !== 'EXTENDED' && ch !== 'REDUCED') return;
      if (ch === 'CANCELLED' && (x.removedFromPos || x.cancelHandled)) return;
      if (ch !== 'CANCELLED' && String(x.itStatus || '').toUpperCase() === 'COMPLETE') return;
      var k = x.campaign + '||' + x.month;
      if (!jobs[k]) jobs[k] = { campaign: x.campaign, month: x.month, kind: ch, everLive: false, reason: x.cancelReason || '', endDate: x.endDate || '', note: x.extendCodeNote || '', n: 0 };
      if (x.everLive) jobs[k].everLive = true;
      jobs[k].n++;
    });
    var list = Object.keys(jobs).map(function (k) { return jobs[k]; });
    if (!list.length) return;
    var nCancel = list.filter(function (j) { return j.kind === 'CANCELLED'; }).length;
    var nChange = list.length - nCancel;
    var rows = list.map(function (j) {
      var isC = j.kind === 'CANCELLED';
      var bg = isC ? (j.everLive ? '#fff4e5' : '#eaf6ee') : '#eaf3fb';
      var label = isC
        ? (j.everLive ? '⚠️ ยกเลิก · เคยขึ้นปุ่มแล้ว → ปิดการขาย คงไว้ในระบบ <b>คืนโค้ดไม่ได้</b>'
                      : '🗑️ ยกเลิก · ยังไม่เคยขึ้นปุ่ม → <b>ลบออกจากเว็บ + คืนโค้ด</b>')
        : (j.kind === 'EXTENDED' ? '📅 <b>ขยายเวลา</b> → แก้วันหมดอายุที่ POS เป็น <b>' + itEsc(j.endDate || '-') + '</b>'
                                 : '📅 <b>ลดเวลา</b> → แก้วันหมดอายุที่ POS เป็น <b>' + itEsc(j.endDate || '-') + '</b>')
          + (j.note ? '<div class="text-muted">หมายเหตุ MKT: ' + itEsc(j.note) + '</div>' : '');
      var btn = isC
        ? '<button class="btn btn-sm ' + (j.everLive ? 'btn-warning text-dark' : 'btn-danger') + ' fw-bold ms-2" onclick="Swal.close(); window.' +
          (j.everLive ? 'itKeepCancelled' : 'itRemoveCancelled') + '(&#39;' + itJsArg(j.campaign) + '&#39;,&#39;' + itJsArg(j.month) + '&#39;)">จัดการ</button>'
        : '<button class="btn btn-sm btn-primary fw-bold ms-2" onclick="Swal.close(); window.itFocusCampaign(&#39;' + itJsArg(j.campaign) + '&#39;,&#39;' + itJsArg(j.month) + '&#39;)">ไปที่งาน</button>';
      return '<div class="d-flex justify-content-between align-items-center border rounded p-2 mb-2" style="background:' + bg + '">' +
        '<div class="text-start small"><b>' + itEsc(j.campaign) + '</b> <span class="text-muted">· ' + itEsc(j.month) + ' · ' + j.n + ' ปุ่ม</span>' +
        '<div class="text-muted">' + label + '</div></div>' + btn + '</div>';
    }).join('');
    var head = [];
    if (nCancel) head.push('ยกเลิก ' + nCancel);
    if (nChange) head.push('ขยาย/ลดเวลา ' + nChange);

      title: 'มีงานรอ IT จัดการ (' + head.join(' · ') + ')',

  window.saveCampaign = function(campName, month) {

        if (!isItemSet && !/^107/.test(String(itemPromo))) { itemPromo = ''; kitchen = ''; }

  window.calcRow = function(el) {
    const tr = el.closest('tr');
    let headerRow = tr;
    while (headerRow && headerRow.querySelector('.f-code').disabled) { headerRow = headerRow.previousElementSibling; }
    const promoType = (headerRow && headerRow.querySelector('.f-type') ? headerRow.querySelector('.f-type').value : "").toUpperCase().trim();
    const grossEl = tr.querySelector('.f-gross'), discEl = tr.querySelector('.f-disc');
    const gross = parseFloat(String(grossEl.value).replace(/[^0-9.]/g, '')) || 0;
    const discRaw = String(discEl.value);
    const isPct = /%/.test(discRaw);
    const disc = parseFloat(discRaw.replace(/[^0-9.]/g, '')) || 0;
    const netInp = tr.querySelector('.f-net');
    if (!netInp) return;
    // Voucher (มูลค่าหน้าบัตร) + Bill discount (ส่วนลดทั้งบิล) — ไม่มี Net รายไอเท็ม
    if (promoType.indexOf('VOUCHER') >= 0 || promoType.indexOf('BILL') >= 0) { netInp.value = ""; netInp.style.color = 'black'; return; }
    // Coupon / Item Set: Net = Gross − ส่วนลด (รองรับหน่วย %)
    const isCouponT = promoType.indexOf('COUPON') >= 0;
    if (isCouponT || !tr.querySelector('.f-code').disabled) {
      const r = isPct ? +(gross * (1 - disc / 100)).toFixed(2) : +(gross - disc).toFixed(2);
      netInp.value = r;
      netInp.style.color = r < 0 ? 'red' : 'black';
    }
  };

  function itRecipeOf(code, saleMode){
    code = String(code==null?'':code);
    var key = /grab|line|panda|shopee|robin|gokoo|gookoo|deliver/i.test(String(saleMode||'')) ? 'Delivery' : 'Take Away';
    function pick(rec){ if(!rec||!rec.modes) return null; var l = rec.modes[key]||rec.modes['Take Away']||rec.modes['Delivery']; return (l&&l.length)?l:null; }
    var R = window.PC_RECIPE && PC_RECIPE[code]; var l1 = pick(R); if(l1) return l1;
    try{
      var api = (window.PC_API && PC_API.getRecipeCustom) ? PC_API : (window.top && window.top.PC_API && window.top.PC_API.getRecipeCustom ? window.top.PC_API : null);
      var l2 = pick(api && api.getRecipeCustom()[code]); if(l2) return l2;
    }catch(e){}
    return IT_RECIPE[code] || null;
  }
  var IT_SUBSET = { // legacy product→subset mapping (สินค้าเก่า)
    '101001':[{ss:'SS0001',name:'Flavored Fries 1'}], '101002':[{ss:'SS0001',name:'Flavored Fries 1'}],
    '101003':[{ss:'SS0001',name:'Flavored Fries 1'}], '104001':[{ss:'SS0024',name:'Flavored Chicken Pop 1'}]
  };
  window.itItemSetView = function(campName, month){
    var group = (currentTasks||[]).filter(function(t){ return t.campaign===campName && t.month===month; });
    if(!group.length){ Swal.fire('ไม่พบข้อมูล', campName, 'info'); return; }
    // group member items per POS button (shortName)
    var btns = {};
    group.forEach(function(t){ (btns[t.shortName] = btns[t.shortName] || {info:t, items:[]}); btns[t.shortName].items.push(t); });
    var subsetSet = {};
    var blocks = Object.keys(btns).map(function(sn){
      var b = btns[sn];
      var rows = b.items.map(function(it){
        var rc = (itRecipeOf(it.itemCode, b.info.saleMode)||[{rm:'—',d:'(ยังไม่มี Recipe — IT ผูกเพิ่ม)',q:'',u:''}]).map(function(r){ return '<span class="badge bg-light text-dark border me-1 mb-1">'+itEsc(r.rm)+' '+itEsc(r.d)+(r.q?' · '+itEsc(r.q)+itEsc(r.u):'')+'</span>'; }).join('');
        var ss = IT_SUBSET[it.itemCode]||[];
        ss.forEach(function(x){ subsetSet[x.ss]=x.name; });
        var ssTxt = ss.length ? ss.map(function(x){ return '<span class="badge bg-success">'+itEsc(x.ss)+' · '+itEsc(x.name)+'</span>'; }).join(' ') : '<span class="text-muted small">— ไม่มีผง —</span>';
        return '<tr><td class="fw-bold text-primary">'+itEsc(it.itemCode||'-')+'</td><td>'+itEsc(it.itemNameEN||'-')+'</td><td class="text-center">'+itEsc(it.qty||1)+'</td><td>'+rc+'</td></tr>';
      }).join('');
      return '<div class="border rounded-3 mb-3" style="overflow:hidden"><div class="px-3 py-2 fw-bold" style="background:#fff3cd"><i class="fas fa-mug-hot me-1"></i>ปุ่มเซ็ต: '+itEsc(sn)+' <span class="text-muted small">· '+itEsc(b.info.saleMode||'')+' · '+(b.info.itemPromo?('Item Set '+itEsc(b.info.itemPromo)):'<span class="text-danger">ยังไม่มี Code Item Set (IT กรอก)</span>')+'</span></div>'+
        '<table class="table table-sm table-bordered m-0" style="font-size:.82rem"><thead class="table-light"><tr><th style="width:90px">Item Code</th><th>สินค้าสมาชิก</th><th style="width:46px">Qty</th><th>Recipe (RM) — ผูกอัตโนมัติ</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
    }).join('');
    var ssChips = Object.keys(subsetSet).map(function(ss){ return '<span class="badge bg-success me-1">'+itEsc(ss)+' · '+itEsc(subsetSet[ss])+'</span>'; }).join('') || '<span class="text-muted">— ไม่มีสินค้าที่ผูกผง —</span>';
    Swal.fire({
      title:'<span style="font-size:1rem"><i class="fas fa-gift text-warning me-1"></i>ส่วนประกอบ Item Set · '+itEsc(campName)+'</span>',
      width: 820,
      html:'<div class="text-start">'+
        blocks+
        '<div class="small text-muted"><i class="fas fa-circle-info me-1"></i>ข้อมูลสมาชิก + Recipe มาจากโปรที่ MKT กรอกจริง — IT ตรวจ/ผูก RM แล้วกรอก Code Item Set ที่ตารางหลัก จากนั้นกด "บันทึก & ปิดงาน"</div>'+
        '</div>',
      confirmButtonText:'ปิด', confirmButtonColor:'#1a1d20'
    });
  };

  window.showDetail = function(rowIdx, month) {
    const task = currentTasks.find(t => t.rowIdx == rowIdx && t.month == month);
    if (!task) return;
    const f = (text) => !text ? '-' : String(text).replace(/\n/g, '<br>');
    Swal.fire({
      title: `<span style="color:#ffffff">PROMOTION DETAILS</span>`,
      html: `<div class="text-start" style="font-size:0.9rem; line-height: 1.5;">
          <p><strong><i class="fas fa-info-circle text-primary"></i> Detail:</strong><br>${f(task.detail)}</p><hr>
          <p><strong><i class="fas fa-tools text-success"></i> Mechanic:</strong><br>${f(task.mechanic)}</p>
        </div>`,
      confirmButtonText: 'Close', confirmButtonColor: '#343a40', width: '600px'
    });
  };

  window.showStores = function(campName) {
    const group = currentTasks.filter(t => t.campaign === campName);
    if (group.length === 0) return;
    const stores = group[0].storeData || [];
    const storeRaw = group[0].store || '';
    let contentHtml = '';
    if (Array.isArray(stores) && stores.length > 0) {
      contentHtml = `<div class="table-responsive" style="max-height: 450px; overflow-y: auto; border-radius: 8px;">
          <table class="table table-sm table-hover table-bordered m-0" style="font-size: 0.85rem;">
            <thead class="table-dark sticky-top"><tr class="text-center"><th style="width: 25%;">Branch ID</th><th>Branch Name (EN)</th><th>Branch Name (TH)</th></tr></thead>
            <tbody>${stores.map(s => `<tr><td class="text-center fw-bold text-primary bg-light">${s.id || '-'}</td><td class="ps-3">${s.nameEn || '-'}</td><td class="ps-3">${s.nameTh || '-'}</td></tr>`).join('')}</tbody>
          </table></div>`;
    } else {
      contentHtml = `<ul class="text-start" style="column-count: 2;">${storeRaw.split(',').map(s => `<li>${s.trim()}</li>`).join('')}</ul>`;
    }
    Swal.fire({
      title: `<div class="d-flex align-items-center justify-content-center text-warning fw-bold"><i class="fas fa-store-alt me-2"></i> TARGET STORES</div>`,
      html: `<div class="mb-3 text-muted small fw-bold text-uppercase border-bottom pb-2">${campName}</div>${contentHtml}`,
      width: '750px', confirmButtonText: 'CLOSE', confirmButtonColor: '#343a40', customClass: { popup: 'rounded-4' }
    });
  };
</script>
