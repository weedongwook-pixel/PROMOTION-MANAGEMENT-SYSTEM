  <div class="pl-hero">
    <h2><i class="fas fa-magnifying-glass"></i>สินค้าที่ขายอยู่</h2>
    <p>พิมพ์ชื่อหรือรหัสสินค้า เพื่อดูราคาแต่ละช่องทาง · แสดงเฉพาะสินค้าที่ขายจริง (Active)</p>
    <div class="pl-brands">
      <button id="plBrandPC" class="pl-brandbtn on" onclick="plSetBrand('Potato Corner')">
        <img src="assets/brand/potato-corner.png" alt="Potato Corner"><span class="cnt" id="plBrandPCn"></span></button>
      <button id="plBrandSF" class="pl-brandbtn" onclick="plSetBrand('Shakes &amp; Fries')">
        <img src="assets/brand/shakes-fries.png" alt="Shakes &amp; Fries"><span class="cnt" id="plBrandSFn"></span></button>
    </div>
    <div class="pl-searchbox">
      <i class="fas fa-magnifying-glass s"></i>
      <input id="plSearch" type="text" placeholder="เช่น MEGA FRIES, 101003, ชีส…" autocomplete="off" oninput="plOnSearch()">
      <button class="clr" id="plClr" onclick="plClear()"><i class="fas fa-xmark"></i></button>
    </div>
    <div class="pl-branchbar">
      <i class="fas fa-store"></i>
      <span>สาขา:</span>
      <div class="pl-brsel">
        <input id="plBranchInput" type="text" autocomplete="off" placeholder="ทุกสาขา — พิมพ์ค้นหา รหัส/ชื่อไทย/อังกฤษ" onfocus="window.plBranchOpen()" oninput="window.plBranchFilter()" onblur="setTimeout(window.plBranchClose,180)">
        <div class="pl-brmenu" id="plBranchMenu"></div>
      </div>
      <span class="pl-branchnote" id="plBranchNote"></span>
    </div>
    <div class="pl-quick">
      <span class="pl-chip on" data-q="all" onclick="plQuick('all')"><i class="fas fa-grip"></i> ทั้งหมด</span>
      <span class="pl-chip" data-q="core" onclick="plQuick('core')"><i class="fas fa-star"></i> ขายตลอด</span>
      <span class="pl-chip" data-q="seasonal" onclick="plQuick('seasonal')"><i class="fas fa-clock"></i> ขายชั่วคราว</span>
    </div>
    <div class="pl-views">
      <button id="plViewData" class="on" onclick="plSetView('data')"><i class="fas fa-table-cells-large"></i> มุมมองข้อมูล</button>
      <button id="plViewPos" onclick="plSetView('pos')"><i class="fas fa-cash-register"></i> มุมมองหน้า POS</button>
    </div>
  </div>

  <div class="pl-crumb" id="plCrumb"></div>
  <div id="plBody"></div>

  <div class="pl-modal" id="plModal" onclick="if(event.target===this)plCloseModal()">
    <div class="box" id="plModalBox"></div>
  </div>

  <div class="smode" id="plSmode" onclick="if(event.target===this)plCloseSmode()">
    <div class="sbox" id="plSmodeBox"></div>
  </div>

</div>
</div>

<script>
window.initProductLookup = function () {
  var CHANS = [
    {k:'priceTA',   label:'Take Away', icon:'fa-store'},
    {k:'priceGrab', label:'Grab',      icon:'fa-motorcycle'},
    {k:'priceLineman',label:'LINE MAN', icon:'fa-hashtag'},
    {k:'pricePanda',label:'foodpanda', icon:'fa-drumstick-bite'},
    {k:'priceShopee',label:'Shopee',   icon:'fa-bag-shopping'},
    {k:'priceRobinhood',label:'Robinhood', icon:'fa-leaf'},
    {k:'priceGokoo',label:'Gokoo',     icon:'fa-bolt'},
  ];
  var FK='pc_product_flags', EDITK='pc_product_edits', CATSK='pc_cat_stores';
  var ITEMS=[], ITEM_BY_CODE={}, STATUS_ALL={}, CAT_CODE={}, BR=[], FLAGS={}, state={ q:'', quick:'all', cat:null, limit:60, view:'data', posCat:null, posMode:'priceTA', brand:'Potato Corner', branch:'', posCodes:null, posCampaign:'', posPage:0, flavorView:false, flavorItem:null, flavorSubs:[], flavorTab:0, flavorPage:0, flavorPick:{} };
  var BRAND_LOGO={ 'Potato Corner':'assets/brand/potato-corner.png', 'Shakes & Fries':'assets/brand/shakes-fries.png' };

  function ls(k,d){ try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  function fmt(v){ if(v===''||v==null) return null; var n=Number(v); return isNaN(n)?null:n.toLocaleString('th-TH',{maximumFractionDigits:2}); }
  function isActive(c){ var f=FLAGS[c]||{}; if(f.active===0) return false; if(f.active===1) return true; var s=STATUS_ALL[c]; if(s==null){ var it=ITEM_BY_CODE[c]; s=it&&it.status; } return String(s==null?'':s).toLowerCase()!=='inactive'; }
  function statusActive(it){ var f=FLAGS[it.itemCode]||{}; if(f.status===0) return false; if(f.active===0) return false; if(f.active===1) return true; return String(it.status||'').toLowerCase()!=='inactive'; }
  function isSeasonal(it){ return /ชั่วคราว|กำหนด|seasonal/i.test(it.core||it.salesType||''); }
  // สินค้ามีขายในช่องทาง (Sale mode) ที่เลือกหรือไม่
  function availInMode(it){ var v=it[state.posMode]; if(v===''||v==null) return false; return !isNaN(Number(v)); }

  function applyEdits(items){ var e=ls(EDITK,{}); items.forEach(function(it){ var o=e[it.itemCode]; if(o) Object.keys(o).forEach(function(k){ if(o[k]!==''&&o[k]!=null) it[k]=o[k]; }); }); return items; }

  function brandsOf(it){
    if(Array.isArray(it.brands)&&it.brands.length) return it.brands;
    return it.storeFormat?String(it.storeFormat).split(',').map(function(x){return x.trim();}).filter(Boolean):[];
  }
  function passBrand(it){
    var bs=brandsOf(it);
    if(!bs.length) return true; // no format = ขายทุก format
    return bs.some(function(b){ return b.replace(/&amp;/g,'&').toLowerCase()===state.brand.replace(/&amp;/g,'&').toLowerCase(); });
  }

  function passQuick(it){
    if(state.quick==='core') return !isSeasonal(it);
    if(state.quick==='seasonal') return isSeasonal(it);
    return true;
  }

  var CAT_ICON={Fries:'fa-french-fries','Specialty Fries':'fa-french-fries',Flavors:'fa-mortar-pestle',Drinks:'fa-cup-straw',Beverage:'fa-mug-hot',Topping:'fa-cheese',Snack:'fa-cookie-bite',Combo:'fa-layer-group',Set:'fa-layer-group'};
  function catIcon(c){ return CAT_ICON[c]||'fa-box'; }
  // sort category names by their real cateCode (101,102,103…) instead of alphabetically
  function sortCats(names){
    return names.slice().sort(function(a,b){
      var ca=CAT_CODE[a]||'', cb=CAT_CODE[b]||'';
      var na=parseInt(ca,10), nb=parseInt(cb,10);
      if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
      if(ca!==cb) return String(ca).localeCompare(String(cb));
      return a.localeCompare(b);
    });
  }

  window.plOnSearch=function(){
    state.q=(document.getElementById('plSearch').value||'').toLowerCase().trim();
    document.getElementById('plClr').classList.toggle('show', !!state.q);
    if(state.q) state.cat=null; // searching exits category browse
    state.limit=60; render();
  };
  window.plClear=function(){ document.getElementById('plSearch').value=''; state.q=''; document.getElementById('plClr').classList.remove('show'); state.limit=60; render(); };
  window.plQuick=function(q){ state.quick=q; document.querySelectorAll('.pl-chip').forEach(function(c){ c.classList.toggle('on', c.getAttribute('data-q')===q); }); state.limit=60; state.posPage=0; state.flavorView=false; render(); };
  window.plOpenCat=function(c){ state.cat=c; state.q=''; document.getElementById('plSearch').value=''; document.getElementById('plClr').classList.remove('show'); state.limit=60; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  window.plBackCats=function(){ state.cat=null; state.limit=60; render(); };
  window.plMore=function(){ state.limit+=60; render(); };

  window.plSetBrand=function(b){
    b=b.replace(/&amp;/g,'&');
    state.brand=b; state.cat=null; state.posCat=null; state.limit=60;
    document.getElementById('plBrandPC').classList.toggle('on', b==='Potato Corner');
    document.getElementById('plBrandSF').classList.toggle('on', b==='Shakes & Fries');
    render();
  };
  function updateBrandCounts(){
    var pc=0, sf=0;
    ITEMS.forEach(function(it){ var bs=brandsOf(it).map(function(x){return x.replace(/&amp;/g,'&').toLowerCase();});
      if(!bs.length||bs.indexOf('potato corner')>=0) pc++;
      if(!bs.length||bs.indexOf('shakes & fries')>=0) sf++; });
    var a=document.getElementById('plBrandPCn'), b=document.getElementById('plBrandSFn');
    if(a) a.textContent=pc.toLocaleString(); if(b) b.textContent=sf.toLocaleString();
  }

  window.plSetView=function(v){
    state.view=v;
    state.posCodes=null; state.posCampaign=''; state.posPage=0; state.flavorView=false; // manual view toggle = full POS (clear campaign focus)
    document.getElementById('plViewData').classList.toggle('on', v==='data');
    document.getElementById('plViewPos').classList.toggle('on', v==='pos');
    render();
  };
  window.plPosCat=function(c){ state.posCat=c; state.posPage=0; state.flavorView=false; render(); window.scrollTo({top:0,behavior:'smooth'}); };
  window.plPosBack=function(){ state.posCat=null; state.posPage=0; state.flavorView=false; render(); };
  window.plPosClearCampaign=function(){ state.posCodes=null; state.posCampaign=''; state.posCat=null; state.posPage=0; state.flavorView=false; render(); };
  window.plPosPage=function(p){ p=parseInt(p,10); if(isNaN(p)||p<0)p=0; state.posPage=p; render(); };
  window.plPosButton=function(code){ var it=ITEM_BY_CODE[code]||ITEMS.filter(function(x){return x.itemCode===code;})[0]; if(!it) return; var subs=subsetsOf(code); if(subs.length){ state.flavorView=true; state.flavorItem=it; state.flavorSubs=subs; state.flavorTab=0; state.flavorPage=0; state.flavorPick={}; render(); window.scrollTo({top:0,behavior:'smooth'}); } /* ยังไม่ผูกผงในระบบ → คลิกแล้วไม่เกิดอะไร */ };
  window.plFlavorTab=function(i){ state.flavorTab=parseInt(i,10)||0; state.flavorPage=0; render(); };
  window.plFlavorPage=function(p){ p=parseInt(p,10); if(isNaN(p)||p<0)p=0; state.flavorPage=p; render(); };
  window.plFlavorPick=function(fcode){ var subs=state.flavorSubs||[]; var s=subs[Math.min(state.flavorTab,subs.length-1)]; if(!s) return; var pk=state.flavorPick||(state.flavorPick={}); var m=pk[s.ssCode]||(pk[s.ssCode]={}); var tot=0; Object.keys(m).forEach(function(k){tot+=m[k];}); if(tot>=s.max) return; m[fcode]=(m[fcode]||0)+1; render(); };
  window.plFlavorReset=function(){ var subs=state.flavorSubs||[]; var s=subs[Math.min(state.flavorTab,subs.length-1)]; if(s&&state.flavorPick) state.flavorPick[s.ssCode]={}; render(); };
  window.plFlavorDefault=function(){ var subs=state.flavorSubs||[]; var s=subs[Math.min(state.flavorTab,subs.length-1)]; if(!s)return; var m={},need=s.max; for(var i=0;i<s.flavors.length&&need>0;i++){ m[s.flavors[i].code]=1; need--; } (state.flavorPick||(state.flavorPick={}))[s.ssCode]=m; render(); };
  window.plFlavorQty=function(){ render(); };
  window.plFlavorExit=function(){ state.flavorView=false; state.flavorItem=null; state.flavorSubs=[]; state.flavorPick={}; render(); };
  window.plPosMode=function(m){ state.posMode=m; render(); };
  window.plOpenModal=function(code){
    var it=ITEMS.filter(function(x){return x.itemCode===code;})[0]; if(!it) return;
    var act=isActive(it.itemCode), seas=isSeasonal(it);
    var badge = !act?'<span class="badge2 b-off"><i class="fas fa-circle"></i>ไม่ขาย</span>':seas?'<span class="badge2 b-seasonal"><i class="fas fa-clock"></i>ชั่วคราว</span>':'<span class="badge2 b-on"><i class="fas fa-circle-check"></i>ขายอยู่</span>';
    var prices=CHANS.map(function(c){ var v=fmt(it[c.k]);
      return '<div class="prow"><span class="ch"><i class="fas '+c.icon+'"></i>'+esc(c.label)+'</span>'+(v!=null?'<span class="pr">฿'+v+'</span>':'<span class="pr empty">—</span>')+'</div>'; }).join('');
    document.getElementById('plModalBox').innerHTML=
      '<div class="mh"><div><div class="nm">'+esc(it.itemNameEN||it.itemNameTH||'—')+'</div>'+
        '<div class="sub">'+esc(it.itemCode||'')+(it.category?' · '+esc(it.category):'')+'</div>'+
        '<div style="margin-top:7px">'+badge+'</div></div>'+
        '<button class="x" onclick="plCloseModal()"><i class="fas fa-xmark"></i></button></div>'+
      '<div class="mb"><div class="prices">'+prices+'</div></div>';
    document.getElementById('plModal').classList.add('show');
  };
  window.plCloseModal=function(){ document.getElementById('plModal').classList.remove('show'); };

  function matchSearch(it){
    if(!state.q) return true;
    return String(it.itemCode||'').toLowerCase().indexOf(state.q)>=0
      || String(it.itemNameEN||'').toLowerCase().indexOf(state.q)>=0
      || String(it.itemNameTH||'').toLowerCase().indexOf(state.q)>=0;
  }

  function cardHTML(it){
    var act=isActive(it.itemCode), seas=isSeasonal(it);
    var badge = !act ? '<span class="badge2 b-off"><i class="fas fa-circle"></i>ไม่ขาย</span>'
      : seas ? '<span class="badge2 b-seasonal"><i class="fas fa-clock"></i>ชั่วคราว</span>'
      : '<span class="badge2 b-on"><i class="fas fa-circle-check"></i>ขายอยู่</span>';
    var prices = CHANS.map(function(c){
      var v=fmt(it[c.k]);
      return '<div class="prow"><span class="ch"><i class="fas '+c.icon+'"></i>'+esc(c.label)+'</span>'+
        (v!=null?'<span class="pr">฿'+v+'</span>':'<span class="pr empty">—</span>')+'</div>';
    }).join('');
    var brands=Array.isArray(it.brands)?it.brands:(it.storeFormat?String(it.storeFormat).split(',').map(function(x){return x.trim();}):[]);
    var ft = brands.filter(Boolean).map(function(b){return '<span class="ft">'+esc(b)+'</span>';}).join('');
    return '<div class="pcard">'+
      '<div class="ph"><div><div class="nm">'+esc(it.itemNameEN||it.itemNameTH||'—')+'</div>'+
        '<div class="sub">'+esc(it.itemCode||'')+(it.category?' · '+esc(it.category):'')+'</div></div>'+badge+'</div>'+
      '<div class="prices">'+prices+'</div>'+
      (ft?'<div class="pf"><i class="fas fa-store" style="color:#cfd5db"></i>'+ft+'</div>':'')+
    '</div>';
  }

  // bilingual labels for POS buttons (synced with Category Setting Name EN/TH + i18n)
  function catLabel(catName){
    var a=ls('pc_cat_attrs',{})[catName]||{};
    if(window.PC_LANG==='EN') return a.nameEN||catName;
    return a.nameTH||a.nameEN||catName;
  }
  function prodName(it){
    if(window.PC_LANG==='EN') return it.itemNameEN||it.itemNameTH||'—';
    return it.itemNameTH||it.itemNameEN||'—';
  }

  function passQuickAll(it){ return passBrand(it) && passQuick(it) && catVisible(it.category||'(ไม่ระบุหมวด)') && depVisible(it); }
  // ปิดแผนก (pc_dep_flags) → สินค้าในแผนกถูกซ่อนจากหน้า POS ด้วย (sync กับ POSSim/BillDiff)
  function depVisible(it){ var df=ls('pc_dep_flags',{})[it && it.department]; return !(df && df.active===0); }

  // — category visibility by branch (synced with Category Setting / pc_cat_stores) —
  function catTokenIds(tok){
    var set={};
    String(tok).split(',').map(function(s){return s.trim();}).filter(Boolean).forEach(function(t){
      if(/^G:/i.test(t)){ var v=t.slice(2); BR.forEach(function(b){if(String(b.group)===v)set[b.id]=1;}); }
      else if(/^C:/i.test(t)){ var v=t.slice(2); BR.forEach(function(b){if(String(b.class)===v)set[b.id]=1;}); }
      else if(/^T:/i.test(t)){ var v=t.slice(2); BR.forEach(function(b){if(String(b.type)===v)set[b.id]=1;}); }
      else set[t]=1;
    });
    return set;
  }
  function catVisible(catName){
    var cf=ls('pc_cat_flags',{})[catName]; if(cf && cf.active===0) return false;
    var tok=(ls(CATSK,{})[catName]);
    if(tok==null||String(tok).trim()==='') return true;          // not set = ทุกสาขา
    if(/(^|,)\s*ALL\s*(,|$)/i.test(tok)) return true;
    if(String(tok).trim().toUpperCase()==='NONE') return false;   // ซ่อนทุกสาขา
    if(!state.branch) return true;                                // ยังไม่เลือกสาขา → โชว์ทั้งหมด
    return !!catTokenIds(tok)[state.branch];
  }

  function render(){
    var crumb=document.getElementById('plCrumb'), body=document.getElementById('plBody');

    // ===== POS-SCREEN VIEW =====
    if(state.view==='pos'){
      crumb.innerHTML='';
      renderPOS(body);
      return;
    }

    // CATEGORY BROWSE MODE (no search, no category selected) → show category tiles
    if(!state.q && !state.cat){
      crumb.innerHTML='<i class="fas fa-grip-vertical" style="color:#cfd5db"></i> เลือกหมวดสินค้า หรือพิมพ์ค้นหาด้านบน';
      var byCat={};
      ITEMS.forEach(function(it){ if(!passQuickAll(it)) return; var c=it.category||'(ไม่ระบุหมวด)'; (byCat[c]=byCat[c]||[]).push(it); });
      var cats=sortCats(Object.keys(byCat));
      if(!cats.length){ body.innerHTML='<div class="pl-empty"><i class="fas fa-box-open"></i>ไม่มีสินค้าตามตัวกรอง</div>'; return; }
      body.innerHTML='<div class="pl-cats">'+cats.map(function(c){
        var n=byCat[c].length, on=byCat[c].filter(function(x){return isActive(x.itemCode);}).length;
        return '<div class="pl-cat" onclick="plOpenCat(\''+esc(c).replace(/'/g,"\\'")+'\')">'+
          '<div class="ci"><i class="fas '+catIcon(c)+'"></i></div>'+
          '<h4>'+esc(catLabel(c))+'</h4><div class="meta">'+n+' รายการ · ขายอยู่ '+on+'</div>'+
          '<i class="fas fa-chevron-right go"></i></div>';
      }).join('')+'</div>';
      return;
    }

    // LIST MODE (search results OR inside a category)
    var rows=ITEMS.filter(function(it){
      if(state.cat && (it.category||'(ไม่ระบุหมวด)')!==state.cat) return false;
      if(!passQuickAll(it)) return false;
      if(!matchSearch(it)) return false;
      return true;
    });
    // active first
    rows.sort(function(a,b){ return (isActive(b.itemCode)?1:0)-(isActive(a.itemCode)?1:0); });

    if(state.cat){
      crumb.innerHTML='<a onclick="plBackCats()"><i class="fas fa-arrow-left"></i> ทุกหมวด</a> <i class="fas fa-chevron-right" style="font-size:.7rem;color:#cfd5db"></i> <b>'+esc(state.cat)+'</b>';
    } else {
      crumb.innerHTML='<i class="fas fa-magnifying-glass" style="color:#cfd5db"></i> ผลการค้นหา “'+esc(state.q)+'”';
    }

    if(!rows.length){ body.innerHTML='<div class="pl-empty"><i class="fas fa-box-open"></i>ไม่พบสินค้า'+(state.q?' “'+esc(state.q)+'”':'')+'</div>'; return; }
    var shown=rows.slice(0,state.limit);
    body.innerHTML='<div class="pl-count">พบ '+rows.length+' รายการ'+(rows.length>state.limit?' · แสดง '+shown.length:'')+'</div>'+
      '<div class="pl-grid">'+shown.map(cardHTML).join('')+'</div>'+
      (rows.length>state.limit?'<div class="pl-more"><button onclick="plMore()"><i class="fas fa-chevron-down me-1"></i>ดูเพิ่ม ('+(rows.length-state.limit)+')</button></div>':'');
  }

  function priceLabelOf(m){ var c=CHANS.filter(function(x){return x.k===m;})[0]; return c?c.label:m; }
  // a few blue shades to vary the text buttons (like the real POS)
  var TXT_BG=['linear-gradient(180deg,#4a90d6,#3f86c6)','linear-gradient(180deg,#56c0f0,#33a8e8)','linear-gradient(180deg,#5a9ad6,#4a86c8)','linear-gradient(180deg,#3f86c6,#2f6dba)'];

  function posSectionName(){
    if(state.flavorView && state.flavorItem) return catLabel(state.flavorItem.category||'');
    if(state.posCodes && state.posCodes.length){
      var cats=[]; state.posCodes.forEach(function(c){ var it=ITEM_BY_CODE[c]||ITEMS.filter(function(x){return x.itemCode===c;})[0]; if(it){ var cc=it.category||''; if(cc&&cats.indexOf(cc)<0)cats.push(cc); } });
      return cats.map(catLabel).join(' / ');
    }
    if(state.posCat) return catLabel(state.posCat);
    return '';
  }
  function posTop(){
    return '<div class="pos-top">'+
      '<div class="pos-cart" onclick="plOpenSmode()" title="เลือกช่องทางขาย">'+
        '<div class="pos-ico"><i class="fas fa-cart-shopping"></i><span class="bdg">0</span></div>'+
        '<div class="pos-ico ppl"><i class="fas fa-users"></i><span class="bdg">1</span></div>'+
        '<div class="pos-mode">'+esc(priceLabelOf(state.posMode))+' <i class="fas fa-chevron-down"></i></div>'+
      '</div>'+
      '<div class="pos-logo" onclick="plOpenBrandPop()" title="เลือก Store Format"><img src="'+BRAND_LOGO[state.brand]+'" alt="'+esc(state.brand)+'"></div>'+
      '<div class="pos-home" onclick="plPosBack()" title="กลับหน้าแรก">'+(window.PC_LANG==='EN'?'Home':'หน้าแรก')+' <span class="chev"></span>'+(function(){var s=posSectionName();return s?' <b style="margin-left:7px;font-weight:800">'+esc(s)+'</b>':'';})()+'</div>'+
    '</div>';
  }
  function posBill(){
    var today=new Date(); var dt=('0'+today.getDate()).slice(-2)+'/'+('0'+(today.getMonth()+1)).slice(-2)+'/'+today.getFullYear();
    return '<div class="pos-bill">'+
      '<div class="bhd"><span>XXXX: SHOP TEST</span><span>เครื่อง: 01</span></div>'+

  function plAllBranches(){
    var byId={}, order=[];
    function put(b){ if(!b||!b.id) return; var id=String(b.id);
      if(!(id in byId)){ order.push(id); byId[id]={id:b.id}; }
      var t=byId[id];
      t.name=b.name||t.name||''; t.nameTH=b.nameTH||t.nameTH||'';
      t.type=b.type||t.type; t.group=b.group||t.group; t['class']=b['class']||t['class'];
    }
    (window.PC_BRANCH_MASTER||[]).forEach(put);
    try{ var o=JSON.parse(localStorage.getItem('pc_master_lists')||'null'); if(o && Array.isArray(o.branches)) o.branches.forEach(put); }catch(e){}
    return order.map(function(id){ return byId[id]; });
  }

  function loadItems(items){
    // STATUS_ALL = สถานะทุกตัวจากตารางสินค้าจริงทั้งหมด (อ้างอิงสถานะ active ของผง/สินค้าที่ไม่ได้อยู่ในรายการขาย)
    // หน้าสาขา — โชว์เฉพาะสินค้า ItemStatus = Active
    var all = applyEdits(items);
    // map ราคาแต่ละช่องทางจาก item master prices{} → ฟิลด์ที่หน้านี้ใช้ (priceTA/priceGrab/...)
    var CHMAP={priceTA:'Take Away',priceGrab:'Grab',priceLineman:'LINE MAN',pricePanda:'foodpanda',priceShopee:'ShopeeFood',priceRobinhood:'Robinhood',priceGokoo:'Gokoo'};
    all.forEach(function(it){ if(!it) return; var pr=it.prices||{};
      Object.keys(CHMAP).forEach(function(fk){ if(it[fk]===undefined||it[fk]===''||it[fk]==null){ var pv=pr[CHMAP[fk]]; if(pv!==undefined&&pv!=='') it[fk]=pv; } });
    });
    STATUS_ALL = {}; all.forEach(function(it){ if(it) STATUS_ALL[it.itemCode]=String(it.status||''); });
    ITEMS = all.filter(statusActive);
    ITEM_BY_CODE = {}; CAT_CODE = {};
    ITEMS.forEach(function(it){ it && (ITEM_BY_CODE[it.itemCode]=it); if(it.category && it.cateCode && !(it.category in CAT_CODE)) CAT_CODE[it.category]=it.cateCode; });
    BR=plAllBranches();
    plBranchSyncInput();
  }
