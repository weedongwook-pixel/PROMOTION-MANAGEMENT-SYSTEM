  function heurAudit(r,promos){
    var promoCause=(r.causes||[]).some(function(c){return ['BTN','PRICE','DISC'].indexOf(c)>=0;});
    var month=(r.date||'').slice(0,7);
    var cand=promos.filter(function(c){return smMatch(c.saleMode,r.saleMode);}); if(!cand.length) cand=promos.slice();
    var ref=(r.campaignRef||'').toLowerCase().trim();
    var hit=ref?cand.filter(function(c){return String(c.campaign||'').toLowerCase().indexOf(ref)>=0;})[0]:null;
    if(!hit) hit=cand.filter(function(c){return String(c.itStatus).toUpperCase()==='COMPLETE';})[0]||cand[0]||null;
    var findings=[]; var rootCause='-'; var likelihood='ตรวจเพิ่ม';
    if(promoCause){
      if(!hit){ findings.push('ไม่พบโปรของสาขานี้ในเดือน '+month+' ในระบบ'); rootCause='อาจไม่มีการตั้งปุ่มสำหรับสาขานี้ (target/วันที่ไม่ครอบคลุม)'; likelihood='จริง (มีมูล)'; }
      else if(String(hit.itStatus).toUpperCase()==='COMPLETE'){ findings.push('พบโปร "'+hit.campaign+'" สถานะ COMPLETE — ปุ่มควรขึ้นบน POS แล้ว'); rootCause='ปุ่มถูกตั้งเสร็จแล้ว — อาจเป็นปัญหาเครื่อง/พนักงานหาปุ่มไม่เจอ มากกว่าปุ่มหายจริง'; likelihood='อาจไม่จริง'; }
      else { findings.push('พบโปร "'+hit.campaign+'" แต่ยัง '+(hit.itStatus||'PENDING')+' (ไม่ COMPLETE)'); rootCause='ปุ่มยังตั้งไม่เสร็จในวันนั้น — มีมูลว่าปุ่มไม่ขึ้นจริง'; likelihood='จริง (มีมูล)'; }
    } else {
      var diffT=(r.tenders||[]).filter(function(t){return (parseFloat(t.actual)||0)!==(parseFloat(t.pos)||0);}).map(function(t){return t.code;});
      findings.push('ส่วนต่างอยู่ที่ tender: '+(diffT.join(', ')||'-')); rootCause=(r.causes||[]).map(causeLabel).join(', ')||'-';
    }
    var ev=r.evidence||{}; var evN=Object.keys(ev).reduce(function(s,k){return s+((ev[k]||[]).length);},0); findings.push('หลักฐานแนบ '+evN+' รูป');
    return {rootCause:rootCause,likelihood:likelihood,confidence:'ปานกลาง',findings:findings,recommend:promoCause?'ตรวจ IT Settlement ว่าปุ่ม COMPLETE/posReady ในวันที่เกิดเหตุไหม แล้วยืนยันกับ IT':'เทียบยอดสลิป EDC กับ POS รายรายการ',_ai:false};
  }

      var campOk = p.campaign && t.campaign===p.campaign;
      return campOk;
    });
  }
  function crossCheckBox(f,p){
    var causes=f.causes||[];
    var lines=[];
    var expired = p.end && f.date && f.date>p.end;
    // 1) สถานะปุ่ม / หมดเขต
    if(causes.indexOf('DELIV')>=0){
      if(expired) lines.push('<span class="ok"><i class="fas fa-check"></i></span> โปรนี้หมดเขตแล้ว (สิ้นสุด '+esc(p.end||'-')+') — ปุ่มถูกถอดจาก POS ตามกำหนด ตรงกับอาการที่แจ้ง');
      else lines.push('<span class="qq"><i class="fas fa-question"></i></span> โปรนี้ยังไม่หมดเขต (สิ้นสุด '+esc(p.end||'-')+') — ปุ่มควรยังอยู่บน POS ต้องตรวจเพิ่ม');
    }
    if(causes.indexOf('BTN')>=0){
      if(p.itStatus==='COMPLETE') lines.push('<span class="warn"><i class="fas fa-triangle-exclamation"></i></span> ปุ่มนี้สถานะ <b>COMPLETE</b> (ถูกตั้งบน POS แล้ว) — ที่แจ้งว่า "ไม่ขึ้น" ต้องตรวจเพิ่ม');
      else lines.push('<span class="ok"><i class="fas fa-check"></i></span> ปุ่มนี้สถานะ <b>'+esc(p.itStatus||'PENDING')+'</b> ยังไม่ถูกตั้งบน POS — ตรงกับที่แจ้ง');
    }
    if(causes.indexOf('PRICE')>=0 || causes.indexOf('DISC')>=0){
      var diff=formDiffTotal(f);
      lines.push('<span class="qq"><i class="fas fa-scale-balanced"></i></span> ราคาที่อนุมัติ <b>'+(p.net?('฿'+p.net):'-')+'</b> · ส่วนต่างที่กรอกรวม <b>'+fmtB(diff)+'</b>');
    }
    // 2) ตรวจ ticket ที่แจ้ง IT จริง
    var tks=ticketMatches(f,p);
    if(tks.length){
      var t=tks[0];
      lines.push('<span class="ok"><i class="fas fa-ticket"></i></span> พบการแจ้ง IT จริง: <b>'+esc(t.id)+'</b> · '+fmtTs(t.createdAt)+' · สถานะ <b>'+esc(t.status||'OPEN')+'</b>'+(t.branch?(' · '+esc(t.branch)):''));
    } else {
      lines.push('<span class="warn"><i class="fas fa-ticket"></i></span> <b>ไม่พบ</b>การแจ้ง IT สำหรับโปรนี้ในระบบ — ถ้าสาขาบอกว่าแจ้งแล้ว ให้แนบหลักฐานการแจ้ง (ระบบจะถือว่า "ยังไม่ได้แจ้ง")');
    }
    return '<div class="ccbox"><div class="cchd"><i class="fas fa-magnifying-glass-chart me-1"></i> ระบบตรวจให้</div>'+lines.map(function(l){return '<div class="ccln">'+l+'</div>';}).join('')+'</div>';
  }
  function otherRefInputs(f){
    return '<div class="grid3"><div class="fld"><label>แคมเปญ/โปรที่เกี่ยวข้อง</label><input class="inp" value="'+esc(f.campaignRef||'')+'" oninput="window.BD.f(\'campaignRef\',this.value)" placeholder="ชื่อแคมเปญ"></div>'
      +'<div class="fld" style="grid-column:span 2"><label>สินค้า/ปุ่มที่มีปัญหา</label><input class="inp" value="'+esc(f.itemRef||'')+'" oninput="window.BD.f(\'itemRef\',this.value)" placeholder="Item code / ชื่อสินค้า"></div></div>';

  // ---- product master (ปุ่มสินค้าขายปกติ) ----
  var productCache=null, productLoading=false;
  function ensureProducts(){
    if(productCache || productLoading) return; productLoading=true;
    new Promise(function(res){ try{ if(typeof google!=='undefined'&&google.script&&google.script.run){ google.script.run.withSuccessHandler(function(d){res(d);}).withFailureHandler(function(){res(null);}).getMasterDataExtended(); return; } }catch(e){} res(null); })
      .then(function(d){ productCache=(d&&d.items)||[]; productLoading=false; render(); });
  }
  function smMatch(a,b){ a=String(a||'').toLowerCase(); b=String(b||'').toLowerCase(); if(!a||!b) return true; return a.split(' ')[0]===b.split(' ')[0] || a.indexOf(b)>=0 || b.indexOf(a)>=0; }
  // รายการปุ่มให้เลือก ตามประเภท (โปร/สินค้า) + Sale mode ที่เลือก
  function prodActive(it){ try{ if(String(it.category||'').toLowerCase()==='flavors') return false; var pf=JSON.parse(localStorage.getItem('pc_product_flags'))||{}; var fl=pf[it.itemCode]; if(fl && fl.active===0) return false;
      var cf=JSON.parse(localStorage.getItem('pc_cat_flags'))||{}; var cc=cf[it.category]; if(cc && cc.active===0) return false;
      var df=JSON.parse(localStorage.getItem('pc_dep_flags'))||{}; var dd=it.department&&df[it.department]; if(dd && dd.active===0) return false;
      return true; }catch(e){ return true; } }
  function buttonOptions(f){
    if(f._btnType==='product'){
      var sm=f.saleMode;
      return (productCache||[]).filter(prodActive).map(function(it){ var price=(sm==='Delivery')?it.priceDLV:it.priceTA;
        return { key:'P:'+it.itemCode, name:it.itemNameEN||it.itemCode, sub:(it.category||'')+(price?(' · ฿'+price):''), campaign:'', item:(it.itemCode?(it.itemCode+' · '):'')+(it.itemNameEN||'') };
      });
    }
    return promoFlat(f._promos).filter(function(p){ return smMatch(p.saleMode, f.saleMode); })
      .map(function(p,i){ return { key:'M:'+p.campaign+'|'+(p.sn||'')+'|'+i, name:p.campaign+' · '+(p.sn||'-'), sub:p.saleMode+(p.net?(' · ฿'+p.net):''), campaign:p.campaign, item:p.sn||'' }; });
  }
  function pickListHTML(f){ return ''; }
  function campaignList(f){ var seen={},out=[]; promoFlat(f._promos).filter(function(p){return smMatch(p.saleMode,f.saleMode);}).forEach(function(p){ if(p.campaign&&!seen[p.campaign]){seen[p.campaign]=1; out.push(p.campaign);} }); return out; }
  function buttonListFor(f){ var camp=(f.campaignRef||'').toLowerCase().trim(); var seen={},out=[];
    promoFlat(f._promos).filter(function(p){ return smMatch(p.saleMode,f.saleMode) && (!camp || String(p.campaign||'').toLowerCase()===camp); }).forEach(function(p){ if(p.sn&&!seen[p.sn]){seen[p.sn]=1; out.push(p.sn);} }); return out; }
  function promoPicker(f){
    if(!f.branchId || !f.date)
      return '<div class="rnote"><i class="fas fa-circle-info me-1" style="color:#c9870a"></i> เลือก <b>สาขา</b> และ <b>วันที่</b> ก่อน ระบบจะดึงปุ่มของสาขานั้นมาให้ค้นหา</div>';
    if(!f._btnType){ var hasProd=f.causes.some(function(c){return c==='PROD_BTN'||c==='PROD_PRICE';}); var hasPromoC=f.causes.some(function(c){return ['BTN','PRICE','DISC','DELIV'].indexOf(c)>=0;}); f._btnType=(hasProd&&!hasPromoC)?'product':'promo'; }
    var isProd=f._btnType==='product';
    var h='<div class="seg seg-sm" style="margin-bottom:9px">'
      +'<button type="button" class="'+(!isProd?'on':'')+'" onclick="window.BD.btnType(\'promo\')"><i class="fas fa-bullhorn me-1"></i>ปุ่มโปรโมชั่น</button>'
      +'<button type="button" class="'+(isProd?'on':'')+'" onclick="window.BD.btnType(\'product\')"><i class="fas fa-burger me-1"></i>ปุ่มสินค้าขายปกติ</button></div>';
    if(isProd){ if(!productCache){ ensureProducts(); return h+'<div class="rnote"><i class="fas fa-spinner fa-spin me-1"></i> กำลังดึงรายการสินค้า…</div>'; } }
    else { if(f._promosLoading) return h+'<div class="rnote"><i class="fas fa-spinner fa-spin me-1"></i> กำลังดึงปุ่มโปรของสาขา…</div>'; }
    if(isProd){
      var prods=(productCache||[]).filter(prodActive);
      h+='<div class="fld" style="margin:0"><label style="font-size:.8rem;color:#6a7178;font-weight:600">ชื่อสินค้า / รหัส <span style="font-weight:400;color:#9aa1aa">(เลือกจากรายการ หรือพิมพ์เอง)</span></label>'
        +'<input class="inp" list="bdProdList" placeholder="พิมพ์/เลือกชื่อสินค้า" value="'+esc(f.itemRef||'')+'" onchange="window.BD.pickProduct(this.value)">'
        +'<datalist id="bdProdList">'+prods.map(function(it){ return '<option value="'+esc(it.itemNameEN||it.itemCode)+'">'+esc((it.itemCode?it.itemCode+' · ':'')+(it.category||''))+'</option>'; }).join('')+'</datalist></div>';
    } else {
      var camps=campaignList(f), btns=buttonListFor(f);
      h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'
        +'<div class="fld" style="margin:0"><label style="font-size:.8rem;color:#6a7178;font-weight:600">ชื่อแคมเปญ / ชื่อโปรโมชั่น <span style="font-weight:400;color:#9aa1aa">(เลือก/พิมพ์)</span></label>'
        +'<input class="inp" list="bdCampList" placeholder="ชื่อแคมเปญ" value="'+esc(f.campaignRef||'')+'" onchange="window.BD.pickCampaign(this.value)">'
        +'<datalist id="bdCampList">'+camps.map(function(c){return '<option value="'+esc(c)+'"></option>';}).join('')+'</datalist></div>'
        +'<div class="fld" style="margin:0"><label style="font-size:.8rem;color:#6a7178;font-weight:600">ชื่อปุ่ม <span style="font-weight:400;color:#9aa1aa">(เลือก/พิมพ์)</span></label>'
        +'<input class="inp" list="bdBtnList" placeholder="ชื่อปุ่ม (short name)" value="'+esc(f.itemRef||'')+'" onchange="window.BD.pickButton(this.value)">'
        +'<datalist id="bdBtnList">'+btns.map(function(b){return '<option value="'+esc(b)+'"></option>';}).join('')+'</datalist></div></div>';
    }
    if(f.campaignRef||f.itemRef){
      h+='<div class="pksel"><i class="fas fa-circle-check me-1"></i>เลือกแล้ว: <b>'+esc(f.campaignRef? (f.campaignRef+(f.itemRef?(' · '+f.itemRef):'')) : f.itemRef)+'</b> <button type="button" onclick="window.BD.clearPick()">✕</button></div>';
    }
    return h;
  }


  function causeSelector(f){
    var open=f._causeOpen; var sel=f.causes||[];
    var summary = sel.length ? (sel.map(function(id){return causeLabel(id);}).slice(0,2).join(', ')+(sel.length>2?(' +'+(sel.length-2)+' รายการ'):'')) : 'แตะเพื่อเลือกสาเหตุ…';
    var h='<div class="csel">';
    h+='<button type="button" class="cselbtn'+(sel.length?' has':'')+'" onclick="window.BD.causeToggle()"><span>'+esc(summary)+'</span><i class="fas fa-chevron-'+(open?'up':'down')+'"></i></button>';
    if(open){
      h+='<div class="cselpanel">'+CATS.map(function(cat){
        var items=CAUSES.filter(function(c){return c.cat===cat.cat;}); if(!items.length) return '';
        return '<div class="cselgrp"><div class="cselgrp-hd"><i class="fas '+cat.icon+'"></i>'+esc(cat.label)+'</div>'
          +items.map(function(c){ var on=sel.indexOf(c.id)>=0; return '<label class="cselopt'+(on?' on':'')+'" onclick="window.BD.cause(\''+c.id+'\');event.preventDefault();"><span class="bx">'+(on?'<i class="fas fa-check"></i>':'')+'</span><span>'+esc(c.label)+'</span></label>'; }).join('')
          +'</div>';
      }).join('')+'<div class="cseldone"><button type="button" onclick="window.BD.causeToggle()">เสร็จ</button></div></div>';
    }
    h+='</div>';
    return h;
  }
  function bdBranchTid(branchId){ try{ var be=JSON.parse(localStorage.getItem('pc_branch_edc'))||{}; return (be[branchId]||{}).tid||''; }catch(e){ return ''; } }
  function bdOpenTenders(branchId){
    var reqs; try{ reqs=JSON.parse(localStorage.getItem('pc_tender_requests'))||[]; }catch(e){ reqs=[]; }
    var latest={};
    reqs.filter(function(r){ return r.branchId===branchId && r.tenderId; }).sort(function(a,b){ return (a.ts||0)-(b.ts||0); }).forEach(function(r){ latest[r.tenderId]={action:r.action,status:r.status}; });
    var open={}; Object.keys(latest).forEach(function(k){ var l=latest[k]; if(l.action==='OPEN' && l.status==='DONE') open[k]=1; }); return open;
  }
  function tenderRows(){
    var f=state.form, sm=f.saleMode;
    var open=bdOpenTenders(f.branchId); var edcTid=bdBranchTid(f.branchId);
    var list=tenderMaster().filter(function(t){ if(t.saleMode!==sm) return false; if(BRANCH_HIDE[t.code]) return false; if(t.kind==='manual') return !!open[t.code+'|'+t.saleMode]; return true; });
    // de-dup by code+name
    var seen={}, rows=[];
    list.forEach(function(t){ var k=t.code+'|'+t.name; if(seen[k])return; seen[k]=1; rows.push(t); });
    var html=rows.map(function(t){
      var a=f.amounts[t.code]||{}; var pos=a.pos===undefined?'':a.pos, act=a.actual===undefined?'':a.actual;
      var diff=(parseFloat(act)||0)-(parseFloat(pos)||0);
      var cls=diff>0?'pos':(diff<0?'neg':'zero');
      var isCC=(t.code==='CCDFT'||/credit\s*card/i.test(t.name||''));
      var srcTxt=t.iface ? (isCC ? '<span style="color:#9aa1aa">EDC KBank · Link POS · บัตรเครดิต</span>' : ('<span style="color:#9aa1aa">EDC KBank · Link POS · </span>'+(edcTid?'<span style="color:#9aa1aa">TID '+esc(edcTid)+'</span>':'<span style="color:#c0392b;font-weight:600">ไม่พบข้อมูล TID</span>'))) : esc(reconHint(t));
      return '<tr class="'+(diff!==0?'hasdiff':'')+'" data-code="'+esc(t.code)+'">'
        +'<td><div class="tname">'+esc(t.name)+(t.iface?(isCC?'':(edcTid?' <span style="color:#6c757d;font-size:.85em">· TID '+esc(edcTid)+'</span>':' <span style="color:#c0392b;font-size:.85em;font-weight:600">· ไม่พบข้อมูล TID</span>')):'')+'</div><div class="tsrc">'+srcTxt+'</div></td>'
        +'<td><input class="amt" type="number" step="0.01" value="'+esc(pos)+'" placeholder="0.00" oninput="window.BD.amt(\''+esc(t.code)+'\',\'pos\',this.value)"></td>'
        +'<td><input class="amt" type="number" step="0.01" value="'+esc(act)+'" placeholder="0.00" oninput="window.BD.amt(\''+esc(t.code)+'\',\'actual\',this.value)"></td>'
        +'<td class="diffv '+cls+'">'+(diff===0?'—':fmtB(diff))+'</td></tr>';
    }).join('');
    var tot=rows.reduce(function(s,t){ var a=f.amounts[t.code]||{}; return s+((parseFloat(a.actual)||0)-(parseFloat(a.pos)||0)); },0);
    var tcls=tot>0?'pos':(tot<0?'neg':'zero');
    html+='<tr class="totrow"><td>รวมส่วนต่าง (ยอดจริง − POS)</td><td></td><td></td><td class="diffv '+tcls+'">'+(tot===0?'฿0.00':fmtB(tot))+'</td></tr>';
    return html;
  }

  function flowBar(){ var s=['สาขาแจ้ง + แนบหลักฐาน','ส่งบัญชีตรวจสอบ','สรุปสาเหตุ / ปิดเคส'];

          +'<button class="btn btn-r btn-sm" onclick="window.BD.return(\''+r.id+'\')"><i class="fas fa-rotate-left"></i> ตีกลับขอข้อมูล</button>';

  function listHTML(rows, role, em){ if(!rows.length) return '<div class="empty"><i class="fas fa-inbox"></i>'+esc(em||'ไม่มีรายการ')+'</div>'; return rows.map(function(r){return reqCard(r,role);}).join(''); }

  // ===== accountant view =====

  // fetch IT settlement reference for each pending card

            : '<div style="font-size:.82rem;color:#8a9099">ไม่พบโปรของสาขานี้ในเดือนดังกล่าว — อาจไม่มีโปรช่วงนั้น หรือสาขาไม่อยู่ใน target</div>')+'</div>';

  // ===== actions =====
  window.BD={
    setRole:function(k){ state.role=k; if(k==='branch'&&!state.form) state.form=blankForm(); renderRoles(); render(); },
    f:function(k,v){ state.form[k]=v; if(k==='branchId'||k==='date'){ ensureBranchPromos(); } if(k==='detail'||k==='requester'||k==='campaignRef'||k==='itemRef'||k==='otherCause'||k==='noCloseReason') return; render(); },
    btnType:function(t){ var f=state.form; f._btnType=t; f._pickedKey=null; f._pickSearch=''; f.campaignRef=''; f.itemRef=''; render(); },
    pickCampaign:function(v){ var f=state.form; v=(v||'').trim(); f.campaignRef=v;
      var btns=promoFlat(f._promos).filter(function(p){ return smMatch(p.saleMode,f.saleMode) && String(p.campaign||'').toLowerCase()===v.toLowerCase(); });
      if(btns.length===1) f.itemRef=btns[0].sn||f.itemRef;
      render(); },
    pickButton:function(v){ var f=state.form; v=(v||'').trim(); f.itemRef=v;
      var hit=promoFlat(f._promos).filter(function(p){ return smMatch(p.saleMode,f.saleMode) && String(p.sn||'').toLowerCase()===v.toLowerCase(); });
      if(hit.length>=1){ f.campaignRef=hit[0].campaign; render(); return; }
      window.BD._fuzzy(v, function(o){ f.campaignRef=o.campaign; f.itemRef=o.item||o.name; }, 'button');
    },
    pickProduct:function(v){ var f=state.form; v=(v||'').trim(); f.campaignRef=''; f.itemRef=v;
      var exact=(productCache||[]).some(function(it){ return String(it.itemNameEN||'').toLowerCase()===v.toLowerCase(); });
      if(exact || !v){ render(); return; }
      window.BD._fuzzy(v, function(o){ f.itemRef=o.name; }, 'product');
    },
    _fuzzy:function(v, apply, kind){ var f=state.form; var lv=v.toLowerCase(); var best=null,score=0;
      buttonOptions(f).forEach(function(o){ var n=(o.name||'').toLowerCase(); var s=0;
        if(n===lv) s=100; else if(n.indexOf(lv)>=0||lv.indexOf(n)>=0) s=72;
        else { var toks=lv.split(/\s+/).filter(function(x){return x.length>1;}); var hit=toks.filter(function(x){return n.indexOf(x)>=0;}).length; s=hit*26; }
        if(s>score){ score=s; best=o; } });
      if(best && score>=50){
        Swal.fire({ icon:'question', title:'ใช่ปุ่มนี้ไหม?', html:'คุณพิมพ์ "<b>'+esc(v)+'</b>"<br>ระบบเจอใกล้เคียง:<br><b style="font-size:1.05rem">'+esc(best.name)+'</b><br><span style="font-size:.85rem;color:#888">'+esc(best.sub)+'</span>',
          showCancelButton:true, confirmButtonText:'ใช่ ใช้อันนี้', cancelButtonText:'ไม่ใช่ ใช้ที่พิมพ์', confirmButtonColor:'#2e934a' })
          .then(function(res){ if(res.isConfirmed){ apply(best); } render(); });
      } else { render(); }
    },
    clearPick:function(){ var f=state.form; f._pickedKey=null; f.campaignRef=''; f.itemRef=''; render(); },
    sm:function(v){ state.form.saleMode=v; render(); },
    amt:function(code,which,val){ var f=state.form; var a=f.amounts; a[code]=a[code]||{}; a[code][which]=val;
      var tb=document.getElementById('bdTenders'); if(!tb) return;
      var rowEl=tb.querySelector('tr[data-code="'+code+'"]');
      if(rowEl){ var rr=a[code]||{}; var d=(parseFloat(rr.actual)||0)-(parseFloat(rr.pos)||0);
        var cls=d>0?'pos':(d<0?'neg':'zero'); var cell=rowEl.querySelector('.diffv');
        if(cell){ cell.className='diffv '+cls; cell.textContent=(d===0?'—':fmtB(d)); }
        rowEl.className=(d!==0?'hasdiff':'');
      }
      var tot=0; Object.keys(a).forEach(function(k){ tot+=((parseFloat(a[k].actual)||0)-(parseFloat(a[k].pos)||0)); });
      var totCell=tb.querySelector('tr.totrow .diffv');
      if(totCell){ var tcls=tot>0?'pos':(tot<0?'neg':'zero'); totCell.className='diffv '+tcls; totCell.textContent=(tot===0?'฿0.00':fmtB(tot)); }
    },
    cause:function(id){ var c=state.form.causes; var i=c.indexOf(id); if(i>=0)c.splice(i,1); else c.push(id); render(); },
    causeToggle:function(){ state.form._causeOpen=!state.form._causeOpen; render(); },
    evAdd:function(key,files){ if(!files||!files.length) return; var f=state.form; f.evidence[key]=f.evidence[key]||[];
      var arr=Array.prototype.slice.call(files); var n=arr.length;
      arr.forEach(function(file){ if(!/^image\//.test(file.type)){ n--; return; } compress(file).then(function(u){ f.evidence[key].push(u); n--; if(n<=0) render(); }); });
      if(n<=0) render();
    },
    evDel:function(key,i){ state.form.evidence[key].splice(i,1); render(); },
    zoom:function(key,i){ var u=state.form.evidence[key][i]; if(u) Swal.fire({imageUrl:u,imageAlt:'evidence',width:640,showConfirmButton:false,showCloseButton:true}); },
    zoomR:function(id,key,i){ var r=load().filter(function(x){return x.id===id;})[0]; if(!r) return; var u=(r.evidence[key]||[])[i]; if(u) Swal.fire({imageUrl:u,width:680,showConfirmButton:false,showCloseButton:true}); },
    submit:function(){
      var f=state.form;
      if(!f.branchId){ return Swal.fire({icon:'warning',title:'เลือกสาขา',confirmButtonColor:'#2e934a'}); }
      if(!f.date){ return Swal.fire({icon:'warning',title:'เลือกวันที่ปิดกะ/บิล',confirmButtonColor:'#2e934a'}); }
      var tlist=tenderMaster().filter(function(t){return t.saleMode===f.saleMode && !BRANCH_HIDE[t.code];});
      var tenders=[]; var anyAmt=false;
      var seen={};
      tlist.forEach(function(t){ var k=t.code+'|'+t.name; if(seen[k])return; seen[k]=1; var a=f.amounts[t.code]||{};
        var pos=parseFloat(a.pos)||0, act=parseFloat(a.actual)||0; if(a.pos!==undefined||a.actual!==undefined){ if(pos||act) anyAmt=true; }
        tenders.push({code:t.code,name:t.name,pos:pos,actual:act}); });
      if(!anyAmt){ return Swal.fire({icon:'warning',title:'กรอกยอดอย่างน้อย 1 ช่อง',text:'ใส่ยอด POS และยอดจริงเพื่อให้เห็นส่วนต่าง',confirmButtonColor:'#2e934a'}); }
      if(!f.causes.length){ return Swal.fire({icon:'warning',title:'เลือกสาเหตุที่คาดว่า',confirmButtonColor:'#2e934a'}); }
      if(f.causes.indexOf('NOCLOSE')>=0 && !String(f.noCloseReason||'').trim()){ return Swal.fire({icon:'warning',title:'ระบุสาเหตุที่จบบิล POS ไม่ได้',confirmButtonColor:'#2e934a'}); }
      var req=evRequired(f.causes); var miss=EV.filter(function(e){ return req[e.key] && !((f.evidence[e.key]||[]).length); });
      if(miss.length){ return Swal.fire({icon:'warning',title:'แนบหลักฐานให้ครบ',html:'ยังขาด: <b>'+miss.map(function(e){return esc(e.label);}).join(', ')+'</b>',confirmButtonColor:'#2e934a'}); }

      var a=load(); var keepId=f._editId;
      var rec={ id:keepId||nextId(), branchId:f.branchId, date:f.date, saleMode:f.saleMode, requester:f.requester||'สาขา',
        tenders:tenders, causes:f.causes.slice(), otherCause:f.otherCause||'', noCloseReason:f.noCloseReason||'', campaignRef:f.campaignRef||'', itemRef:f.itemRef||'',
        detail:f.detail||'', evidence:f.evidence, aiFinding:f.aiFinding||null, aiDecision:f.aiDecision||null, ts:Date.now(), status:'SUBMITTED' };
      if(keepId){ var idx=a.findIndex(function(x){return x.id===keepId;}); if(idx>=0){ rec.evidence=f.evidence; a[idx]=rec; } else a.push(rec); }
      else a.push(rec);
      if(!save(a)){ return Swal.fire({icon:'error',title:'บันทึกไม่สำเร็จ',text:'พื้นที่จัดเก็บอาจเต็ม (รูปหลักฐานเยอะเกินไป)',confirmButtonColor:'#c0392b'}); }
      state.form=blankForm();
      try{ if(window.PC_notify) window.PC_notify('billdiff_submitted',{ text:'สาขา '+esc(rec.branchId||'')+' แจ้งปิดบิลไม่ตรง ('+esc(rec.id)+') · '+esc(rec.date||'')+' — รอบัญชีตรวจสอบ' }); }catch(e){}
      Swal.fire({icon:'success',title:'ส่งให้บัญชีแล้ว',text:'รหัส '+rec.id,confirmButtonColor:'#2e934a'});
      render();
    },
    edit:function(id){ var r=load().filter(function(x){return x.id===id;})[0]; if(!r) return;
      var f=blankForm(); f._editId=id; f.branchId=r.branchId; f.date=r.date; f.saleMode=r.saleMode; f.requester=r.requester;
      f.causes=(r.causes||[]).slice(); f.otherCause=r.otherCause||''; f.campaignRef=r.campaignRef||''; f.itemRef=r.itemRef||''; f.detail=r.detail||'';
      f.evidence=r.evidence||{}; (r.tenders||[]).forEach(function(t){ f.amounts[t.code]={pos:t.pos,actual:t.actual}; });
      state.form=f; state.role='branch'; renderRoles(); render(); window.scrollTo(0,0);
    },
    del:function(id){ Swal.fire({icon:'warning',title:'ลบคำแจ้งนี้?',showCancelButton:true,confirmButtonColor:'#c0392b',confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก'}).then(function(res){ if(res.isConfirmed){ save(load().filter(function(x){return x.id!==id;})); render(); } }); },
    resolve:function(id){ var r=load().filter(function(x){return x.id===id;})[0]; if(!r) return;
      var opts=(r.causes||[]).map(function(c){ return '<option value="'+c+'">'+esc(causeLabel(c))+'</option>'; }).join('')+'<option value="HUMAN">กดผิด / human error</option><option value="NONE">ไม่พบความผิดปกติ</option>';
      Swal.fire({ title:'บันทึกผลตรวจสอบ', width:480,
        html:'<div style="text-align:left;font-family:Kanit,sans-serif;">'
          +'<label style="font-size:.82rem;font-weight:600;color:#5a616b;">สาเหตุที่ยืนยัน</label>'
          +'<select id="bd_cc" class="swal2-select" style="width:100%;display:block;margin:5px 0 12px;">'+opts+'</select>'
          +'<label style="font-size:.82rem;font-weight:600;color:#5a616b;">สรุป / หมายเหตุผลตรวจ</label>'
          +'<textarea id="bd_note" class="swal2-textarea" style="width:100%;margin:5px 0 0;" placeholder="เช่น ยืนยันปุ่มยังไม่ posReady วันนั้น ส่วนต่างเกิดจากกดราคาเต็ม"></textarea></div>',
        showCancelButton:true, confirmButtonColor:'#2e934a', confirmButtonText:'ปิดเคส', cancelButtonText:'ยกเลิก', focusConfirm:false,
        preConfirm:function(){ return { cc:document.getElementById('bd_cc').value, note:(document.getElementById('bd_note').value||'').trim() }; }
      }).then(function(res){ if(!res.isConfirmed) return; var a=load(); var x=a.filter(function(y){return y.id===id;})[0];
        x.status='RESOLVED'; x.review={ by:'บัญชี', ts:Date.now(), causeConfirmed:res.value.cc, note:res.value.note }; delete x.returnReason; save(a); render();
        try{ if(window.PC_notify) window.PC_notify('billdiff_resolved',{ text:'ปิดเคสปิดบิลไม่ตรง สาขา '+esc(x.branchId||'')+' ('+esc(x.id)+') — สาเหตุ: '+esc(res.value.cc||'-')+(res.value.note?' · '+esc(res.value.note):'') }); }catch(e){}
        Swal.fire({icon:'success',title:'ปิดเคสแล้ว',timer:1200,showConfirmButton:false}); });
    },
    aiCheck:function(){ (async function(){
      var f=state.form;
      if(!f.branchId||!f.date){ Swal.fire({icon:'info',title:'เลือกสาขาและวันที่ก่อน',confirmButtonColor:'#2e934a'}); return; }
      var box=document.getElementById('bdAiBox'); if(box) box.innerHTML='<div class="ai-loading"><i class="fas fa-spinner fa-spin me-1"></i> AI กำลังตรวจกับปุ่มที่ตั้งไว้ในระบบ...</div>';
      var month=f.date.slice(0,7); var promos=await getBranchPromos(f.branchId, month);
      var slim=promos.map(function(c){ return {campaign:c.campaign,saleMode:c.saleMode,itStatus:c.itStatus,start:c.start,end:c.end,net:(c.buttons&&c.buttons[0]&&c.buttons[0].net)||''}; });
      var prompt='คุณเป็นผู้ช่วย Audit ของ Potato Corner. สาขา '+f.branchId+' กำลังจะแจ้งปิดบิลไม่ตรง โดยคาดว่าสาเหตุ: '+f.causes.map(causeLabel).join(', ')+'. อ้างถึงโปร/สินค้า: "'+(f.campaignRef||'-')+' / '+(f.itemRef||'-')+'" sale mode '+f.saleMode+'.\nนี่คือปุ่มโปรที่ MKT/IT ตั้งไว้ในระบบสำหรับสาขานี้เดือน '+month+' (JSON): '+JSON.stringify(slim)+'\nงาน: ตรวจว่ามีปุ่มที่ตรงกับที่สาขาอ้างไหม และปุ่มนั้น itStatus=COMPLETE (พร้อมขึ้น POS) หรือยัง.\nตอบ JSON ภาษาไทยเท่านั้น: {"match":true/false,"promo":"ชื่อแคมเปญที่ตรง","status":"COMPLETE/PENDING/-","verdict":"สั้นๆ เช่น น่าจะมีปุ่มอยู่แล้ว | ปุ่มยังไม่พร้อมจริง | ไม่พบปุ่ม","message":"ข้อความสุภาพถามสาขาว่าใช่โปรนี้ไหม และแนะนำให้ตรวจ POS ก่อนแจ้ง diff"}';
      var raw=await aiComplete(prompt); var fin=raw?parseJSON(raw):null; if(fin) fin._ai=true; if(!fin) fin=heurMatch(promos,f);
      state.form.aiFinding=fin; state.form.aiDecision=null;
      var b=document.getElementById('bdAiBox'); if(b) b.innerHTML=aiResultHTML(fin);
    })(); },
    aiAccept:function(){ state.form.aiDecision='accept'; var b=document.getElementById('bdAiBox'); if(b) b.innerHTML=aiResultHTML(state.form.aiFinding); },
    aiReject:function(){ state.form.aiDecision='reject'; var b=document.getElementById('bdAiBox'); if(b) b.innerHTML=aiResultHTML(state.form.aiFinding); },
    aiAudit:function(id){ (async function(){
      var r=load().filter(function(x){return x.id===id;})[0]; if(!r) return;
      var box=document.getElementById('aiaudit-'+id); if(box) box.innerHTML='<div class="aibox"><div class="ai-loading"><i class="fas fa-spinner fa-spin me-1"></i> AI กำลังวิเคราะห์เคส...</div></div>';
      var month=(r.date||'').slice(0,7); var promos=await getBranchPromos(r.branchId, month);
      var slim=promos.map(function(c){ return {campaign:c.campaign,saleMode:c.saleMode,itStatus:c.itStatus,start:c.start,end:c.end,net:(c.buttons&&c.buttons[0]&&c.buttons[0].net)||''}; });
      var diffs=(r.tenders||[]).map(function(t){ return {code:t.code,pos:t.pos,actual:t.actual,diff:(parseFloat(t.actual)||0)-(parseFloat(t.pos)||0)}; });
      var ev=r.evidence||{}; var evN=Object.keys(ev).reduce(function(s,k){return s+((ev[k]||[]).length);},0);
      var prompt='คุณเป็นผู้ตรวจสอบ (Audit) ยอดปิดบิลของ Potato Corner ช่วยวิเคราะห์ว่าสาเหตุที่แท้จริงของ diff คืออะไร และเคลมของสาขาน่าเชื่อถือแค่ไหน.\nเคส: สาขา '+r.branchId+' วันที่ '+r.date+' sale mode '+r.saleMode+'. สาเหตุที่สาขาคาด: '+(r.causes||[]).map(causeLabel).join(', ')+'. อ้างถึงโปร: "'+(r.campaignRef||'-')+' / '+(r.itemRef||'-')+'". รายละเอียด: "'+(r.detail||'-')+'". ยอดแยก tender (JSON): '+JSON.stringify(diffs)+'. แนบหลักฐาน '+evN+' รูป.\nปุ่มโปรที่ MKT/IT ตั้งไว้ในระบบสำหรับสาขานี้เดือน '+month+' (JSON): '+JSON.stringify(slim)+'.\nตอบ JSON ภาษาไทยเท่านั้น: {"rootCause":"สาเหตุที่เป็นไปได้มากสุด","likelihood":"จริง (มีมูล) | อาจไม่จริง | ตรวจเพิ่ม","confidence":"สูง/ปานกลาง/ต่ำ","findings":["ข้อสังเกต1","ข้อสังเกต2"],"recommend":"ขั้นตอนถัดไปสำหรับบัญชี/IT"}';
      var raw=await aiComplete(prompt); var d=raw?parseJSON(raw):null; if(d) d._ai=true; if(!d) d=heurAudit(r,promos);
      var a=load(); var x=a.filter(function(y){return y.id===id;})[0]; if(x){ x.aiAudit=d; save(a); } render();
    })(); },
    return:function(id){ Swal.fire({title:'ตีกลับขอข้อมูลเพิ่ม',input:'textarea',inputPlaceholder:'ระบุข้อมูล/หลักฐานที่ต้องการเพิ่ม...',showCancelButton:true,confirmButtonColor:'#c0392b',confirmButtonText:'ตีกลับ',cancelButtonText:'ยกเลิก',inputValidator:function(v){ if(!v) return 'กรุณาระบุเหตุผล'; }}).then(function(res){ if(!res.isConfirmed) return; var a=load(); var x=a.filter(function(y){return y.id===id;})[0]; x.status='RETURNED'; x.returnReason=res.value; save(a); render(); }); }
  };

  window.initBillDiff=function(){ seed(); state={ role:'branch', form:blankForm() }; renderRoles(); render(); };
})();
</script>
