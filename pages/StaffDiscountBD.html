<!-- ============================================================
     pages/StaffDiscount.html — รหัสส่วนลดพนักงาน (Staff Discount · FRC)
     entry: initStaffDiscount()
     โมเดล (ยืนยันกับ user · ทำให้เหมือนหน้าบัตรสมาชิก):
       1) เลือกบริษัท FRC → "เพิ่มเงื่อนไขส่วนลด" (เหมือนเพิ่มบัตร)
          · แนบรายชื่อพนักงานมาเลยได้ (optional) · IT มาดูว่าต้องเซตอะไรเข้าระบบ
       2) หลังขึ้นระบบแล้ว → Area/สาขา "ขอเพิ่มพนักงาน" ใต้เงื่อนไข
     ตารางแยกจากโปรโมชัน (ไม่แตะ pc_mock_store_v28):
       • pc_staff_conditions — เงื่อนไข (เหมือน "ประเภทบัตร")
       • pc_staff_discounts  — คำขอพนักงาน (เหมือน "โค้ดบัตร")
     บริษัท FRC ดึงจาก PC_BRANCH_MASTER.company (สาขาแฟรนไชส์)
     ============================================================ -->

<div class="sd-scope">
  <div class="sd-head">
    <div class="ic"><i class="fas fa-user-tag"></i></div>
    <div>
      <h1>เงื่อนไขส่วนลดพนักงาน FRC (BD)</h1>
      <div class="sub">Admin FRC / BD — เพิ่มเงื่อนไขส่วนลดให้บริษัท FRC แล้วส่งให้ IT ตั้งค่าเข้าระบบ</div>
    </div>
  </div>

  <!-- บริษัท FRC -->
  <div class="cbar">
    <div class="cbico"><i class="fas fa-building"></i></div>
    <div class="cbsel">
      <div class="cbl">บริษัท FRC</div>
      <input id="sdCoInp" class="cbin" placeholder="คลิกเพื่อเลือก / พิมพ์ค้นหาบริษัทแฟรนไชส์…" oninput="window.sdCoFilter()" onfocus="window.sdCoOpen()" autocomplete="off">
      <div id="sdCoMenu" class="cbmenu"></div>
    </div>
    <div class="cbmeta" id="sdCoMeta"><span class="cbbadge">ยังไม่เลือกบริษัท</span></div>
  </div>

  <!-- เงื่อนไขส่วนลด (เหมือนบัตร) -->
  <div class="card2">
    <div class="ch"><i class="fas fa-percent lead"></i> เงื่อนไขส่วนลดของบริษัท <span id="sdCondCount" style="font-family:'Kanit';font-weight:500;font-size:.8rem;color:#8a9099"></span>
      <span class="r"><button class="btnp" id="sdAddCondBtn" onclick="window.sdAddCondition()"><i class="fas fa-plus"></i> เพิ่มเงื่อนไข (แจ้ง IT)</button></span></div>
    <div class="cb" id="sdCondWrap"><div class="condgrid" id="sdCondList"></div></div>
  </div>

<script>
  (function () {
    var CO_KEY='pc_staff_active_company', COND_KEY='pc_staff_conditions', EMP_KEY='pc_staff_discounts';
    /* เห็นเฉพาะสาขาแฟรนไชส์ประเภท DOCO · DODO · DODO-M (งานสาขา) */
    function isFrcType(t){ t=String(t||'').toUpperCase().trim(); return t==='DOCO'||t==='DODO'||t==='DODO-M'; }
    function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function loadA(k){ try{ return JSON.parse(localStorage.getItem(k))||[]; }catch(e){ return []; } }
    function saveA(k,a){ try{ localStorage.setItem(k,JSON.stringify(a)); }catch(e){} }
    function fmtDate(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso||'')); return m?(m[3]+'/'+m[2]+'/'+m[1].slice(2)):'-'; }
    function branches(){ var b=(window.PC_BRANCH_MASTER||[]).slice();
      try{ var ml=JSON.parse(localStorage.getItem('pc_master_lists')||'null'); if(ml&&Array.isArray(ml.branches)){ var s={}; b.forEach(function(x){s[String(x.id)]=1;}); ml.branches.forEach(function(x){ if(x&&x.id&&!s[String(x.id)]){ b.push(x); s[String(x.id)]=1; } }); } }catch(e){}
      return b; }
    function frcCompanies(){ var m={}; branches().forEach(function(b){ if(isFrcType(b.type)&&b.company){ m[b.company]=(m[b.company]||0)+1; } });
      return Object.keys(m).sort().map(function(c){ return {company:c,count:m[c]}; }); }
    function companyBranches(co){ return branches().filter(function(b){ return b.company===co && isFrcType(b.type); }); }

    var ACTIVE_CO='';
    function setCo(co){ ACTIVE_CO=co||''; try{ localStorage.setItem(CO_KEY,ACTIVE_CO); }catch(e){} }

    /* ---------- company dropdown (custom · เชื่อถือได้กว่า datalist) ---------- */
    var CO_FILTERED=[];
    window.sdCoOpen=function(){ document.getElementById('sdCoMenu').classList.add('show'); window.sdCoFilter(true); };
    window.sdCoClose=function(){ var m=document.getElementById('sdCoMenu'); if(m) m.classList.remove('show'); };
    window.sdCoFilter=function(showAll){
      var raw=(document.getElementById('sdCoInp').value||'').trim().toLowerCase();
      var q=(showAll===true)?'':raw;
      var list=frcCompanies();
      CO_FILTERED = q ? list.filter(function(x){ return x.company.toLowerCase().indexOf(q)>-1; }) : list;
      var m=document.getElementById('sdCoMenu'); if(!m) return;
      m.classList.add('show');
      m.innerHTML = CO_FILTERED.length
        ? CO_FILTERED.map(function(x,i){ return '<div class="ci" onmousedown="window.sdCoPick('+i+')"><span>'+esc(x.company)+'</span><span class="cnt">'+x.count+' สาขา</span></div>'; }).join('')
        : '<div class="ci empty">ไม่พบบริษัท</div>';
    };
    window.sdCoPick=function(i){
      var x=CO_FILTERED[i]; if(!x) return;
      document.getElementById('sdCoInp').value=x.company; setCo(x.company); window.sdCoClose();
      document.getElementById('sdCoMeta').innerHTML='<i class="fas fa-store"></i> '+x.count+' สาขา <span class="cbadge">FRC</span>';
      window.sdRenderConditions(); window.sdRenderEmp();
    };

    /* ---------- STEP 1: add condition (เหมือนเพิ่มบัตร) ---------- */
    window.sdAddCondition=function(){
      if(!ACTIVE_CO){ Swal.fire('เลือกบริษัทก่อน','กรุณาเลือกบริษัท FRC ด้านบน','warning'); return; }
      Swal.fire({
        title:'เพิ่มเงื่อนไขส่วนลด', width:560, confirmButtonColor:'#1f8a4e', confirmButtonText:'ส่งแจ้ง IT', showCancelButton:true, cancelButtonText:'ยกเลิก',
        html:'<div style="text-align:left;font-size:14px">'+
          '<div style="background:#eafaf1;border:1px solid #bfe6cd;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px">บริษัท: <b>'+esc(ACTIVE_CO)+'</b></div>'+
          '<label style="font-weight:700;display:block;margin:2px 0 4px">ชื่อเงื่อนไขส่วนลด *</label>'+
          '<input id="scName" class="swal2-input" style="width:100%;margin:0 0 12px" placeholder="เช่น Staff Discount 50%">'+
          '<div style="display:flex;gap:10px">'+
            '<div style="flex:1"><label style="font-weight:700;display:block;margin:2px 0 4px">Type Promotion *</label>'+
            '<select id="scType" class="swal2-select" style="width:100%;margin:0"><option value="Bill Discount Online">Bill Discount Online</option><option value="Item Coupon Online">Item Coupon Online</option></select></div>'+
            '<div style="width:150px"><label style="font-weight:700;display:block;margin:2px 0 4px">มูลค่า *</label>'+
            '<div style="display:flex;gap:6px"><input id="scValue" type="number" min="0" class="swal2-input" style="margin:0;width:100%" placeholder="50"><select id="scUnit" class="swal2-select" style="margin:0;width:70px"><option value="%">%</option><option value="฿">฿</option></select></div></div>'+
          '</div>'+
          '<div style="display:flex;gap:10px;margin-top:12px">'+
            '<div style="flex:1"><label style="font-weight:700;display:block;margin:2px 0 4px">วันที่เริ่ม</label><input id="scFrom" type="date" class="swal2-input" style="margin:0;width:100%"></div>'+
            '<div style="flex:1"><label style="font-weight:700;display:block;margin:2px 0 4px">วันที่สิ้นสุด</label><input id="scTo" type="date" class="swal2-input" style="margin:0;width:100%"></div>'+
          '</div>'+
          '<label style="font-weight:700;display:block;margin:14px 0 4px">รายชื่อพนักงาน (แจ้งมาเลยได้ · ไม่บังคับ)</label>'+
          '<textarea id="scEmps" class="swal2-textarea" style="width:100%;margin:0;min-height:90px;font-size:13px" placeholder="1 บรรทัด/คน — ชื่อ, รหัสพนักงาน, รหัสสาขา&#10;เช่น  สมชาย ใจดี, 50421, PC1001"></textarea>'+
          '<div style="font-size:12px;color:#8a9099;margin-top:4px">เว้นว่างได้ — ค่อยให้ Area เพิ่มพนักงานทีหลัง</div>'+
          '<label style="font-weight:700;display:block;margin:14px 0 4px">แนบไฟล์รายละเอียด/รายชื่อ (ไม่บังคับ)</label>'+
          '<input id="scFile" type="file" class="swal2-file" style="width:100%;margin:0" accept=".xlsx,.xls,.csv,.pdf,.png,.jpg,.jpeg,.doc,.docx">'+
        '</div>',
        preConfirm:function(){
          var name=(document.getElementById('scName').value||'').trim();
          var val=(document.getElementById('scValue').value||'').trim();
          if(!name){ Swal.showValidationMessage('กรอกชื่อเงื่อนไข'); return false; }
          if(val===''){ Swal.showValidationMessage('กรอกมูลค่าส่วนลด'); return false; }
          var base = { name:name, typeP:document.getElementById('scType').value, val:Number(val)||0, unit:document.getElementById('scUnit').value,
            from:document.getElementById('scFrom').value||'', to:document.getElementById('scTo').value||'', emps:(document.getElementById('scEmps').value||'') };
          var fEl=document.getElementById('scFile'); var f=fEl&&fEl.files&&fEl.files[0];
          if(!f) return base;
          if(f.size>3*1024*1024){ Swal.showValidationMessage('ไฟล์ใหญ่เกิน 3MB'); return false; }
          return new Promise(function(resolve){ var r=new FileReader(); r.onload=function(){ base.fileName=f.name; base.fileData=r.result; resolve(base); }; r.onerror=function(){ resolve(base); }; r.readAsDataURL(f); });
        }
      }).then(function(res){
        if(!res.isConfirmed) return; var v=res.value;
        var condId='sc'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
        var conds=loadA(COND_KEY);
        conds.unshift({ id:condId, company:ACTIVE_CO, name:v.name, typePromotion:v.typeP, value:v.val, unit:v.unit, from:v.from, to:v.to,
          status:'WAIT_IT', code:'', staffType:'FRC', fileName:v.fileName||'', fileData:v.fileData||'', createdAt:new Date().toISOString(),
          createdBy:(function(){ try{ return localStorage.getItem('pc_userName')||''; }catch(e){ return ''; } })() });
        saveA(COND_KEY, conds);
        // แนบรายชื่อพนักงานที่แจ้งมาเลย
        var added=0; var lines=String(v.emps||'').split('\n').map(function(s){return s.trim();}).filter(Boolean);
        if(lines.length){ var emps=loadA(EMP_KEY);
          lines.forEach(function(ln){ var p=ln.split(',').map(function(s){return s.trim();}); var nm=p[0]||''; var cd=p[1]||''; var brId=p[2]||''; if(!nm) return;
            var b=companyBranches(ACTIVE_CO).find(function(x){ return String(x.id)===brId; })||{};
            emps.unshift({ id:'sd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), company:ACTIVE_CO, conditionId:condId, typeName:v.name, typeCode:'', typePromotion:v.typeP,
              empName:nm, empCode:cd, branchId:String(b.id||brId||''), branchName:b.nameTH||b.name||String(b.id||brId||'-'),
              status:'PENDING', createdAt:new Date().toISOString() }); added++; });
          saveA(EMP_KEY, emps);
        }
        Swal.fire({icon:'success', title:'ส่งแจ้ง IT แล้ว', html:'<b>'+esc(v.name)+'</b> · '+esc(v.typeP)+(added?('<br>แนบพนักงาน '+added+' คน'):'')+'<br><span style="color:#8a9099;font-size:.85rem">IT จะดูและตั้งค่าเข้าระบบ</span>', timer:2400, showConfirmButton:false});
        window.sdRenderConditions(); window.sdRenderEmp();
      });
    };
    window.sdDeleteCondition=function(id){ Swal.fire({icon:'warning',title:'ลบเงื่อนไขนี้?',showCancelButton:true,confirmButtonColor:'#c0392b',confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก'}).then(function(r){ if(!r.isConfirmed) return; saveA(COND_KEY, loadA(COND_KEY).filter(function(x){return x.id!==id;})); window.sdRenderConditions(); }); };
    window.sdConfigCondition=function(id){ Swal.fire({title:'IT ตั้งค่าเข้าระบบ',input:'text',inputLabel:'ใส่ Type Code (เช่น BD165 / IC0590)',inputPlaceholder:'BDxxxx / ICxxxx',showCancelButton:true,confirmButtonColor:'#1f8a4e',confirmButtonText:'บันทึก · พร้อมใช้',cancelButtonText:'ยกเลิก'}).then(function(r){ if(!r.isConfirmed) return; var code=(r.value||'').trim().toUpperCase(); var all=loadA(COND_KEY); var c=all.find(function(x){return x.id===id;}); if(!c) return; c.code=code; c.status=code?'READY':'WAIT_IT'; saveA(COND_KEY,all);
        // อัปเดต typeCode ให้พนักงานใต้เงื่อนไขนี้
        var emps=loadA(EMP_KEY); emps.forEach(function(e){ if(e.conditionId===id) e.typeCode=code; }); saveA(EMP_KEY,emps);
        window.sdRenderConditions(); window.sdRenderEmp(); }); };

    function companyConditions(){ return loadA(COND_KEY).filter(function(c){ return c.company===ACTIVE_CO; }); }
    window.sdViewFile=function(id){ var c=loadA(COND_KEY).find(function(x){return x.id===id;}); if(!c||!c.fileData){ Swal.fire('ไม่มีไฟล์แนบ','',"info"); return; }
      if(/^data:image/.test(c.fileData)){ var w=window.open(''); if(w) w.document.write('<title>'+esc(c.fileName)+'</title><img src="'+c.fileData+'" style="max-width:100%">'); return; }
      var a=document.createElement('a'); a.href=c.fileData; a.download=c.fileName||'attachment'; a.click(); };
    window.sdRenderConditions=function(){
      var wrap=document.getElementById('sdCondWrap');
      document.getElementById('sdAddCondBtn').style.display = ACTIVE_CO ? '' : 'none';
      if(!ACTIVE_CO){ wrap.innerHTML='<div class="disabled-note"><i class="fas fa-arrow-up me-1"></i> เลือกบริษัท FRC ด้านบนก่อน</div>'; document.getElementById('sdCondCount').textContent=''; return; }
      wrap.innerHTML='<div class="condgrid" id="sdCondList"></div>';
      var list=document.getElementById('sdCondList'); var conds=companyConditions(); var emps=loadA(EMP_KEY);
      document.getElementById('sdCondCount').textContent='· '+conds.length+' เงื่อนไข';
      if(!conds.length){ list.innerHTML='<div class="empty" style="grid-column:1/-1"><i class="fas fa-percent fa-lg" style="opacity:.4;display:block;margin-bottom:8px"></i>ยังไม่มีเงื่อนไข — กด “เพิ่มเงื่อนไข (แจ้ง IT)”</div>'; return; }
      list.innerHTML=conds.map(function(c){
        var tp=/item/i.test(c.typePromotion)?'item':'bill';
        var stCls=c.status==='READY'?'ready':'wait'; var stTxt=c.status==='READY'?('<i class="fas fa-circle-check"></i> พร้อมใช้'):'<i class="fas fa-clock"></i> รอ IT ตั้งค่า';
        var n=emps.filter(function(e){ return e.conditionId===c.id; }).length;
        return '<div class="condcard">'+
          '<div class="cc-nm">'+esc(c.name)+'</div>'+
          '<div class="cc-row"><span class="cbadge '+tp+'">'+esc(c.typePromotion)+'</span><span><i class="fas fa-tag me-1"></i>'+esc(c.value)+' '+esc(c.unit)+'</span>'+((c.from||c.to)?('<span><i class="far fa-calendar me-1"></i>'+fmtDate(c.from)+' – '+fmtDate(c.to)+'</span>'):'')+'</div>'+
          (c.fileName?('<div class="cc-row"><span class="btnsm" style="cursor:pointer;padding:4px 11px" onclick="window.sdViewFile(\''+c.id+'\')"><i class="fas fa-paperclip"></i> '+esc(String(c.fileName).slice(0,28))+'</span></div>'):'')+
          '<div class="cc-foot"><span class="st '+stCls+'">'+stTxt+'</span>'+(c.code?('<span class="cc-code">'+esc(c.code)+'</span>'):'')+'<span class="cc-cnt" style="margin-left:auto">'+n+' พนักงาน</span></div>'+
          '<div class="cc-foot">'+
            (c.status==='READY'?('<span style="font-size:.78rem;color:#1f8a4e;font-weight:700"><i class="fas fa-circle-check me-1"></i>IT ตั้งค่าแล้ว · '+n+' พนักงาน</span>'):('<span style="font-size:.78rem;color:#a06d13;font-weight:700"><i class="fas fa-hourglass-half me-1"></i>รอ IT ตั้งค่าเข้าระบบ</span>'))+
            '<button class="xbtn" style="margin-left:auto" title="ลบ" onclick="window.sdDeleteCondition(\''+c.id+'\')"><i class="fas fa-trash-alt"></i></button>'+
          '</div>'+
        '</div>';
      }).join('');
    };

    /* ---------- STEP 2: Area add employee ---------- */
    window.sdAddEmployee=function(condId){
      var c=companyConditions().find(function(x){ return x.id===condId; }); if(!c) return;
      var brs=companyBranches(ACTIVE_CO);
      var brOpts='<option value="">— เลือกสาขา —</option>'+brs.map(function(b){ return '<option value="'+esc(b.id)+'">'+esc(b.id+' · '+(b.nameTH||b.name||''))+'</option>'; }).join('');
      Swal.fire({ title:'Area — เพิ่มพนักงาน', width:520, confirmButtonColor:'#1f8a4e', confirmButtonText:'บันทึก', showCancelButton:true, cancelButtonText:'ยกเลิก',
        html:'<div style="text-align:left;font-size:14px">'+
          '<div style="background:#eafaf1;border:1px solid #bfe6cd;border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px">เงื่อนไข: <b>'+esc(c.name)+'</b>'+(c.code?(' · '+esc(c.code)):'')+'</div>'+
          '<label style="font-weight:700;display:block;margin:2px 0 4px">สังกัดสาขา *</label><select id="seBr" class="swal2-select" style="width:100%;margin:0 0 12px">'+brOpts+'</select>'+
          '<label style="font-weight:700;display:block;margin:2px 0 4px">ชื่อ-นามสกุลพนักงาน *</label><input id="seName" class="swal2-input" style="width:100%;margin:0 0 12px" placeholder="เช่น สมชาย ใจดี">'+
          '<label style="font-weight:700;display:block;margin:2px 0 4px">รหัสพนักงาน *</label><input id="seCode" class="swal2-input" style="width:100%;margin:0" placeholder="เช่น 50421">'+
        '</div>',
        preConfirm:function(){ var brId=document.getElementById('seBr').value||''; var nm=(document.getElementById('seName').value||'').trim(); var cd=(document.getElementById('seCode').value||'').trim();
          if(!brId){ Swal.showValidationMessage('เลือกสาขา'); return false; } if(!nm){ Swal.showValidationMessage('กรอกชื่อพนักงาน'); return false; } if(!cd){ Swal.showValidationMessage('กรอกรหัสพนักงาน'); return false; }
          return {brId:brId,nm:nm,cd:cd}; }
      }).then(function(res){ if(!res.isConfirmed) return; var v=res.value;
        var b=companyBranches(ACTIVE_CO).find(function(x){ return String(x.id)===v.brId; })||{};
        var all=loadA(EMP_KEY);
        if(all.find(function(r){ return r.empCode===v.cd&&r.conditionId===condId&&r.status!=='REMOVED'; })){ Swal.fire('มีคำขอนี้แล้ว','รหัสพนักงาน '+esc(v.cd)+' ขอสิทธิ์เงื่อนไขนี้ไว้แล้ว','info'); return; }
        all.unshift({ id:'sd'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), company:ACTIVE_CO, conditionId:condId, typeName:c.name, typeCode:c.code||'', typePromotion:c.typePromotion,
          empName:v.nm, empCode:v.cd, branchId:String(b.id||v.brId), branchName:b.nameTH||b.name||String(b.id||v.brId), status:'PENDING', createdAt:new Date().toISOString() });
        saveA(EMP_KEY, all);
        Swal.fire({icon:'success', title:'เพิ่มพนักงานแล้ว', html:'<b>'+esc(v.nm)+'</b> ('+esc(v.cd)+')', timer:1700, showConfirmButton:false});
        window.sdRenderConditions(); window.sdRenderEmp();
      });
    };

    window.sdEmpSetStatus=function(id){ var all=loadA(EMP_KEY); var r=all.find(function(x){return x.id===id;}); if(!r) return; r.status=(r.status==='APPROVED')?'PENDING':'APPROVED'; saveA(EMP_KEY,all); window.sdRenderEmp(); };
    window.sdEmpDelete=function(id){ Swal.fire({icon:'warning',title:'ลบคำขอพนักงานนี้?',showCancelButton:true,confirmButtonColor:'#c0392b',confirmButtonText:'ลบ',cancelButtonText:'ยกเลิก'}).then(function(r){ if(!r.isConfirmed) return; saveA(EMP_KEY, loadA(EMP_KEY).filter(function(x){return x.id!==id;})); window.sdRenderConditions(); window.sdRenderEmp(); }); };
    window.sdRenderEmp=function(){
      var body=document.getElementById('sdEmpBody'); if(!body) return;
      if(!ACTIVE_CO){ body.innerHTML='<tr><td colspan="7" class="empty">เลือกบริษัท FRC ด้านบนก่อน</td></tr>'; document.getElementById('sdEmpCount').textContent=''; return; }
      var q=(document.getElementById('sdSearch').value||'').trim().toLowerCase();
      var rows=loadA(EMP_KEY).filter(function(r){ return r.company===ACTIVE_CO; });
      if(q) rows=rows.filter(function(r){ return (r.empName+' '+r.empCode+' '+r.branchName+' '+r.branchId+' '+r.typeName).toLowerCase().indexOf(q)>-1; });
      document.getElementById('sdEmpCount').textContent='· '+rows.length+' คน';
      if(!rows.length){ body.innerHTML='<tr><td colspan="7" class="empty"><i class="fas fa-users fa-lg" style="opacity:.4;display:block;margin-bottom:8px"></i>ยังไม่มีคำขอพนักงาน</td></tr>'; return; }
      body.innerHTML=rows.map(function(r){ var stCls=r.status==='APPROVED'?'appr':'pend'; var stTxt=r.status==='APPROVED'?'<i class="fas fa-circle-check"></i> อนุมัติแล้ว':'<i class="fas fa-clock"></i> รออนุมัติ';
        return '<tr><td>'+fmtDate(r.createdAt)+'</td><td><b>'+esc(r.empName)+'</b></td><td class="mono">'+esc(r.empCode)+'</td>'+
          '<td>'+esc(r.branchName)+'<div style="font-size:.7rem;color:#9aa5b1">'+esc(r.branchId)+'</div></td>'+
          '<td>'+esc(r.typeName)+(r.typeCode?(' <span class="mono">'+esc(r.typeCode)+'</span>'):'')+'</td>'+
          '<td><span class="st '+stCls+'" style="cursor:pointer" onclick="window.sdEmpSetStatus(\''+r.id+'\')">'+stTxt+'</span></td>'+
          '<td><button class="xbtn" title="ลบ" onclick="window.sdEmpDelete(\''+r.id+'\')"><i class="fas fa-trash-alt"></i></button></td></tr>';
      }).join('');
    };

    window.sdExport=function(){ if(!ACTIVE_CO){ Swal.fire('เลือกบริษัทก่อน','','info'); return; }
      var rows=loadA(EMP_KEY).filter(function(r){ return r.company===ACTIVE_CO; });
      if(!rows.length){ Swal.fire('ไม่มีข้อมูล','ยังไม่มีคำขอพนักงานให้ export','info'); return; }
      var head=['วันที่','ชื่อพนักงาน','รหัสพนักงาน','รหัสสาขา','ชื่อสาขา','บริษัท','เงื่อนไข','Type Code','Type Promotion','สถานะ'];
      var lines=[head.join(',')];
      rows.forEach(function(r){ lines.push([fmtDate(r.createdAt),r.empName,r.empCode,r.branchId,r.branchName,r.company,r.typeName,r.typeCode,r.typePromotion,(r.status==='APPROVED'?'อนุมัติแล้ว':'รออนุมัติ')].map(function(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }).join(',')); });
      var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='staff-discount-'+ACTIVE_CO+'.csv'; a.click();
    };

    // ปิด dropdown เมื่อคลิกที่อื่น
    if(!window.__sdDocClick){ window.__sdDocClick=true; document.addEventListener('mousedown', function(e){ var sel=document.querySelector('.sd-scope .cbsel'); if(sel && !sel.contains(e.target)) window.sdCoClose&&window.sdCoClose(); }); }

    window.initStaffDiscountBD=function(){
      var list=frcCompanies();
      var last=''; try{ last=localStorage.getItem(CO_KEY)||''; }catch(e){}
      if(last && list.find(function(x){return x.company===last;})){ var hit=list.find(function(x){return x.company===last;}); document.getElementById('sdCoInp').value=last; setCo(last); document.getElementById('sdCoMeta').innerHTML='<i class="fas fa-store"></i> '+hit.count+' สาขา <span class="cbadge">FRC</span>'; }
      window.sdRenderConditions();
    };
    if(document.getElementById('sdCondWrap') && !window.__sdbdInit){ window.__sdbdInit=true; try{ window.initStaffDiscountBD(); }catch(e){} }
  })();
</script>
