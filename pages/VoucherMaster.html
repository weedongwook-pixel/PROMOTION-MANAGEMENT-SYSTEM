<div style="position:absolute;inset:0;display:flex;flex-direction:column;background:#eef1f4;font-family:'Kanit',sans-serif;">
  <div id="vmTabBar" style="display:flex;gap:4px;background:#fff;border-bottom:1px solid #e1e5ea;padding:8px 14px 0;flex:none;">
    <button id="vmTab_v" class="vmtab" onclick="vmShow('v')" style="border:0;background:transparent;font-family:inherit;font-weight:700;font-size:.92rem;color:#1a1d20;padding:10px 18px 12px;cursor:pointer;border-bottom:3px solid #2e934a;display:inline-flex;align-items:center;gap:8px;">
      <i class="fas fa-gift" style="color:#2e934a;"></i> Voucher
    </button>
    <button id="vmTab_h" class="vmtab" onclick="vmShow('h')" style="border:0;background:transparent;font-family:inherit;font-weight:700;font-size:.92rem;color:#8a9099;padding:10px 18px 12px;cursor:pointer;border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:8px;">
      <i class="fas fa-clock-rotate-left"></i> Voucher Comp (เพิ่มรอบปี)
    </button>
    <button id="vmAddYr" onclick="vmAddYear()" style="margin-left:auto;display:none;border:0;background:#2e934a;color:#fff;border-radius:8px;padding:8px 15px;font-family:inherit;font-weight:700;font-size:.85rem;cursor:pointer;align-self:center;margin-bottom:6px"><i class="fas fa-plus"></i> เพิ่มโค้ดประจำปี</button>
  </div>
  <div style="flex:1;position:relative;min-height:0;">
    <iframe id="vmF_v" src="Voucher Master.html" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#eef1f4;"></iframe>
    <iframe id="vmF_h" data-src="Comp Code 2026.html?v=20260721a" src="about:blank" style="position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#eef1f4;"></iframe>
  </div>
</div>
<script>
window.vmShow = function vmShow(which){
  var fv=document.getElementById('vmF_v'), fh=document.getElementById('vmF_h');
  var tv=document.getElementById('vmTab_v'), th=document.getElementById('vmTab_h');
  if(!fv||!fh) return;
  var hist = which==='h';
  // lazy-load History iframe (โค้ด comp เยอะ — โหลดเมื่อเปิดครั้งแรก)
  if(hist && fh.getAttribute('src')==='about:blank'){ fh.src=fh.getAttribute('data-src'); }
  fv.style.display = hist ? 'none' : 'block';
  fh.style.display = hist ? 'block' : 'none';
  tv.style.color = hist ? '#8a9099' : '#1a1d20';
  tv.style.borderBottomColor = hist ? 'transparent' : '#2e934a';
  th.style.color = hist ? '#1a1d20' : '#8a9099';
  th.style.borderBottomColor = hist ? '#2e934a' : 'transparent';
  var ab=document.getElementById('vmAddYr'); if(ab) ab.style.display=hist?'inline-flex':'none';
  try{ localStorage.setItem('pc_voucher_tab', which); }catch(e){}
}
window.vmAddYear = function(){ try{ var f=document.getElementById('vmF_h'); if(f&&f.contentWindow&&f.contentWindow.openAddYear) f.contentWindow.openAddYear(); }catch(e){} };
window.initVoucherMaster = function(){
  var pref='v';
  try{ pref = localStorage.getItem('pc_voucher_tab')||'v'; }catch(e){}
  vmShow(pref==='h' ? 'h' : 'v');
};
</script>
