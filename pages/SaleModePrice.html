<style>
  .smp-scope { background:#eef1f4; min-height:100vh; font-family:'Kanit','Montserrat',sans-serif; }
  .smp-scope .smp-head { background:var(--pc-dark,#1a1d20); border-left:10px solid #2e934a; }
  .smp-scope .smp-bar { background:#fff; border:1px solid #e3e7ec; border-radius:12px; }
  .smp-scope .smp-tbl { width:100%; border-collapse:collapse; font-size:.82rem; table-layout:fixed; }
  .smp-scope .smp-tbl th { background:var(--pc-dark,#1a1d20); color:#cfd6de; padding:9px 10px; font-size:.68rem; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; position:sticky; top:0; z-index:2; }
  .smp-scope .smp-tbl th.s-fix { position:sticky; left:0; z-index:3; background:#111315; }
  .smp-scope .smp-tbl th.s-fix2 { position:sticky; left:90px; z-index:3; background:#111315; }
  .smp-scope .smp-tbl td { padding:7px 10px; border-bottom:1px solid #eef1f4; vertical-align:middle; white-space:nowrap; }
  .smp-scope .smp-tbl tr:hover td { background:#f7f9fb; }
  .smp-scope .smp-tbl td.s-fix { position:sticky; left:0; background:#fff; z-index:1; border-right:1px solid #e3e7ec; }
  .smp-scope .smp-tbl tr:hover td.s-fix { background:#f7f9fb; }
  .smp-scope .smp-tbl td.s-fix2 { position:sticky; left:90px; background:#fff; z-index:1; border-right:2px solid #e3e7ec; max-width:220px; overflow:hidden; text-overflow:ellipsis; }
  .smp-scope .smp-tbl tr:hover td.s-fix2 { background:#f7f9fb; }
  .smp-scope .price-cell { font-family:'JetBrains Mono',monospace; font-size:.8rem; font-weight:700; text-align:right; min-width:72px; }
  /* หัวตาราง (แถวชื่อคอลัมน์) จัดกึ่งกลาง — เนื้อตารางคงตำแหน่งเดิม */
  .smp-scope .smp-tbl thead tr:first-child th { text-align:center !important; vertical-align:middle; }
  .smp-scope .price-cell.empty { background:rgba(255,190,0,.13); color:#9a6700; }
  .smp-scope .price-cell.zero  { background:rgba(255,90,90,.09); color:#c0392b; }
  .smp-scope .price-cell.ok    { color:#1a1d20; }
  .smp-scope .price-cell.low   { background:rgba(255,90,90,.06); color:#9b3a1e; }
  .smp-scope .ctoggle { display:inline-flex; align-items:center; gap:5px; padding:4px 11px; border-radius:999px; font-size:.74rem; font-weight:700; cursor:pointer; border:1.5px solid #d6dbe0; background:#fff; color:#444; transition:all .12s; user-select:none; }
  .smp-scope .ctoggle.on { background:var(--pc-dark,#1a1d20); color:#ffffff; border-color:#1a1d20; }
  .smp-scope .smp-empty { text-align:center; padding:60px 20px; color:#aaa; }
  .smp-scope .mono { font-family:'JetBrains Mono',monospace; }
  .smp-scope .cat-chip { display:inline-block; font-size:.65rem; padding:1px 7px; border-radius:999px; background:#eef1f4; color:#555; font-weight:600; max-width:120px; overflow:hidden; text-overflow:ellipsis; }
  .smp-scope .smp-tbl tr.smp-filt th { background:#26292c; padding:4px 6px; top:31px; z-index:2; }
  .smp-scope .smp-tbl tr.smp-filt th.s-fix { left:0; z-index:4; background:#1b1d1f; }
  .smp-scope .smp-tbl tr.smp-filt th.s-fix2 { left:90px; z-index:4; background:#1b1d1f; }
  .smp-scope .smp-fin { width:100%; box-sizing:border-box; border:1px solid #3a3f44; border-radius:6px; padding:3px 6px; font-size:.7rem; background:#fff; color:#222; font-family:inherit; font-weight:500; }
  .smp-scope .smp-fin:focus { outline:none; border-color:#ffffff; }
  .smp-scope .smp-fin::placeholder { color:#9aa1aa; font-weight:400; }
</style>

<div class="p-4 smp-scope">

  <!-- header -->
  <div class="d-flex justify-content-between align-items-center mb-3 p-4 rounded-3 shadow smp-head">
    <div>
      <h3 class="fw-bold m-0 text-white" style="text-transform:uppercase;"><i class="fas fa-tags me-2" style="color:#ffffff;"></i>Sale Mode &amp; Price</h3>
      <p class="small m-0" style="color:rgba(255,255,255,.7);">ราคาสินค้าแยกรายช่องทางขาย — ดูอย่างเดียว · แก้ไขที่ Product Data</p>
    </div>
    <div id="smpStat" class="text-end text-white-50 small"></div>
  </div>

  <!-- filter bar -->
  <div class="smp-bar p-3 mb-3">
    <div class="d-flex flex-wrap gap-3 align-items-center">

      <!-- search -->
      <div class="input-group input-group-sm" style="max-width:260px;">
        <span class="input-group-text bg-white border-end-0"><i class="fas fa-search text-muted"></i></span>
        <input id="smpSearch" type="text" class="form-control border-start-0" placeholder="ค้นหาชื่อ / รหัส…" oninput="smpRender()">
      </div>

      <!-- category -->
      <select id="smpCat" class="form-select form-select-sm" style="max-width:200px;" onchange="smpRender()">
        <option value="">ทุกหมวด</option>
      </select>

      <!-- brand -->
      <select id="smpBrand" class="form-select form-select-sm" style="max-width:160px;" onchange="smpRender()">
        <option value="">ทุกแบรนด์</option>
      </select>

      <!-- status filter -->
      <select id="smpStatus" class="form-select form-select-sm" style="max-width:180px;" onchange="smpRender()">
        <option value="">ทุกสถานะ</option>
        <option value="active">แสดงอยู่ (Active)</option>
        <option value="inactive">ซ่อน (Inactive)</option>
      </select>

      <!-- price filter -->
      <select id="smpPriceFilter" class="form-select form-select-sm" style="max-width:200px;" onchange="smpRender()">
        <option value="">ทุกรายการ</option>
        <option value="missing">มีช่องราคาว่าง</option>
        <option value="zero">มีราคา 0</option>
        <option value="complete">ครบทุกช่องทาง</option>
      </select>

      <div class="ms-auto small text-muted" id="smpCount"></div>
    </div>

    <!-- channel toggles -->
    <div class="d-flex flex-wrap gap-2 mt-3 pt-2" style="border-top:1px dashed #e3e7ec;">
      <span class="small text-muted fw-bold me-1" style="line-height:2;">แสดงช่องทาง:</span>
      <span id="smpChanToggles"></span>
    </div>
  </div>

  <!-- table -->
  <div class="bg-white rounded-3 shadow-sm" style="overflow:auto; max-height:calc(100vh - 340px);">
    <table class="smp-tbl">
      <thead id="smpHead"></thead>
      <tbody id="smpBody"></tbody>
    </table>
    <div id="smpEmpty" class="smp-empty" style="display:none;">
      <i class="fas fa-box-open fa-2x mb-2 d-block"></i>ไม่พบข้อมูลสินค้าตามเงื่อนไขที่เลือก
    </div>
  </div>

</div>

<script>
window.initSaleModePrice = function () {
  var CHANS = [
    {k:'ta',   label:'Take Away',  icon:'fa-store',          col:'priceTA',        pkey:'Take Away'},
    {k:'grab', label:'Grab',       icon:'fa-motorcycle',     col:'priceGrab',      pkey:'Grab'},
    {k:'line', label:'LINE MAN',   icon:'fa-hashtag',        col:'priceLineman',   pkey:'LINE MAN'},
    {k:'panda',label:'foodpanda',  icon:'fa-drumstick-bite', col:'pricePanda',     pkey:'foodpanda'},
    {k:'shopee',label:'Shopee',    icon:'fa-shopping-bag',   col:'priceShopee',    pkey:'ShopeeFood'},
    {k:'robin',label:'Robinhood',  icon:'fa-leaf',           col:'priceRobin',     pkey:'Robinhood'},
    {k:'gokoo',label:'Gokoo',      icon:'fa-bolt',           col:'priceGokoo',     pkey:'Gokoo'},
  ];

  var ITEMS = [], FLAGS = {}, visChans, BRANDS_M = [];
  var colF = {};
  window.smpColF = function(fk,val){ colF[fk]=val; smpRender(); };
  var FK = 'pc_product_flags', BRANDK = 'pc_brand_master', EDITK = 'pc_product_edits';

  function ls(k,d){ try{return JSON.parse(localStorage.getItem(k))||d;}catch(e){return d;} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
  /* ราคารายช่องทาง — อ่านจาก prices{} (ข้อมูลจริง) · missing = N/A · fallback flat field / priceDLV */
  function cval(it,c){ var pr=it.prices; if(pr&&typeof pr==='object'&&Object.keys(pr).length){ var v=pr[c.pkey]; return (v!=null&&v!=='')?v:''; } var f=it[c.col]; if(f!=null&&f!=='') return f; if(c.k!=='ta'){ var dl=it.priceDLV; if(dl!=null&&dl!=='') return dl; } return ''; }
  function fmt(v){ return (v===''||v==null)?'—':Number(v).toLocaleString('th-TH',{minimumFractionDigits:0,maximumFractionDigits:2}); }
  function pclass(v,hasVal){
    if(!hasVal||v===''||v==null) return 'empty';
    var n=parseFloat(v); if(isNaN(n)) return 'empty';
    if(n===0) return 'zero';
    return 'ok';
  }

  function flagOf(c){ var f=FLAGS[c]||{}; return { active: f.active===undefined?1:f.active }; }
  function applyEdits(items){
    var e=ls(EDITK,{}); items.forEach(function(it){ var o=e[it.itemCode]; if(o){ Object.keys(o).forEach(function(k){ if(o[k]!==''&&o[k]!=null) it[k]=o[k]; }); } });
    return items;
  }

  // init visible channels from localStorage or default all-on
  var VISK = 'pc_smp_vis';
  visChans = ls(VISK, CHANS.map(function(c){return c.k;}));
  if(!Array.isArray(visChans)||!visChans.length) visChans = CHANS.map(function(c){return c.k;});

  function saveVis(){ try{localStorage.setItem(VISK,JSON.stringify(visChans));}catch(e){} }

  function renderToggles(){
    var el = document.getElementById('smpChanToggles'); if(!el) return;
    el.innerHTML = CHANS.map(function(c){
      var on = visChans.indexOf(c.k)>=0;
      return '<span class="ctoggle'+(on?' on':'')+'" onclick="smpToggleChan(\''+c.k+'\')"><i class="fas '+c.icon+'"></i>'+esc(c.label)+'</span>';
    }).join('');
  }

  function buildSelects(){
    var cats = [], brands = [];
    ITEMS.forEach(function(it){
      if(it.category && cats.indexOf(it.category)<0) cats.push(it.category);
    });
    BRANDS_M.forEach(function(b){ if(b.active!==0) brands.push(b.name); });
    var cs=document.getElementById('smpCat');
    var prev=cs.value;
    while(cs.options.length>1) cs.remove(1);
    cats.sort().forEach(function(c){ var o=document.createElement('option'); o.value=c; o.text=c; cs.add(o); });
    cs.value=prev;

    var bs=document.getElementById('smpBrand');
    var prevB=bs.value;
    while(bs.options.length>1) bs.remove(1);
    brands.sort().forEach(function(b){ var o=document.createElement('option'); o.value=b; o.text=b; bs.add(o); });
    bs.value=prevB;
  }

  window.smpToggleChan = function(k){
    var i=visChans.indexOf(k);
    if(i>=0) visChans.splice(i,1); else visChans.push(k);
    saveVis(); renderToggles(); smpRender();
  };

  window.smpRender = function(){
    var head=document.getElementById('smpHead'), body=document.getElementById('smpBody');
    var empty=document.getElementById('smpEmpty'), cnt=document.getElementById('smpCount');
    if(!head||!body) return;

    var q=(document.getElementById('smpSearch').value||'').toLowerCase().trim();
    var cat=(document.getElementById('smpCat').value||'');
    var brand=(document.getElementById('smpBrand').value||'');
    var status=(document.getElementById('smpStatus').value||'');
    var pf=(document.getElementById('smpPriceFilter').value||'');
    var activeCh = CHANS.filter(function(c){return visChans.indexOf(c.k)>=0;});

    var cfCode=(colF.code||'').toLowerCase(), cfName=(colF.name||'').toLowerCase(), cfCat=(colF.cat||'').toLowerCase();

    var rows = ITEMS.filter(function(it){
      if(q && String(it.itemCode||'').toLowerCase().indexOf(q)<0 && String(it.itemNameEN||'').toLowerCase().indexOf(q)<0 && String(it.itemNameTH||'').toLowerCase().indexOf(q)<0) return false;
      if(cat && it.category!==cat) return false;
      if(cfCode && String(it.itemCode||'').toLowerCase().indexOf(cfCode)<0) return false;
      if(cfName && (String(it.itemNameEN||'')+' '+String(it.itemNameTH||'')).toLowerCase().indexOf(cfName)<0) return false;
      if(cfCat && String(it.category||'').toLowerCase()!==cfCat) return false;
      for(var ci=0; ci<activeCh.length; ci++){
        var cf=(colF['p_'+activeCh[ci].k]||'').toLowerCase();
        if(cf){ var pv=String(cval(it,activeCh[ci])==null?'':cval(it,activeCh[ci])).toLowerCase(); if(pv.indexOf(cf)<0) return false; }
      }
      if(brand){
        var fl=FLAGS[it.itemCode]||{}, bs=Array.isArray(fl.brands)?fl.brands:(fl.brand?[fl.brand]:[]);
        if(bs.length && bs.indexOf(brand)<0) return false;
      }
      if(status==='active' && flagOf(it.itemCode).active===0) return false;
      if(status==='inactive' && flagOf(it.itemCode).active!==0) return false;
      if(pf){
        var missing=false, hasZero=false, allFilled=true;
        CHANS.forEach(function(c){
          var v=cval(it,c); var n=parseFloat(v);
          if(v===''||v==null||isNaN(n)){missing=true;allFilled=false;}
          if(!isNaN(n)&&n===0){hasZero=true;allFilled=false;}
        });
        if(pf==='missing'&&!missing) return false;
        if(pf==='zero'&&!hasZero) return false;
        if(pf==='complete'&&!allFilled) return false;
      }
      return true;
    });

    if(cnt) cnt.textContent = rows.length + ' รายการ';
    document.getElementById('smpStat').textContent = ITEMS.length + ' สินค้าทั้งหมด';

    // cap rendered rows — sticky cells make thousands of rows freeze the page; filter to narrow
    var TOTAL=rows.length, CAP=300, capped=(TOTAL>CAP)?rows.slice(0,CAP):rows;
    if(cnt) cnt.textContent = (TOTAL>CAP ? ('แสดง '+CAP+' / '+TOTAL+' รายการ — ใช้ตัวกรองเพื่อแคบผล') : (TOTAL+' รายการ'));

    // header — preserve focus across rebuild
    var af=document.activeElement, fk=(af&&af.classList&&af.classList.contains('smp-fin'))?af.getAttribute('data-fk'):null;
    var caret=fk?af.selectionStart:null;
    function finput(key,ph){ return '<input class="smp-fin" data-fk="'+key+'" value="'+esc(colF[key]||'')+'" placeholder="'+esc(ph||'')+'" oninput="smpColF(this.getAttribute(\'data-fk\'),this.value)">'; }
    function fcatSelect(){ var cats={}; ITEMS.forEach(function(it){ if(it.category && !(it.category in cats)) cats[it.category]=it.cateCode||''; });
      var keys=Object.keys(cats).sort(function(a,b){ var na=parseInt(cats[a],10),nb=parseInt(cats[b],10); if(!isNaN(na)&&!isNaN(nb)&&na!==nb)return na-nb; if(isNaN(na)&&!isNaN(nb))return 1; if(!isNaN(na)&&isNaN(nb))return -1; return String(a).localeCompare(String(b)); });
      var cur=colF.cat||'';
      return '<select class="smp-fin" data-fk="cat" onchange="smpColF(\'cat\',this.value)"><option value="">ทั้งหมด</option>'+keys.map(function(c){ return '<option value="'+esc(c)+'"'+(c===cur?' selected':'')+'>'+esc((cats[c]?cats[c]+' - ':'')+c)+'</option>'; }).join('')+'</select>'; }
    head.innerHTML = '<tr>'+
      '<th class="s-fix" style="width:90px">รหัส</th>'+
      '<th class="s-fix2" style="width:220px;min-width:220px;">ชื่อสินค้า</th>'+
      '<th style="width:100px;">หมวด</th>'+
      activeCh.map(function(c){
        return '<th class="price-cell" style="width:90px;"><i class="fas '+c.icon+' me-1"></i>'+esc(c.label)+'</th>';
      }).join('')+
      '</tr>'+
      '<tr class="smp-filt">'+
      '<th class="s-fix">'+finput('code','รหัส')+'</th>'+
      '<th class="s-fix2">'+finput('name','ชื่อสินค้า')+'</th>'+
      '<th>'+fcatSelect()+'</th>'+
      activeCh.map(function(c){ return '<th>'+finput('p_'+c.k,'ราคา')+'</th>'; }).join('')+
      '</tr>';
    if(fk){ var ne=head.querySelector('.smp-fin[data-fk="'+fk+'"]'); if(ne){ ne.focus(); try{ ne.setSelectionRange(caret,caret); }catch(e){} } }

    if(!rows.length){
      body.innerHTML=''; empty.style.display='block'; return;
    }
    empty.style.display='none';

    body.innerHTML = capped.map(function(it){
      var isActive = flagOf(it.itemCode).active!==0;
      return '<tr style="'+(isActive?'':'opacity:.45;')+'">'+
        '<td class="s-fix mono" style="font-size:.75rem;">'+esc(it.itemCode||'—')+'</td>'+
        '<td class="s-fix2" title="'+esc(it.itemNameEN||'')+(it.itemNameTH?' · '+esc(it.itemNameTH):'')+'">'+
          '<div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">'+esc(it.itemNameEN||'—')+'</div>'+
          (it.itemNameTH?'<div style="font-size:.7rem;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">'+esc(it.itemNameTH)+'</div>':'')+
        '</td>'+
        '<td><span class="cat-chip">'+esc(it.category||'—')+'</span></td>'+
        activeCh.map(function(c){
          var v=cval(it,c); var cl=pclass(v,true);
          return '<td class="price-cell '+cl+'">'+(cl==='empty'?'<span style="opacity:.4;">—</span>':fmt(v))+'</td>';
        }).join('')+
      '</tr>';
    }).join('');
  };

  // load
  FLAGS = ls(FK,{});
  BRANDS_M = ls(BRANDK,[{name:'Potato Corner',active:1},{name:'Shakes & Fries',active:1},{name:'Catering',active:1}]);
  renderToggles();

  google.script.run
    .withSuccessHandler(function(d){
      ITEMS = applyEdits((d&&d.items)||[]);
      buildSelects(); smpRender();
    })
    .withFailureHandler(function(){ smpRender(); })
    .getMasterDataExtended();
};
window.disposeSaleModePrice = function(){};
</script>
