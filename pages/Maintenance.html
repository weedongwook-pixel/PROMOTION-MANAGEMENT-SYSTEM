<!-- Maintenance / Audit request — runs in shell. Logic: js/maint-form.js. Entry: initMaintenance -->
<style>
  #maint-page { --pc-green:#00843d; --pc-yellow:#2e934a; --pc-black:#000; font-family:'Kanit',sans-serif; padding:18px;
    background:#f8f9fa; background-image:linear-gradient(rgba(0,132,61,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,132,61,0.06) 1px,transparent 1px); background-size:20px 20px; }
  #maint-page .form-card { background:#fff; border:4px solid var(--pc-black); box-shadow:10px 10px 0 rgba(0,0,0,0.1); padding:24px; max-width:740px; margin:0 auto; }
  #maint-page .main-title { font-family:'Montserrat',sans-serif; font-size:1.7rem; font-weight:900; color:var(--pc-yellow); -webkit-text-stroke:1.2px var(--pc-black); letter-spacing:2px; text-transform:uppercase; margin-bottom:4px; text-align:center; }
  #maint-page .header-line { border-bottom:4px solid var(--pc-black); width:100%; margin:10px 0; }
  #maint-page .sub-title { color:var(--pc-green); font-weight:800; font-size:0.72rem; letter-spacing:1px; text-transform:uppercase; text-align:center; }
  #maint-page .section-tag { background:var(--pc-black); color:var(--pc-yellow); padding:6px 12px; font-weight:800; font-size:0.74rem; display:inline-block; margin-bottom:12px; text-transform:uppercase; }
  #maint-page .form-label { font-size:0.82rem; font-weight:800; color:var(--pc-black); margin-bottom:4px; }
  #maint-page .label-en { font-size:0.66rem; color:#666; font-weight:400; display:block; text-transform:uppercase; }
  #maint-page .form-control { border:2px solid var(--pc-black); border-radius:0; font-family:'JetBrains Mono',monospace; font-size:0.88rem; border-left:5px solid var(--pc-green); }
  #maint-page .form-control:focus { box-shadow:none; border-color:var(--pc-green); background:#f9fffb; }
  #maint-page .item-box { background:#fdfdfd; padding:14px; border:2px solid var(--pc-black); margin-bottom:14px; }
  #maint-page .btn-tactical { font-family:'Kanit',sans-serif; font-weight:800; border:3px solid var(--pc-black); border-radius:0; }
  #maint-page .btn-add { background:var(--pc-black); color:#fff; padding:6px 12px; font-size:0.74rem; }
  #maint-page .btn-submit { background:var(--pc-yellow); color:var(--pc-black); width:100%; padding:14px; font-size:1.15rem; margin-top:18px; border:4px solid var(--pc-black); font-weight:900; }
  #maint-page .nav-tabs .nav-link { border:3px solid var(--pc-black) !important; border-radius:0 !important; margin-right:5px; color:var(--pc-black); font-weight:800; background:#eee; font-size:0.78rem; }
  #maint-page .nav-tabs .nav-link.active { background:var(--pc-green) !important; color:#fff !important; }
  #maint-page #success-page { display:none; text-align:center; padding:40px 10px; }
  #maint-page .ticket-badge { background:var(--pc-black); color:var(--pc-yellow); font-family:'JetBrains Mono',monospace; font-size:1.6rem; padding:10px 20px; display:inline-block; margin:18px 0; box-shadow:5px 5px 0 var(--pc-green); border-radius:4px; }
  @media(max-width:600px){
    #maint-page{ padding:8px; }
    #maint-page .form-card{ padding:16px; box-shadow:5px 5px 0 rgba(0,0,0,.1); }
    #maint-page .main-title{ font-size:1.3rem; }
  }
</style>

<div id="maint-page">
  <div class="form-card">
    <div id="form-content">
      <div class="main-title">MAINTENANCE_REQUEST</div>
      <div class="header-line"></div>
      <div class="sub-title">Potato Corner IT Asset Management</div>

      <ul class="nav nav-tabs border-0 mt-3" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-repair" type="button">แจ้งซ่อม | เปลี่ยนอุปกรณ์</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-audit" type="button">แจ้งเข้าหน้างาน (Audit)</button></li>
      </ul>

      <form id="maForm" onsubmit="return handleMaintSubmit(event)">
        <div class="row mb-3 mt-3">
          <div class="col-6"><label class="form-label">เลขที่งาน <span class="label-en">Ticket No.</span></label><input type="text" class="form-control" name="ticketNo" placeholder="CMPOS-XXXX" required></div>
          <div class="col-6"><label class="form-label">สาขา <span class="label-en">Site Location</span></label><input class="form-control" name="branchName" list="branchList" placeholder="เลือกสาขา" required><datalist id="branchList"></datalist></div>
        </div>

        <div class="tab-content">
          <div class="tab-pane fade show active" id="tab-repair">
            <div class="section-tag">ASSET_SPEC (ข้อมูลอุปกรณ์แจ้งซ่อม)</div>
            <div id="repairItems">
              <div class="item-box"><div class="row g-2">
                <div class="col-4"><label class="form-label">ประเภท <span class="label-en">Type</span></label><input class="form-control" name="type[]" list="typeList" required></div>
                <div class="col-4"><label class="form-label">รุ่น <span class="label-en">Model</span></label><input class="form-control" name="model[]" list="modelList" required></div>
                <div class="col-4"><label class="form-label">สเปค <span class="label-en">Spec</span></label><input class="form-control" name="spec[]" list="specList"></div>
                <div class="col-12 mt-2"><label class="form-label text-danger">S/N ที่ชำรุด <span class="label-en">Defective S/N</span></label><input type="text" class="form-control" name="oldSn[]" required></div>
              </div></div>
            </div>
            <button type="button" class="btn btn-tactical btn-add mb-3" onclick="addItem('repairItems')">+ เพิ่มอุปกรณ์ (Add)</button>
            <div class="mt-2 mb-3"><label class="form-label">อาการ | ปัญหาที่พบ <span class="label-en">Issue Details</span></label><textarea class="form-control" name="issueDetails" rows="2" placeholder="ระบุอาการ..." required></textarea></div>
            <div class="row mb-2">
              <div class="col-6"><label class="form-label">รูปถ่ายหน้างาน <span class="label-en">Site Photos</span></label><input type="file" class="form-control form-control-sm" id="sitePhotos" multiple></div>
              <div class="col-6"><label class="form-label">ใบเสนอราคา <span class="label-en">Quotation</span></label><input type="file" class="form-control form-control-sm" id="quotationFile"></div>
            </div>
          </div>

          <div class="tab-pane fade" id="tab-audit">
            <div class="section-tag">STAFF_INFO (ข้อมูลเจ้าหน้าที่)</div>
            <div class="item-box"><div class="row g-2">
              <div class="col-md-6"><label class="form-label">ชื่อเจ้าหน้าที่ <span class="label-en">Staff Name</span></label><input type="text" class="form-control" name="staffName"></div>
              <div class="col-md-6"><label class="form-label">เบอร์ติดต่อ <span class="label-en">Contact</span></label><input type="text" class="form-control" name="staffContact"></div>
            </div></div>
            <div class="section-tag">AUDIT_ITEMS (รายการที่ตรวจเช็ค)</div>
            <div id="auditItems">
              <div class="item-box"><div class="row g-2">
                <div class="col-4"><label class="form-label">ประเภท</label><input class="form-control" name="audit_type[]" list="typeList"></div>
                <div class="col-4"><label class="form-label">รุ่น</label><input class="form-control" name="audit_model[]" list="modelList"></div>
                <div class="col-4"><label class="form-label">สเปค</label><input class="form-control" name="audit_spec[]" list="specList"></div>
                <div class="col-12 mt-2"><label class="form-label text-danger">หมายเลขซีเรียล <span class="label-en">Unit S/N</span></label><input type="text" class="form-control" name="audit_sn[]"></div>
              </div></div>
            </div>
            <button type="button" class="btn btn-tactical btn-add mb-3" onclick="addItem('auditItems')">+ เพิ่มรายการ Audit (Add)</button>
            <div class="mb-2"><label class="form-label">รายละเอียดการเข้าตรวจเช็ค <span class="label-en">On-site Action</span></label><textarea class="form-control" name="jobSummary" rows="3" placeholder="ระบุสิ่งที่ดำเนินการ..."></textarea></div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn btn-tactical btn-submit"><i class="fa-solid fa-paper-plane me-2"></i> ส่งข้อมูลแผนก IT (SUBMIT)</button>
      </form>
    </div>

    <datalist id="typeList"></datalist><datalist id="modelList"></datalist><datalist id="specList"></datalist>

    <div id="success-page">
      <div style="font-size:4.2rem;color:var(--pc-green);"><i class="fa-solid fa-circle-check"></i></div>
      <h1 style="font-weight:900;color:var(--pc-black);margin-top:12px;">SUCCESS!</h1>
      <p style="font-size:1.05rem;font-weight:600;">ได้รับข้อมูลของท่านเรียบร้อยแล้ว</p>
      <div class="ticket-badge" id="display-ticket">TICKET_ID</div>
      <div class="mt-3"><button class="btn btn-tactical btn-dark px-4 py-2" onclick="loadPage('Maintenance')"><i class="fa-solid fa-rotate-left me-2"></i> ทำรายการใหม่</button></div>
    </div>
  </div>
</div>

<script src="js/maint-form.js"></script>
