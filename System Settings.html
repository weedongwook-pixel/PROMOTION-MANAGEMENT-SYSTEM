<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ตั้งค่าระบบ — Potato Corner</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Kanit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --pc-black:#1a1d20; --pc-yellow:#2e934a; --pc-green:#2e934a; --bg:#eef1f4; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ font-family:'Kanit',sans-serif; background:var(--bg); color:var(--pc-black); margin:0; display:flex; flex-direction:column; height:100vh; overflow:hidden; }
  .mono{ font-family:'JetBrains Mono',monospace; }

  .topbar{ background:#2e934a; color:#fff; padding:14px 22px; display:flex; align-items:center; gap:14px; flex:none; }
  .topbar h1{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:1.15rem; margin:0; letter-spacing:.4px; text-transform:uppercase; }
  .topbar h1 i{ color:var(--pc-yellow); margin-right:9px; }
  .topbar .sub{ opacity:.6; font-size:.84rem; }

  .shell{ flex:1; display:flex; min-height:0; }
  .side{ width:268px; background:#fff; border-right:1px solid #e2e6ea; padding:16px 12px; flex:none; overflow:auto; }
  .side .grp{ font-size:.68rem; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:#9aa1aa; margin:12px 10px 7px; }
  .navi{ display:flex; align-items:center; gap:12px; padding:12px 13px; border-radius:12px; cursor:pointer; color:#3a4150; font-weight:600; font-size:.95rem; margin-bottom:3px; }
  .navi:hover{ background:#f3f5f8; }
  .navi.on{ background:#f3fbf6; color:var(--pc-green); }
  .navi .ic{ width:34px; height:34px; border-radius:9px; background:#f1f4f7; display:flex; align-items:center; justify-content:center; flex:none; font-size:.95rem; color:#6b7280; }
  .navi.on .ic{ background:var(--pc-green); color:#fff; }
  .navi .tx{ flex:1; }
  .navi .tx small{ display:block; font-weight:400; font-size:.74rem; color:#9aa1aa; margin-top:1px; }
  .navi.on .tx small{ color:#5fa982; }

  .content{ flex:1; min-width:0; position:relative; background:var(--bg); }
  .pane{ position:absolute; inset:0; display:none; }
  .pane.on{ display:block; }
  .pane iframe{ width:100%; height:100%; border:0; display:block; }
  .pane.scroll{ overflow:auto; }

  /* templates pane */
  .tpl-wrap{ max-width:1000px; margin:0 auto; padding:26px 24px 70px; }
  .tpl-head{ font-family:'Montserrat',sans-serif; font-weight:700; font-size:1.2rem; text-transform:uppercase; letter-spacing:.4px; }
  .tpl-head i{ color:var(--pc-green); margin-right:9px; }
  .tpl-sub{ color:#6b7280; font-size:.9rem; margin:4px 0 18px; }
  .legend{ background:#fff; border:1px solid #e7eaee; border-radius:13px; padding:13px 16px; margin-bottom:20px; }
  .legend .l-lbl{ font-size:.72rem; font-weight:700; letter-spacing:.5px; text-transform:uppercase; color:#8a9099; margin-bottom:9px; }
  .legend .toks{ display:flex; flex-wrap:wrap; gap:7px; }
  .tok{ font-family:'JetBrains Mono',monospace; font-size:.8rem; background:#fff5e0; color:#9a6700; border:1px solid #f3d99a; border-radius:6px; padding:2px 7px; }
  .tcard{ background:#fff; border:1px solid #e7eaee; border-radius:15px; box-shadow:0 1px 3px rgba(0,0,0,.05); margin-bottom:16px; overflow:hidden; }
  .tc-hd{ padding:14px 18px; border-bottom:1px solid #eef1f4; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .tc-nm{ font-weight:700; font-size:1.05rem; flex:1; }
  .tc-key{ font-family:'JetBrains Mono',monospace; font-size:.72rem; color:#aab0b8; }
  .badge-ch{ font-size:.74rem; font-weight:700; border-radius:7px; padding:3px 9px; display:inline-flex; align-items:center; gap:5px; }
  .badge-ch.mail{ background:#eaf4ee; color:#9a6700; } .badge-ch.chat{ background:#eef4ff; color:#2f5fb3; } .badge-ch.line{ background:#eafaef; color:#06934a; }
  .badge-ch.off{ background:#f1f4f7; color:#b6bcc4; }
  .tc-body{ padding:15px 18px; display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .tc-blk .b-lbl{ font-size:.72rem; font-weight:700; letter-spacing:.4px; text-transform:uppercase; color:#8a9099; margin-bottom:7px; display:flex; align-items:center; gap:6px; }
  .tc-blk .b-lbl.mail i{ color:#c9870a; } .tc-blk .b-lbl.chat i{ color:#2f5fb3; }
  .tc-subj{ font-weight:700; font-size:.92rem; margin-bottom:6px; }
  .tc-text{ background:#f6f8fa; border:1px solid #eef1f4; border-radius:10px; padding:11px 13px; font-size:.9rem; line-height:1.6; color:#3a4047; }
  .tc-to{ font-size:.78rem; color:#9aa1aa; margin-top:8px; }
  .tpl-in{ width:100%; border:1.5px solid #d8dde2; border-radius:9px; padding:9px 11px; font-family:inherit; font-size:.9rem; font-weight:600; margin-bottom:8px; }
  .tpl-in:focus,.tpl-ta:focus{ outline:none; border-color:var(--pc-green); }
  .tpl-ta{ width:100%; border:1.5px solid #d8dde2; border-radius:9px; padding:9px 11px; font-family:inherit; font-size:.88rem; line-height:1.5; resize:vertical; }
  .tpl-prev{ background:#f6f8fa; border:1px dashed #e2e6ea; border-radius:9px; padding:9px 11px; font-size:.84rem; line-height:1.55; color:#5a616b; margin-top:7px; }
  .tpl-savebar{ position:sticky; bottom:0; background:rgba(238,241,244,.94); backdrop-filter:blur(4px); padding:14px 0 4px; display:flex; justify-content:flex-end; gap:10px; margin-top:6px; }
  .btn-save-tpl{ background:var(--pc-green); color:#fff; border:0; border-radius:12px; padding:12px 24px; font-family:inherit; font-weight:700; cursor:pointer; }
  .btn-save-tpl:hover{ background:#00632f; }
  .btn-reset-tpl{ background:#fff; color:#6b7280; border:1.5px solid #d8dde2; border-radius:12px; padding:12px 18px; font-family:inherit; font-weight:600; cursor:pointer; }
  .btn-reset-tpl:hover{ border-color:#b6bcc4; }
  .legend .tok{ cursor:pointer; }
  @media(max-width:820px){ .tc-body{ grid-template-columns:1fr; } .side{ width:210px; } }
</style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

};
const TOKENS=['{branch}','{item}','{code}','{issues}','{detail}','{platforms}','{appPrice}','{correctPrice}','{campaign}','{promoType}','{type}','{proStatus}','{count}','{startDate}','{proExpire}','{skipped}','{reporter}','{date}','{start}','{end}','{oldEnd}','{newEnd}','{reason}'];
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function tok(s){ return esc(s).replace(/\n/g,'<br>').replace(/\{(\w+)\}/g,'<span class="tok">{$1}</span>'); }
function notifyCfg(){ try{ const s=JSON.parse(localStorage.getItem('pc_notify_settings')); if(s&&s.events) return s; }catch(e){} return null; }
const TPL_KEY='pc_notify_templates';
let TPLW={};
function tplOverrides(){ try{ return JSON.parse(localStorage.getItem(TPL_KEY))||{}; }catch(e){ return {}; } }
function tplEffective(k){ const ov=tplOverrides()[k]||{}; const base=TEMPLATES[k]||{subject:'',body:'',msg:''}; return { subject: ov.subject!=null?ov.subject:base.subject, body: ov.body!=null?ov.body:base.body, msg: ov.msg!=null?ov.msg:base.msg }; }
function tplEdit(k,f,val){ (TPLW[k]||(TPLW[k]={}))[f]=val; const prev=document.getElementById('prev_'+f+'_'+k); if(prev) prev.innerHTML=tok(val); }
function saveTpl(){ localStorage.setItem(TPL_KEY, JSON.stringify(TPLW)); Swal.fire({icon:'success',title:'บันทึกเทมเพลตแล้ว',html:'ข้อความแจ้งเตือนถูกบันทึก — ใช้กับการส่งจริงทุกช่องทาง',confirmButtonColor:'#2e934a',timer:1500,showConfirmButton:false}); }
function resetTpl(){ Swal.fire({icon:'warning',title:'คืนค่าเริ่มต้น?',text:'เทมเพลตทั้งหมดจะกลับเป็นข้อความมาตรฐาน',showCancelButton:true,confirmButtonColor:'#2e934a',confirmButtonText:'คืนค่า',cancelButtonText:'ยกเลิก'}).then(r=>{ if(r.isConfirmed){ localStorage.setItem(TPL_KEY,'{}'); renderTemplates(); } }); }

function renderSide(){
  const side=document.getElementById('side');
  side.innerHTML = GROUPS.map(g=>`<div class="grp">${g.name}</div>`+
    g.ids.map(id=>{ const t=TABS.find(x=>x.id===id); return `<div class="navi" data-id="${id}" onclick="go('${id}')"><span class="ic"><i class="fas ${t.ic}"></i></span><span class="tx">${t.label}<small>${t.sub}</small></span></div>`; }).join('')
  ).join('');
}
function buildPanes(){
  const c=document.getElementById('content');
  c.innerHTML = TABS.map(t=> t.src
    ? `<div class="pane" data-id="${t.id}"><iframe data-src="${t.src}" title="${t.label}"></iframe></div>`
    : `<div class="pane scroll" data-id="${t.id}"><div class="tpl-wrap" id="tplWrap"></div></div>`
  ).join('');
}
let loaded={};
function go(id){
  localStorage.setItem('pc_settings_tab', id);
  document.querySelectorAll('.navi').forEach(n=>n.classList.toggle('on', n.dataset.id===id));
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on', p.dataset.id===id));
  const pane=document.querySelector(`.pane[data-id="${id}"]`);
  const frame=pane.querySelector('iframe');
  if(frame && !loaded[id]){ frame.src=frame.dataset.src; loaded[id]=true; }
  if(id==='templates') renderTemplates();
}
function renderTemplates(){
  const cfg=notifyCfg();
  const order=['report_general','report_price_platform','proposal_submitted','proposal_approved','proposal_rejected','promo_cancelled','promo_extended','promo_reduced','promo_ending','npd_new','npd_approved','npd_rejected','it_settlement','it_settlement_done','coupon_issued'];
  const cfgE = cfg ? cfg.events : {};
  const events = {}; order.forEach(k=>{ events[k] = cfgE[k] || DEFAULT_EVENTS[k]; });
  const deptLabel=k=>{ if(cfg && cfg.events[k]){ const arr=cfg.events[k].depts||(cfg.events[k].dept?[cfg.events[k].dept]:[]); return arr.map(dk=>{ const d=cfg.depts&&cfg.depts[dk]; return d?d.label:dk; }).join(' / ')||'-'; } return DEFAULT_EVENTS[k]?DEFAULT_EVENTS[k].dept:''; };
  const cards=order.filter(k=>events[k]).map(k=>{
    const ev=events[k]; const ch=ev.channels||{email:true,chat:false,line:false};
    const T=tplEffective(k); TPLW[k]={subject:T.subject,body:T.body,msg:T.msg};
    const badge=(on,cls,ic,lb)=>`<span class="badge-ch ${on?cls:'off'}"><i class="${cls==='line'?'fab':'fas'} ${ic}"></i>${lb}${on?'':' (ปิด)'}</span>`;
    const chatShown = ch.chat||ch.line;
    return `<div class="tcard">
      <div class="tc-hd">
        <span class="tc-nm">${esc(ev.label)}</span>
        <span class="tc-key">${k}</span>
        ${badge(ch.email,'mail','fa-envelope','Email')}
        ${badge(ch.chat,'chat','fa-comments','Team Chat')}
        ${badge(ch.line,'line','fa-line','LINE')}
      </div>
      <div class="tc-body">
        <div class="tc-blk">
          <div class="b-lbl mail"><i class="fas fa-envelope"></i>เทมเพลตอีเมล</div>
          <input class="tpl-in" value="${esc(T.subject).replace(/"/g,'&quot;')}" oninput="tplEdit('${k}','subject',this.value)" placeholder="หัวข้ออีเมล">
          <textarea class="tpl-ta" rows="4" oninput="tplEdit('${k}','body',this.value)" placeholder="เนื้อหาอีเมล">${esc(T.body)}</textarea>
          <div class="tpl-prev" id="prev_body_${k}">${tok(T.body)}</div>
          <div class="tc-to">ถึง: ทีม ${esc(deptLabel(k))}</div>
        </div>
        <div class="tc-blk">
          <div class="b-lbl chat"><i class="fas fa-comments"></i>เทมเพลต Chat / LINE</div>
          <textarea class="tpl-ta" rows="4" oninput="tplEdit('${k}','msg',this.value)" placeholder="ข้อความแชท">${esc(T.msg)}</textarea>
          <div class="tpl-prev" id="prev_msg_${k}">${tok(T.msg)}</div>
          <div class="tc-to">${chatShown?('@mention ทีม '+esc(deptLabel(k))):'— ช่องแชท/LINE ปิดอยู่ —'}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('tplWrap').innerHTML = `
    <div class="tpl-head"><i class="fas fa-file-lines"></i>เทมเพลตแจ้งเตือนทุกระบบงาน</div>
    <div class="tpl-sub">แก้ข้อความได้เอง · <span class="mono">{…}</span> คือตัวแปรที่ระบบเติมค่าจริงตอนส่ง · ช่องทาง/แผนกตามที่ตั้งไว้ในหน้า “การแจ้งเตือน”</div>
    <div class="legend"><div class="l-lbl">ตัวแปรที่ใช้ได้ (คลิกเพื่อคัดลอก)</div><div class="toks">${TOKENS.map(t=>`<span class="tok" onclick="copyTok('${t}')" title="คลิกเพื่อคัดลอก">${t}</span>`).join('')}</div></div>
    ${cards}
    <div class="tpl-savebar"><button class="btn-reset-tpl" onclick="resetTpl()"><i class="fas fa-rotate-left me-1"></i>คืนค่าเริ่มต้น</button><button class="btn-save-tpl" onclick="saveTpl()"><i class="fas fa-check me-1"></i>บันทึกเทมเพลต</button></div>`;
}
function copyTok(t){ navigator.clipboard&&navigator.clipboard.writeText(t); }

renderSide(); buildPanes();
go(localStorage.getItem('pc_settings_tab')||'report');
</script>
</body>
</html>
