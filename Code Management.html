<script>
/* ===== Custom Promo Picker ===== */
window.__ppOpts = [];
var __ppActive = -1;
function ppShow(inp) {
  var val = (inp.value || '').toLowerCase();
  var drop = inp.parentNode.querySelector('.pp-drop');
  if (!drop) return;
  var opts = window.__ppOpts.filter(function(o){
    return !val || o.code.toLowerCase().includes(val) || o.name.toLowerCase().includes(val) || (o.codePro||'').toLowerCase().includes(val);
  });
  __ppActive = -1;
  var MAX = 80;
  drop.innerHTML = opts.length === 0
    ? '<div class="pp-empty"><i class="fas fa-magnifying-glass"></i> ไม่พบโค้ดที่ตรงกัน</div>'
    : opts.slice(0, MAX).map(function(o, i){
        return '<div class="pp-opt" data-code="'+o.code.replace(/"/g,'&quot;')+'" data-idx="'+i+'" onmousedown="ppSelect(this)">'+'<span class="pp-code">'+o.code+'</span>'+'<span class="pp-name">'+o.name+'</span>'+'</div>';
      }).join('') + (opts.length > MAX ? '<div class="pp-more">แสดง '+MAX+' จาก '+opts.length+' รายการ — พิมพ์เพื่อกรอง</div>' : '');
  drop.classList.add('open');
}
function ppHide(inp) {
  setTimeout(function(){
    var drop = inp.parentNode.querySelector('.pp-drop');
    if (drop) drop.classList.remove('open');
  }, 180);
}
function ppSelect(el) {
  var code = el.getAttribute('data-code');
  var inp = el.closest('.pp-wrap').querySelector('input');
  if (inp) inp.value = code;
  var drop = el.closest('.pp-drop');
  if (drop) drop.classList.remove('open');
  if (typeof mkBtnCommit === 'function') mkBtnCommit(code);
}
function ppKey(inp, e) {
  var drop = inp.parentNode.querySelector('.pp-drop');
  if (!drop || !drop.classList.contains('open')) return;
  var opts = drop.querySelectorAll('.pp-opt');
  if (!opts.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); __ppActive = Math.min(__ppActive+1, opts.length-1); opts.forEach(function(o,i){ o.classList.toggle('pp-active',i===__ppActive); }); if(opts[__ppActive]) opts[__ppActive].scrollIntoView({block:'nearest'}); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); __ppActive = Math.max(__ppActive-1, 0); opts.forEach(function(o,i){ o.classList.toggle('pp-active',i===__ppActive); }); if(opts[__ppActive]) opts[__ppActive].scrollIntoView({block:'nearest'}); }
  else if (e.key === 'Enter' && __ppActive >= 0) { e.preventDefault(); ppSelect(opts[__ppActive]); }
  else if (e.key === 'Escape') { drop.classList.remove('open'); }
}
</script>
