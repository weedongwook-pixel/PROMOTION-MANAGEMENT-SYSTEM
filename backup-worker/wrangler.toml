# Separate read-only backup Worker; do not deploy as the public website.
name = "potato-promo-d1-backup"
main = "worker.js"
compatibility_date = "2026-09-30"

[vars]
ACCOUNT_ID = "7b876473ae91c694208d59088294eeba"
DATABASE_ID = "40a82f9e-703e-4816-9822-dcf8fd461f06"

[[workflows]]
name = "potato-promo-d1-daily-backup"
binding = "BACKUP_WORKFLOW"
class_name = "DailyD1BackupWorkflow"
# Cloudflare cron is UTC; 17:00 UTC = 00:00 Asia/Bangkok.
schedules = ["0 17 * * *"]

[[r2_buckets]]
binding = "BACKUP_BUCKET"
bucket_name = "potato-promo-d1-backups"
